          const pm = pointAtT((a + b) / 2, WH, R, A, rot, tilt, cx, cy);
          slots.push({ day, hour, half, a, b, p: pm });
        }
      }
    }
    drawSpokesDepth(segs, 0.7 * sceneScale, alphaMain * alphaDetail, restAmt);

    /* Hover panel: the hour cell under the cursor tints in the
       light of that hour; sleep, work and free time hold
       different weights. */

    if (mouseX >= 0 && infoAmt > 0.05) {
      let hov = null;
      let hd = 22;
      for (const sl of slots) {
        const dist = Math.hypot(mouseX - sl.p.x, mouseY - sl.p.yBase);
        if (dist < hd) { hd = dist; hov = sl; }
      }
      if (hov) {
        fillBand(
          WH, R, A, rot, tilt, cx, cy,
          hov.a, hov.b,
          daylightColor(hov.hour + 0.5),
          // Enough to read against a lit space rather than a black one.
          hourCategoryAlpha(hov.day, hov.hour) * 1.9 *
            alphaMain * alphaDetail * infoAmt
        );

        const dateMs = cupDate(hov.day);
        const startMin = hov.hour * 60 + (hov.half ? 30 : 0);
        const hh = String(hov.hour).padStart(2, "0");
        const hh2 = String((hov.hour + 1) % 24).padStart(2, "0");

        // If this chunk already carries a moment, the strip names it rather
        // than offering to add another.
        const existing = (eventsByDate.get(dateMs) || [])
          .find(ev => ev.startMin === startMin);

        hoverInfo =
          `${infoDate(dateMs)} · ` +
          (hov.half ? `${hh}:30 - ${hh2}:00` : `${hh}:00 - ${hh}:30`) +
          (existing
            ? ` · ${existing.title} · click to open the day`
            : ` · ${hourCategoryName(hov.day, hov.hour)} · click to add`);

        // The chunk under the cursor is the one target. It carries its own
        // tag if it has one, so a click edits that and never a neighbour's.
        hoverSlot = { dateMs, startMin, existing: existing || null, dist: hd };
      }
    }

    /* Hour labels: all 24, uniform, pure zoom scaling.
       4.5 is the verified overlap-free maximum. Labels fall
       away with distance like the line does. */

    const hourFont = 4.5 * effZoom;

    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = `${hourFont}px Helvetica, Arial`;

    // One uniform row: every hour along the base, nothing
    // tucked under the curve.
    for (const s of spokes) {
      const yL = s.p.yBase + hourFont * 1.3;
      ctx.globalAlpha = alphaMain * alphaDetail * infoAmt *
        (0.35 + 0.65 * s.dn) * nowYield(s.p.x, yL);
      ctx.fillText(String(s.hour).padStart(2, "0"), s.p.x, yL);
    }

    /* Day names at crests, each with its date number.
       Streamed: each day slot shows the occurrence nearest the
       spin - spin forward and dates slip through the seam one
       by one, next week's days emerging as this week's leave. */

    const dayFont = 16 * effZoom;
    ctx.font = `${dayFont}px Helvetica, Arial`;

    const monday = mondayMsOf(k);
    const spinFwd = -camera.yaw; // forward-in-time is negative yaw here

    const daySpinFade = clamp(0, 1, spinSpeed / 0.0015);

    /* Seven cups, one per curve. A cup is fixed to its curve and rides the
       crown round with it. Labels sit on EVERY curve: when the crown is still
       the back ones stay readable, and as it spins they fall to black so a
       date changing hands at the back is never seen. Eased by spin speed, so
       the back fades out as it speeds up and back in as it slows. */
    for (let cup = 0; cup < 7; cup++) {
      const t = (cup + 0.5) / 7;
      const p = pointAtT(t, WH, R, A, rot, tilt, cx, cy);
      const ang = -t * TAU + rot;
      const front = Math.sin(ang);              // +1 nearest camera, -1 far

      /* The ring is a window on a continuous line of days. The front always
         reads now plus however far the crown has turned (one turn = 7 days),
         and every cup sits at its own angular offset from that front, folded
         to the nearest half turn. One rounding, measured from the moving
         front - so at rest today sits dead centre with the dates running
         around it, and spinning rolls them consecutively in both directions.
         A cup's date only changes as it passes the dead back, where the fold
         flips and the fade hides it. */
      const dateMs = cupDate(cup);
      const dow = (new Date(dateMs).getUTCDay() + 6) % 7;

      const num = String(new Date(dateMs).getUTCDate()).padStart(2, "0");
      const dayLbl = `${DAYS[dow]} ${num}`;

      /* Grey fill riding depth and spin. At rest the back stays legible; a
         spin drives it to black across the back curves, hiding the swap. */
      const lumSpin = clamp(0, 1, (front + 0.55) / 1.15);
      const lumRest = clamp(0.6, 1, (front + 1.4) / 2.4);
      const lum = lumRest + (lumSpin - lumRest) * daySpinFade;
      const g = Math.round(210 * lum);

      ctx.font = `${dayFont * 0.85}px Helvetica, Arial`;
      const dayHalfW = ctx.measureText(dayLbl).width / 2;
      const yL = markerY(t, WH, R, A, rot, tilt, cx, cy, dayFont * 1.6, dayHalfW);

      ctx.fillStyle = `rgb(${g}, ${g}, ${g})`;
      ctx.globalAlpha = alphaMain * alphaDetail * infoAmt;
      ctx.fillText(dayLbl, p.x, yL);
      ctx.font = `${dayFont}px Helvetica, Arial`;

      if (collectHits) {
        hitTargets.push({
          x: p.x,
          y: yL,
          r: Math.max(18, dayFont * 1.6),
          // The label is the way into its day. It wins a click outright, so a
          // half-hour chunk lying near it can never take you to the day
          // before - the chunks either side of a label belong to different
          // days, and the label names only one of them.
          primary: true,
          hint: `Open ${infoDate(dateMs)}`,
          action: () => diveIntoDay(dateMs)
        });
      }
    }

    /* Tagged moments. A tagged half-hour stays lit as a coloured block on the
       form itself - the chunk you named, held. No bead, no text on the crown:
       the title belongs to the strip at the bottom of the screen, which names
       it on rollover or click. The block fades with the engraving and clears
       at rest, like every other marker. */

    for (let cup = 0; cup < 7; cup++) {
      const dMs = cupDate(cup);
      const list = eventsByDate.get(dMs);
      if (!list) continue;

      for (const ev of list) {
        const hour = Math.floor(ev.startMin / 60);
        const half = ev.startMin % 60 >= 30 ? 1 : 0;
        const [a, b] = halfSpan(cup, hour, half);

        const pm = pointAtT((a + b) / 2, WH, R, A, rot, tilt, cx, cy);

        /* The lift follows exactly the chunk the cursor has picked, so what
           lights up is always what a click will act on. The strip text is
           owned by that same hover, never by this block, so the two can't
           describe different moments. */
        const over = hoverSlot &&
          hoverSlot.dateMs === dMs && hoverSlot.startMin === ev.startMin;

        // Present without the cursor so tags can be seen at a glance, and
        // brighter as the engraving wakes.
        const tagAlpha = alphaMain * alphaDetail * (1 - restAmt) *
          (0.45 + 0.55 * infoAmt) * (over ? 1.5 : 1) * nowYield(pm.x, pm.yBase);

        fillBand(
          WH, R, A, rot, tilt, cx, cy, a, b,
          daylightColor(hour + 0.5),
          clamp(0, 1, 0.72 * tagAlpha)
        );
      }
    }

    ctx.globalAlpha = alphaMain * alphaDetail;
  }

  /* The red now: HH:MM riding the wave, only on the real
     current week. Anchored; the wave travels beneath it. */

  if (showsNow) {
    ctx.globalAlpha = alphaMain;

    const pNow = pointAtT(timeState.t, WH, R, A, rot, tilt, cx, cy);
    const timeFont = 12 * effZoom;
    const hourFloat = timeState.h + timeState.m / 60;

    // Hugs the curve, holding a constant gap off the line across its whole
    // width, so it never touches the wave and never fights the day marker
    // floating higher above the peak.
    /* The seconds are set half the size of the hour and the minute, and hang
       off the end of them. They are the one number on the whole crown that
       moves on its own - everything else waits for you - so they are drawn
       small enough to be a detail rather than a readout. */
    const nowHM = `${String(timeState.h).padStart(2, "0")}:${String(timeState.m).padStart(2, "0")}`;
    const nowSS = `:${String(timeState.s || 0).padStart(2, "0")}`;
    const secFont = timeFont * 0.5;

    ctx.font = `${timeFont}px Helvetica, Arial`;
    const wHM = ctx.measureText(nowHM).width;
    ctx.font = `${secFont}px Helvetica, Arial`;
    const wSS = ctx.measureText(nowSS).width;

    const nowLblW = nowHM;
    const nowHalfW = (wHM + wSS) / 2;
    ctx.font = `${timeFont}px Helvetica, Arial`;
    const nowY = markerY(
      timeState.t, WH, R, A, rot, tilt, cx, cy, timeFont * 0.55, nowHalfW
    );

    /* No halo. The time is the brightest thing on the form already, and a
       pool of light behind it only reads as a smudge once the space itself
       is lit. */
    ctx.fillStyle = daylightColor(hourFloat);
    ctx.textAlign = "left";
    const nowLeft = pNow.x - nowHalfW;
    ctx.font = `${timeFont}px Helvetica, Arial`;
    ctx.fillText(nowHM, nowLeft, nowY - timeFont * 0.4);
    ctx.font = `${secFont}px Helvetica, Arial`;
    ctx.fillText(nowSS, nowLeft + wHM, nowY - timeFont * 0.4);
    ctx.font = `${timeFont}px Helvetica, Arial`;
    ctx.textAlign = "center";
  }

  ctx.globalAlpha = 1;
}

/* --- MONTH crown: one crest per week, days engraved --- */

function drawMonthCrown(mAbs, cx, cy, effZoom, alphaMain, alphaDetail, rot, collectHits) {
  const weeks = monthCrownWeeks(mAbs);
  const N = weeks.length;
  const WH = waveHeights(N);
  const R = CONFIG.baseRadius * effZoom;
  const A = CONFIG.baseAmplitude * effZoom;
  const tilt = camera.tilt;
  const sceneScale = clamp(0.12, 3.0, effZoom);

  drawWaveLine(N, R, A, rot, tilt, cx, cy, 1.6 * sceneScale, alphaMain);
  ctx.globalAlpha = alphaMain;

  /*
    While streaming, the crown's identity follows the week at
    front and centre: its month names the title and decides
    which days read as native versus dimmed spill.
  */
  let refMonth = mAbs;
  {
    let best = Infinity;
    for (let w = 0; w < N; w++) {
      const kw = crownK(w, N, rot - camera.yaw, camera.yaw);
      const angle = -((w + 0.5) / N) * 2 * Math.PI + rot;
      const d = Math.abs(Math.atan2(Math.sin(angle - Math.PI / 2),
                                    Math.cos(angle - Math.PI / 2)));
      if (d < best) {
        best = d;
        const mid = new Date(mondayMsOf(weeks[w] + N * kw) + 3 * DAY_MS);
        refMonth = mid.getUTCFullYear() * 12 + mid.getUTCMonth();
      }
    }
  }

  /* Month title top right */

  ctx.globalAlpha = alphaMain * infoAmt;
  ctx.font = `${20 * effZoom}px Helvetica, Arial`;
  ctx.fillStyle = "#fff";
  ctx.textAlign = "right";
  ctx.fillText(monthTitle(refMonth), cx + R, cy - R * tilt - A - 30 * effZoom);
  ctx.globalAlpha = alphaMain;

  if (alphaDetail > 0) {
    ctx.globalAlpha = alphaMain * alphaDetail;

    /* Day spokes: 7 per crest, evenly spaced. The day/night
       shape doesn't carry meaning at this magnification; the
       form stays for consistency. */

    const days = [];
    const segs = [];
    const dnOf = p => clamp(0, 1, ((p.yBase - cy) / (R * tilt) + 1) / 2);

    const spinFwd = -camera.yaw;

    for (let w = 0; w < N; w++) {
      const kw = crownK(w, N, rot - camera.yaw, camera.yaw);
      const wk = weeks[w] + N * kw;
      const monday = mondayMsOf(wk);
      for (let d = 0; d < 7; d++) {
        const date = new Date(monday + d * DAY_MS);
        const inMonth =
          date.getUTCFullYear() * 12 + date.getUTCMonth() === refMonth;

        const t = (w + MONTH_DAY_OFFSETS[d]) / N;
        const p = pointAtT(t, WH, R, A, rot, tilt, cx, cy);
        const dn = dnOf(p);

        segs.push({ x1: p.x, y1: p.y, x2: p.x, y2: p.yBase, dn });

        days.push({
          p,
          dn,
          t,
          dateMs: monday + d * DAY_MS,
          weekK: wk,
          dayIdx: d,
          num: date.getUTCDate(),
          inMonth,
          isToday: monday + d * DAY_MS === timeState.dateMs
        });
      }
    }
    drawSpokesDepth(segs, 0.7 * sceneScale, alphaMain * alphaDetail, restAmt);

    /* Hover panel: the day under the cursor tints by kind -
       workday steel, weekend gold, bank holiday coral. */

    if (mouseX >= 0 && infoAmt > 0.05) {
      let hov = null;
      let hd = 28;
      for (const d of days) {
        const dist = Math.hypot(mouseX - d.p.x, mouseY - d.p.yBase);
        if (dist < hd) { hd = dist; hov = d; }
      }
      if (hov) {
        const half = 1 / (14 * N);
        const cat = dayCategory(hov.dateMs, hov.dayIdx);
        fillBand(
          WH, R, A, rot, tilt, cx, cy,
          hov.t - half, hov.t + half,
          cat.color,
          cat.alpha * alphaMain * alphaDetail * infoAmt
        );

        hoverInfo =
          `${infoDate(hov.dateMs)} ${new Date(hov.dateMs).getUTCFullYear()}` +
          ` · ${dayCategoryName(hov.dateMs, hov.dayIdx)}`;

        const hEvs = eventsByDate.get(hov.dateMs);
        if (hEvs && hEvs.length) {
          hoverInfo += ` · ${hEvs.length} event${hEvs.length > 1 ? "s" : ""}`;
        }
      }
    }

    /* Every day individually numbered in one clean row along
       the bottom of the curve - the base ring, not the wave.
       ~35 slots vs the week's 224, so 10/zoom sits far inside
       the verified safety margin. Days spilling in from
       neighbouring months dim; today reads red. */

    const dayFont = 10 * effZoom;
    ctx.textAlign = "center";
    ctx.font = `${dayFont}px Helvetica, Arial`;

    const nowCol = daylightColor(timeState.h + timeState.m / 60);

    /* The projected day: where the front of the crown points once spun off
       now. It gets the same treatment as today - spotlight, day name on the
       crest, number below the stem - so navigating reads the same as the now
       marker, just in the projection tone. Today fades only as the crown
       actually spins away, not when the cursor merely moves, and the two
       never both hold the stage. */
    const spunOffMonth = Math.abs(camera.yaw) > 0.03 && !layerAnim;
    const nowMarkerAmt = clamp(0, 1, 1 - Math.abs(camera.yaw) / (0.6 * TAU));
    let projDayMs = null;
    if (spunOffMonth) {
      const pm = projectionMoment();
      const pd = new Date(pm.ms);
      projDayMs = Date.UTC(pd.getUTCFullYear(), pd.getUTCMonth(), pd.getUTCDate());
    }

    nowSpot = null;
    for (const d of days) {
      if (d.isToday) {
        nowSpot = { x: d.p.x, y: d.p.yBase + dayFont * 0.9, r: 30 * effZoom };
      }
      d.isProjected = projDayMs !== null && d.dateMs === projDayMs && !d.isToday;
    }

    for (const d of days) {
      const weekend = d.dayIdx >= 5;

      ctx.fillStyle = d.isToday ? nowCol
                    : d.isProjected ? "#b9b9b9"
                    : d.inMonth ? "#fff" : "#5a5f65";
      // Weekends hold full presence; weekdays sit back a touch.
      // Today is the layer's "now": it never fades.
      const priority = weekend ? 1 : 0.72;
      const numY = d.p.yBase + dayFont * 1.3;

      /* A tagged day reads as a coloured block across its own slice of the
         form, the same language as the week and day crowns. The titles stay
         in the strip at the bottom of the screen, never on the crown. */
      const evs = eventsByDate.get(d.dateMs);
      if (evs && evs.length) {
        const half = 1 / (14 * N);
        const overTag = mouseX >= 0 &&
          Math.hypot(mouseX - d.p.x, mouseY - d.p.yBase) < Math.max(16, 18 * effZoom);

        fillBand(
          WH, R, A, rot, tilt, cx, cy,
          d.t - half, d.t + half,
          daylightColor(12),
          clamp(0, 1, 0.68 * alphaMain * alphaDetail * (1 - restAmt) *
            (0.45 + 0.55 * infoAmt) * (overTag ? 1.5 : 1) *
            nowYield(d.p.x, d.p.yBase))
        );

        if (overTag) {
          hoverInfo = `${infoDate(d.dateMs)} · ` +
            evs.map(ev => `${minToHHMM(ev.startMin)} ${ev.title}`).join(" · ");
        }
      }

      ctx.globalAlpha = d.isToday
        ? alphaMain * alphaDetail * nowMarkerAmt
        : d.isProjected
        ? alphaMain * alphaDetail * projFade * 0.7
        : alphaMain * alphaDetail * infoAmt * priority *
          (0.35 + 0.65 * d.dn) * nowYield(d.p.x, numY);
      ctx.fillText(String(d.num).padStart(2, "0"), d.p.x, numY);

      // The day name rides the crest, like the week and day crowns. Today in
      // the colour of the light; the projected day mirrors it, more faded.
      if (d.isToday || d.isProjected) {
        ctx.save();
        ctx.globalAlpha = d.isToday
          ? alphaMain * alphaDetail * nowMarkerAmt
          : alphaMain * alphaDetail * projFade * 0.7;
        ctx.fillStyle = d.isToday ? nowCol : "#b9b9b9";
        ctx.font = `${dayFont * 1.05}px Helvetica, Arial`;
        ctx.fillText(DAYS[d.dayIdx], d.p.x, d.p.y - dayFont * 0.9);
        ctx.restore();
        ctx.font = `${dayFont}px Helvetica, Arial`;
      }

      // Touch a number and its day letter surfaces beside it
      if (mouseX >= 0) {
        const distC = Math.hypot(mouseX - d.p.x, mouseY - numY);
        const near = clamp(0, 1, 1 - (distC - 10) / 22);
        if (near > 0.01) {
          ctx.globalAlpha = alphaMain * alphaDetail * infoAmt * near;
          ctx.fillStyle = "#b9b9b9";
          ctx.font = `${dayFont * 0.85}px Helvetica, Arial`;
          ctx.fillText(DAY_LETTERS[d.dayIdx], d.p.x + dayFont * 1.5, numY);
          ctx.font = `${dayFont}px Helvetica, Arial`;
        }
      }

      if (collectHits) {
        hitTargets.push({
          x: d.p.x,
          y: (d.p.y + d.p.yBase) / 2,
          r: Math.max(14, dayFont * 2),
          hint: `Open the week of ${infoDate(d.dateMs)}`,
          action: () => diveIntoWeek(d.weekK, d.dayIdx)
        });
      }
    }

    /* Week crest labels: the date span of each week */

    const crestFont = 13 * effZoom;
    ctx.font = `${crestFont}px Helvetica, Arial`;
    ctx.fillStyle = "#fff";

    for (let w = 0; w < N; w++) {
      const kw = crownK(w, N, rot - camera.yaw, camera.yaw);
      const p = pointAtT((w + 0.5) / N, WH, R, A, rot, tilt, cx, cy);
      ctx.globalAlpha = alphaMain * alphaDetail * infoAmt * (0.45 + 0.55 * dnOf(p));
      ctx.fillText(weekCrestLabel(weeks[w] + N * kw), p.x, p.y - crestFont * 0.9);
    }

    ctx.globalAlpha = alphaMain * alphaDetail;
  }

  ctx.globalAlpha = 1;
}

/* --- YEAR crown: 12 crests, one per month --- */


function drawYearWeekCrown(year, cx, cy, effZoom, alphaMain, alphaDetail, rot, collectHits) {
  const weeks = yearCrownWeeks(year);
  const N = weeks.length;

  const mm = yearMorphNow();
  let WH = waveHeights(N);
  const R = CONFIG.baseRadius * effZoom;
  let A = CONFIG.baseAmplitude * effZoom;
  const tilt = camera.tilt;
  const sceneScale = clamp(0.12, 3.0, effZoom);

  if (mm) {
    alphaDetail *= mm.detail;
    WH = peaksAt(N, mm.inWidth, 0);
    drawWaveLine(mm.from, R, A, rot, tilt, cx, cy, 1.6 * sceneScale,
                 alphaMain * mm.outAlpha, 1.5, peaksAt(mm.from, mm.outWidth, 1));
    drawWaveLine(mm.to, R, A, rot, tilt, cx, cy, 1.6 * sceneScale,
                 alphaMain * mm.inAlpha, 1.5, peaksAt(mm.to, mm.inWidth, 0));
  } else {
    drawWaveLine(N, R, A, rot, tilt, cx, cy, 1.6 * sceneScale, alphaMain);
  }
  ctx.globalAlpha = alphaMain;

  // Which year the slot at front is showing, for the corner label.
  let refYear = year;
  {
    let best = Infinity;
    for (let w = 0; w < N; w++) {
      const angle = ((w + 0.5) / N) * TAU + rot;
      const d = Math.abs(Math.atan2(Math.sin(angle - Math.PI / 2),
                                    Math.cos(angle - Math.PI / 2)));
      if (d < best) {
        best = d;
        refYear = year + crownK(w, N, rot - camera.yaw, camera.yaw);
      }
    }
  }

  ctx.globalAlpha = alphaMain * infoAmt;
  ctx.font = `${20 * effZoom}px Helvetica, Arial`;
  ctx.fillStyle = "#fff";
  ctx.textAlign = "right";
  ctx.fillText(String(refYear), cx + R, cy - R * tilt - A - 30 * effZoom);
  ctx.globalAlpha = alphaMain;

  if (alphaDetail <= 0) { ctx.globalAlpha = 1; return; }

  ctx.globalAlpha = alphaMain * alphaDetail;

  const dnOf = p => clamp(0, 1, ((p.yBase - cy) / (R * tilt) + 1) / 2);
  const segs = [];
  const marks = [];   // month firsts, for the labels above the curve
  const tagged = [];  // days carrying a moment, for their panels

  // Every day of the year is a stem. Each week slot streams independently,
  // pulling its days from whichever year that slot is showing.
  for (let w = 0; w < N; w++) {
    const yr = year + crownK(w, N, rot - camera.yaw, camera.yaw);
    const wk = yearCrownWeeks(yr);
    const k = wk[Math.min(w, wk.length - 1)];
    const monday = mondayMsOf(k);

    for (let d = 0; d < 7; d++) {
      const t = (w + MONTH_DAY_OFFSETS[d]) / N;
      const p = pointAtT(t, WH, R, A, rot, tilt, cx, cy);
      segs.push({ x1: p.x, y1: p.y, x2: p.x, y2: p.yBase, dn: dnOf(p) });

      const date = new Date(monday + d * DAY_MS);
      if (date.getUTCDate() === 1 && date.getUTCFullYear() === yr) {
        marks.push({ t, mo: date.getUTCMonth() });
      }

      const dMs = monday + d * DAY_MS;
      const evs = eventsByDate.get(dMs);
      if (evs && evs.length) tagged.push({ t, p, dMs, evs });
    }

    if (collectHits) {
      const tw = (w + 0.5) / N;
      const p = pointAtT(tw, WH, R, A, rot, tilt, cx, cy);
      hitTargets.push({
        x: p.x,
        y: (p.y + p.yBase) / 2,
        r: Math.max(10, 26 * effZoom / Math.max(1, N / 14)),
        hint: `Open ${weekLabel(k)}`,
        action: () => diveIntoWeekFromYear(k)
      });
    }
  }

  drawSpokesDepth(segs, 0.7 * sceneScale, alphaMain * alphaDetail, restAmt);

  /* Tagged days: one coloured block per day that carries a moment, a single
     day of the ring wide - the same language every other crown uses. Titles
     stay in the strip at the bottom of the screen. */
  {
    const halfDay = 1 / (14 * N);
    for (const g of tagged) {
      const over = mouseX >= 0 &&
        Math.hypot(mouseX - g.p.x, mouseY - g.p.yBase) < Math.max(9, 11 * effZoom);

      fillBand(
        WH, R, A, rot, tilt, cx, cy,
        g.t - halfDay, g.t + halfDay,
        daylightColor(12),
        clamp(0, 1, 0.72 * alphaMain * alphaDetail * (1 - restAmt) *
          (0.45 + 0.55 * infoAmt) * (over ? 1.6 : 1) * nowYield(g.p.x, g.p.yBase))
      );

      if (over) {
        hoverInfo = `${infoDate(g.dMs)} · ` +
          g.evs.map(ev => `${minToHHMM(ev.startMin)} ${ev.title}`).join(" · ") +
          ` · click to open the week`;
      }

      /* A tagged day is a way in. Click it here and you drop to the week
         holding it; click it again there and you drop to the day itself. */
      if (collectHits) {
        // Same point and reach the hover uses, so what lights up is what a
        // click lands on.
        hitTargets.push({
          x: g.p.x, y: g.p.yBase,
          r: Math.max(9, 11 * effZoom),
          hint: `Open the week of ${infoDate(g.dMs)}`,
          action: () => diveIntoWeekFromYear(weekOffsetOfDate(g.dMs))
        });
      }
    }
  }

  /* Now: the needle through the curve at today, and the date riding above
     it in the colour of the light - the same marker every crown carries. */

  nowSpot = null;
  {
    const wToday = weeks.indexOf(0);
    const shownYr = wToday >= 0
      ? year + crownK(wToday, N, rot - camera.yaw, camera.yaw)
      : null;

    if (wToday >= 0 && shownYr === Math.floor(timeState.monthAbs / 12)) {
      const t = (wToday + MONTH_DAY_OFFSETS[timeState.dayIdx]) / N;
      const p = pointAtT(t, WH, R, A, rot, tilt, cx, cy);
      const nowColNeedle = daylightColor(timeState.h + timeState.m / 60);

      const timeFont = 12 * effZoom;
      const d = new Date(timeState.dateMs);
      const nowLbl =
        `${String(d.getUTCDate()).padStart(2, "0")} ${MONTHS[d.getUTCMonth()]}`;
      ctx.font = `${timeFont}px Helvetica, Arial`;
      const nowHalfW = ctx.measureText(nowLbl).width / 2;
      const nowY = markerY(t, WH, R, A, rot, tilt, cx, cy, timeFont * 0.55, nowHalfW);

      nowSpot = { x: p.x, y: nowY - timeFont * 0.4, r: 40 * effZoom };

      ctx.globalAlpha = alphaMain;
      ctx.strokeStyle = nowColNeedle;
      ctx.lineWidth = 1.4 * sceneScale;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x, p.yBase);
      ctx.stroke();

      ctx.fillStyle = nowColNeedle;
      ctx.textAlign = "center";
      ctx.fillText(nowLbl, p.x, nowY - timeFont * 0.4);
      ctx.globalAlpha = alphaMain * alphaDetail;
    }
  }

  /* Month names above the curve at each month's first day. Twelve landmarks
     across the whole year, styled like every other unit label: grey fill
     riding depth and spin, held a constant gap clear of the line. */

  const monthFont = 13 * effZoom;
  ctx.font = `${monthFont}px Helvetica, Arial`;
  ctx.textAlign = "center";

  const spinFade = clamp(0, 1, spinSpeed / 0.0015);

  for (const m of marks) {
    const p = pointAtT(m.t, WH, R, A, rot, tilt, cx, cy);
    const ang = -m.t * TAU + rot;
    const front = Math.sin(ang);

    const lumSpin = clamp(0, 1, (front + 0.55) / 1.15);
    const lumRest = clamp(0.6, 1, (front + 1.4) / 2.4);
    const lum = lumRest + (lumSpin - lumRest) * spinFade;
    const g = Math.round(210 * lum);

    const halfW = ctx.measureText(MONTHS[m.mo]).width / 2;
    const yL = markerY(m.t, WH, R, A, rot, tilt, cx, cy, monthFont * 1.6, halfW);

    ctx.fillStyle = `rgb(${g}, ${g}, ${g})`;
    ctx.globalAlpha = alphaMain * alphaDetail * infoAmt * nowYield(p.x, yL);
    ctx.fillText(MONTHS[m.mo], p.x, yL);
  }

  ctx.globalAlpha = 1;
}

/* --- YEAR crown: 12 crests, one per month --- */

function drawYearCrown(year, cx, cy, effZoom, alphaMain, alphaDetail, rot, collectHits) {
  if (yearMode === "weeks") {
    return drawYearWeekCrown(
      year, cx, cy, effZoom, alphaMain, alphaDetail, rot, collectHits
    );
  }

  const mm = yearMorphNow();
  let WH = waveHeights(12);
  const R = CONFIG.baseRadius * effZoom;
  let A = CONFIG.baseAmplitude * effZoom;
  const tilt = camera.tilt;
  const sceneScale = clamp(0.12, 3.0, effZoom);

  if (mm) {
    alphaDetail *= mm.detail;
    WH = peaksAt(12, mm.outWidth, 0);
  }

  /*
    The year reads forward like the week and month crowns:
    months proceed anticlockwise, left-to-right forward in time,
    so a future strand or spiral stays coherent across layers.
  */
  const tY = t => t;

  if (mm) {
    drawWaveLine(mm.from, R, A, rot, tilt, cx, cy, 1.6 * sceneScale,
                 alphaMain * mm.outAlpha, 1.5, peaksAt(mm.from, mm.outWidth, 1));
    drawWaveLine(mm.to, R, A, rot, tilt, cx, cy, 1.6 * sceneScale,
                 alphaMain * mm.inAlpha, 1.5, peaksAt(mm.to, mm.inWidth, 0));
  } else {
    drawWaveLine(12, R, A, rot, tilt, cx, cy, 1.6 * sceneScale, alphaMain);
  }
  ctx.globalAlpha = alphaMain;

  /*
    Streaming identity: the year in the corner follows the
    month at front and centre. The year runs mirrored, so
    forward-in-time spin is positive yaw here.
  */
  let refYear = year;
  {
    let best = Infinity;
    for (let mo = 0; mo < 12; mo++) {
      const angle = ((mo + 0.5) / 12) * 2 * Math.PI + rot;
      const d = Math.abs(Math.atan2(Math.sin(angle - Math.PI / 2),
                                    Math.cos(angle - Math.PI / 2)));
      if (d < best) {
        best = d;
        refYear = year + crownK(mo, 12, rot - camera.yaw, camera.yaw);
      }
    }
  }

  /* Year top right */

  ctx.globalAlpha = alphaMain * infoAmt;
  ctx.font = `${20 * effZoom}px Helvetica, Arial`;
  ctx.fillStyle = "#fff";
  ctx.textAlign = "right";
  ctx.fillText(String(refYear), cx + R, cy - R * tilt - A - 30 * effZoom);
  ctx.globalAlpha = alphaMain;

  if (alphaDetail > 0) {
    ctx.globalAlpha = alphaMain * alphaDetail;

    /* Day lines: a stem for every day of the year, placed by how far through
       its month it falls - the same grain the week and month crowns carry,
       just at year scale. Around 365 of them, so the ring reads as days
       rather than as twelve blocks. Mondays hold a fraction more weight, so
       the weeks still show as a rhythm through the month without needing
       a second set of lines. */

    const dnOf = p => clamp(0, 1, ((p.yBase - cy) / (R * tilt) + 1) / 2);
    const segs = [];
    const segsWeek = [];
    const tagged = [];        // days carrying a moment, for their panels

    // Each month slot streams independently: its days come from the year it
    // is currently showing.
    for (let mo = 0; mo < 12; mo++) {
      const yr = year + crownK(mo, 12, rot - camera.yaw, camera.yaw);
      const dim = new Date(Date.UTC(yr, mo + 1, 0)).getUTCDate();

      for (let day = 1; day <= dim; day++) {
        const d = new Date(Date.UTC(yr, mo, day));
        const isMonday = (d.getUTCDay() + 6) % 7 === 0;

        const t = (mo + (day - 1) / dim) / 12;
        const p = pointAtT(tY(t), WH, R, A, rot, tilt, cx, cy);
        const seg = { x1: p.x, y1: p.y, x2: p.x, y2: p.yBase, dn: dnOf(p) };
        (isMonday ? segsWeek : segs).push(seg);

        const dMs = Date.UTC(yr, mo, day);
        const evs = eventsByDate.get(dMs);
        if (evs && evs.length) {
          tagged.push({ t, p, dMs, evs, half: 1 / (dim * 12 * 2) });
        }
      }
    }

    // Days first as the fine grain, then the Mondays over them a little
    // stronger, so the week rhythm reads without a separate line style.
    drawSpokesDepth(segs, 0.5 * sceneScale, alphaMain * alphaDetail * 0.7, restAmt);
    drawSpokesDepth(segsWeek, 0.7 * sceneScale, alphaMain * alphaDetail, restAmt);

    /* Tagged days: one coloured block per day that carries a moment, exactly
       one day of the ring wide - the same language as the week, day and month
       crowns, just at year scale. Titles stay in the strip at the bottom of
       the screen. Fades with the engraving and clears at rest. */
    for (const g of tagged) {
      const over = mouseX >= 0 &&
        Math.hypot(mouseX - g.p.x, mouseY - g.p.yBase) < Math.max(9, 11 * effZoom);

      fillBand(
        WH, R, A, rot, tilt, cx, cy,
        tY(g.t - g.half), tY(g.t + g.half),
        daylightColor(12),
        clamp(0, 1, 0.72 * alphaMain * alphaDetail * (1 - restAmt) *
          (0.45 + 0.55 * infoAmt) * (over ? 1.6 : 1) * nowYield(g.p.x, g.p.yBase))
      );

      if (over) {
        hoverInfo = `${infoDate(g.dMs)} · ` +
          g.evs.map(ev => `${minToHHMM(ev.startMin)} ${ev.title}`).join(" · ") +
          ` · click to open the week`;
      }

      /* A tagged day is a way in. Click it here and you drop to the week
         holding it; click it again there and you drop to the day itself. */
      if (collectHits) {
        // Same point and reach the hover uses, so what lights up is what a
        // click lands on.
        hitTargets.push({
          x: g.p.x, y: g.p.yBase,
          r: Math.max(9, 11 * effZoom),
          hint: `Open the week of ${infoDate(g.dMs)}`,
          action: () => diveIntoWeekFromYear(weekOffsetOfDate(g.dMs))
        });
      }
    }

    /* Today's line in the curve: the year's needle, placed at
       the exact day within the current month, in the colour of
       the light. Never fades. */

    {
      const mo = ((timeState.monthAbs % 12) + 12) % 12;
      const shownYr = year + crownK(mo, 12, rot - camera.yaw, camera.yaw);

      // The needle lives on whichever slot is showing the
      // current month right now - it streams with the crown.
      nowSpot = null;
      if (shownYr === Math.floor(timeState.monthAbs / 12)) {
        const dim = new Date(Date.UTC(shownYr, mo + 1, 0)).getUTCDate();
        const dom = new Date(timeState.dateMs).getUTCDate();
        const frac = (dom - 1 + (timeState.h + timeState.m / 60) / 24) / dim;

        const t = (mo + frac) / 12;
        const p = pointAtT(tY(t), WH, R, A, rot, tilt, cx, cy);
        const nowColNeedle = daylightColor(timeState.h + timeState.m / 60);

        // The year's now marker reads like the week and day: the date on the
        // curve in the colour of the light, sitting on the same track, a
        // constant buffer clear of the line.
        const timeFont = 12 * effZoom;
        const nowLbl = `${String(dom).padStart(2, "0")} ${MONTHS[mo]}`;
        ctx.font = `${timeFont}px Helvetica, Arial`;
        const nowHalfW = ctx.measureText(nowLbl).width / 2;
        const nowY = markerY(
          tY(t), WH, R, A, rot, tilt, cx, cy, timeFont * 0.55, nowHalfW
        );

        nowSpot = { x: p.x, y: nowY - timeFont * 0.4, r: 40 * effZoom };

        // The needle still marks the exact day inside the month.
        ctx.globalAlpha = alphaMain;
        ctx.strokeStyle = nowColNeedle;
        ctx.lineWidth = 1.4 * sceneScale;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x, p.yBase);
        ctx.stroke();

        ctx.fillStyle = nowColNeedle;
        ctx.textAlign = "center";
        ctx.fillText(nowLbl, p.x, nowY - timeFont * 0.4);

        ctx.globalAlpha = alphaMain * alphaDetail;
      }
    }

    const monthFont = 15 * effZoom;
    ctx.font = `${monthFont}px Helvetica, Arial`;
    ctx.textAlign = "center";

    for (let mo = 0; mo < 12; mo++) {
      const tMo = (mo + 0.5) / 12;
      const ky = crownK(mo, 12, rot - camera.yaw, camera.yaw);
      const p = pointAtT(tY(tMo), WH, R, A, rot, tilt, cx, cy);
      const mAbs = (year + ky) * 12 + mo;
      const isNow = mAbs === timeState.monthAbs;

      /* Same treatment as the week's day markers: a grey fill whose
         luminance rides depth and spin, so a label changing hands at the
         dead back stays hidden against the black, and a constant buffer of
         clear space above the line. The current month is no longer a special
         case here - the coloured now marker on the curve carries that. */
      const ang = -tY(tMo) * TAU + rot;
      const front = Math.sin(ang);
      const spinFade = clamp(0, 1, spinSpeed / 0.0015);
      const lumSpin = clamp(0, 1, (front + 0.55) / 1.15);
      const lumRest = clamp(0.6, 1, (front + 1.4) / 2.4);
      const lum = lumRest + (lumSpin - lumRest) * spinFade;
      const g = Math.round(210 * lum);

      ctx.font = `${monthFont}px Helvetica, Arial`;
      ctx.textAlign = "center";
      const moHalfW = ctx.measureText(MONTHS[mo]).width / 2;
      const yL = markerY(
        tY(tMo), WH, R, A, rot, tilt, cx, cy, monthFont * 1.6, moHalfW
      );

      ctx.fillStyle = `rgb(${g}, ${g}, ${g})`;
      ctx.globalAlpha = alphaMain * alphaDetail * infoAmt * nowYield(p.x, yL);
      ctx.fillText(MONTHS[mo], p.x, yL);

      if (mouseX >= 0 &&
          Math.hypot(mouseX - p.x, mouseY - p.y) < Math.max(24, monthFont * 2)) {
        hoverInfo =
          `${MONTHS_FULL[mo]} ${Math.floor(mAbs / 12)}` +
          (isNow ? ` · Current month` : "");
      }

      if (collectHits) {
        hitTargets.push({
          x: p.x,
          y: p.y,
          r: Math.max(20, monthFont * 2.2),
          hint: `Open ${MONTHS_FULL[mo]} ${Math.floor(mAbs / 12)}`,
          action: () => diveIntoMonth(mAbs)
        });
      }
    }
  }

  ctx.globalAlpha = 1;
}

/* --- DAY crown: one wave around the whole circumference -
   a single day of the week crown, isolated and closed into
   its own ring. The rise and fall is the day and night. --- */

function drawDayCrown(dateMs, cx, cy, effZoom, alphaMain, alphaDetail, rot, collectHits) {
  // The lone wave stands taller and sharper - amplitude up,
  // profile power up - so its flanks climb the way the
  // multi-crest crowns do
  const WH = waveHeights(1, 2.2);
  const R = CONFIG.baseRadius * effZoom;
  const A = CONFIG.baseAmplitude * effZoom * 1.9;

  nowSpot = null;
  const tilt = camera.tilt;
  const sceneScale = clamp(0.12, 3.0, effZoom);

  drawWaveLine(1, R, A, rot, tilt, cx, cy, 1.6 * sceneScale, alphaMain, 2.2);
  ctx.globalAlpha = alphaMain;

  /* Date top right */

  ctx.globalAlpha = alphaMain * infoAmt;
  ctx.font = `${20 * effZoom}px Helvetica, Arial`;
  ctx.fillStyle = "#fff";
  ctx.textAlign = "right";
  // One day per whole turn, in the same direction the spin steps the unit
  // (forward spin = later), so the shown date and the committed day agree
  // through the wrap.
  const shownDateMs = dateMs + Math.round(camera.yaw / TAU) * DAY_MS;

  if (shownDateMs === timeState.dateMs) {
    const tN = tFromHMS(0, timeState.h, timeState.m, timeState.s) * 7;
    const pN = pointAtT(tN, WH, R, A, rot, tilt, cx, cy);
    nowSpot = { x: pN.x, y: pN.y - 12 * effZoom * 1.4, r: 56 * effZoom };
  }
  ctx.fillText(dayTitle(shownDateMs), cx + R, cy - R * tilt - A - 30 * effZoom);
  ctx.globalAlpha = alphaMain;

  if (alphaDetail > 0) {
    ctx.globalAlpha = alphaMain * alphaDetail;

    const dnOf = p => clamp(0, 1, ((p.yBase - cy) / (R * tilt) + 1) / 2);

    /* Hour spokes on the week's own hour mapping: midnight at
       the crest, 01-08 down the wave, 09-23 along the base
       back up. The same day, magnified. */

    const segs = [];
    const marks = [];
    const slots = [];        // every half-hour chunk, for hover and tagging

    // The span of one half-hour chunk on this ring.
    const halfSpanD = (h, half) => {
      const t0 = hourOffsets[h];
      const t1 = h === 23 ? 1.5 : hourOffsets[h + 1];
      const tMid = (t0 + t1) / 2;
      return half ? [tMid, t1] : [t0, tMid];
    };

    for (let h = 0; h < 24; h++) {
      const p = pointAtT(hourOffsets[h], WH, R, A, rot, tilt, cx, cy);
      segs.push({ x1: p.x, y1: p.y, x2: p.x, y2: p.yBase, dn: dnOf(p) });
      marks.push({ h, p, dn: dnOf(p) });

      /* Both halves of every hour are their own target, measured at their own
         midpoints, so the second half is as selectable as the first. */
      for (let half = 0; half < 2; half++) {
        const [a, b] = halfSpanD(h, half);
        const pm = pointAtT((a + b) / 2, WH, R, A, rot, tilt, cx, cy);
        slots.push({ h, half, a, b, p: pm });
      }
    }
    drawSpokesDepth(segs, 0.7 * sceneScale, alphaMain * alphaDetail, restAmt);

    /* Hour numbers: 24 slots on the full ring - enormous room
       against the verified density bounds. */

    const hourFont = 10 * effZoom;
    ctx.font = `${hourFont}px Helvetica, Arial`;
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";

    /* Hover panel: half-hour chunks in the light of the hour */

    if (mouseX >= 0 && infoAmt > 0.05) {
      let hov = null;
      let hd = 26;
      for (const sl of slots) {
        const dist = Math.hypot(mouseX - sl.p.x, mouseY - sl.p.yBase);
        if (dist < hd) { hd = dist; hov = sl; }
      }
      if (hov) {
        const dow = (new Date(shownDateMs).getUTCDay() + 6) % 7;

        fillBand(
          WH, R, A, rot, tilt, cx, cy,
          hov.a, hov.b,
          daylightColor(hov.h + 0.5),
          hourCategoryAlpha(dow, hov.h) * 1.9 *
            alphaMain * alphaDetail * infoAmt
        );

        const startMin = hov.h * 60 + (hov.half ? 30 : 0);
        const hh = String(hov.h).padStart(2, "0");
        const hh2 = String((hov.h + 1) % 24).padStart(2, "0");

        const existing = (eventsByDate.get(shownDateMs) || [])
          .find(ev => ev.startMin === startMin);

        hoverInfo =
          `${infoDate(shownDateMs)} · ` +
          (hov.half ? `${hh}:30 - ${hh2}:00` : `${hh}:00 - ${hh}:30`) +
          (existing
            ? ` · ${existing.title} · click to edit`
            : ` · ${hourCategoryName(dow, hov.h)} · click to add`);

        hoverSlot = { dateMs: shownDateMs, startMin, existing: existing || null, dist: hd };
      }
    }

    // Uniform with the week crown: all hours along the base
    for (const m of marks) {
      const yL = m.p.yBase + hourFont * 1.3;
      ctx.globalAlpha = alphaMain * alphaDetail * infoAmt *
        (0.4 + 0.6 * m.dn) * nowYield(m.p.x, yL);
      ctx.fillText(String(m.h).padStart(2, "0"), m.p.x, yL);
    }

    /* Tagged moments: the named half-hour stays lit as a coloured block on
       the form. The title lives in the strip at the bottom of the screen, not
       on the crown. Fades with the engraving, clears at rest. */

    const list = eventsByDate.get(shownDateMs);
    if (list) {
      for (const ev of list) {
        const hour = Math.floor(ev.startMin / 60);
        const half = ev.startMin % 60 >= 30 ? 1 : 0;
        const [a, b] = halfSpanD(hour, half);

        const pm = pointAtT((a + b) / 2, WH, R, A, rot, tilt, cx, cy);

        // Lift follows the hovered chunk exactly; the strip text belongs to
        // that hover, so what lights up is what a click will act on.
        const over = hoverSlot && hoverSlot.startMin === ev.startMin &&
          hoverSlot.dateMs === shownDateMs;

        const tagAlpha = alphaMain * alphaDetail * (1 - restAmt) *
          (0.45 + 0.55 * infoAmt) * (over ? 1.5 : 1) * nowYield(pm.x, pm.yBase);

        fillBand(
          WH, R, A, rot, tilt, cx, cy, a, b,
          daylightColor(hour + 0.5),
          clamp(0, 1, 0.72 * tagAlpha)
        );
      }
    }

    ctx.globalAlpha = alphaMain * alphaDetail;
  }

  /* Now, floating above the curve in the colour of the light.
     Only on today's crown. */

  if (shownDateMs === timeState.dateMs) {
    ctx.globalAlpha = alphaMain;

    const tDay = tFromHMS(0, timeState.h, timeState.m, timeState.s) * 7;
    const pNow = pointAtT(tDay, WH, R, A, rot, tilt, cx, cy);
    const timeFont = 12 * effZoom;
    const hourFloat = timeState.h + timeState.m / 60;
    const nowGap = timeFont * 0.55;
    // The seconds at half size, as on the week crown.
    const nowHM =
      `${String(timeState.h).padStart(2, "0")}:${String(timeState.m).padStart(2, "0")}`;
    const nowSS = `:${String(timeState.s || 0).padStart(2, "0")}`;
    const secFont = timeFont * 0.5;

    ctx.font = `${timeFont}px Helvetica, Arial`;
    const wHM = ctx.measureText(nowHM).width;
    ctx.font = `${secFont}px Helvetica, Arial`;
    const wSS = ctx.measureText(nowSS).width;

    const nowHalfW = (wHM + wSS) / 2;
    const nowY = markerY(tDay, WH, R, A, rot, tilt, cx, cy, nowGap, nowHalfW);

    ctx.fillStyle = daylightColor(hourFloat);
    ctx.textAlign = "left";
    const nowLeft = pNow.x - nowHalfW;
    ctx.font = `${timeFont}px Helvetica, Arial`;
    ctx.fillText(nowHM, nowLeft, nowY - timeFont * 0.4);
    ctx.font = `${secFont}px Helvetica, Arial`;
    ctx.fillText(nowSS, nowLeft + wHM, nowY - timeFont * 0.4);
    ctx.font = `${timeFont}px Helvetica, Arial`;
    ctx.textAlign = "center";
  }

  ctx.globalAlpha = 1;
}

/*
  Draw a layer's crown for a given unit at a given screen spot.
  unit means: week offset (WEEK), absolute month (MONTH), or
  year (YEAR).
*/
/* ---- Projection: the moment at front-and-centre when spun off now ---- */
function fracOfDay() {
  return (timeState.h * 3600 + timeState.m * 60 + (timeState.s || 0)) / 86400;
}

function minutesFromDayCont(cont) {
  /*
    Invert the day mapping. layerRot builds the day's rest
    rotation from cont = tFromHMS(0,h,m,s) * 7, which runs
    non-linearly from 0.5 (midnight) up to ~1.47 (23:00) and
    wraps back. Given a cont value from the front point, return
    the minutes-into-day whose forward mapping lands closest -
    so the projected clock reads exactly what sits at the marker.
  */
  const target = ((cont - 0.5) % 1 + 1) % 1 + 0.5;   // fold into [0.5,1.5)
  let best = 0, bestErr = Infinity;
  for (let mins = 0; mins < 1440; mins++) {
    const h = Math.floor(mins / 60), m = mins % 60;
    const off = tFromHMS(0, h, m, 0) * 7;             // same forward map
    const err = Math.abs(off - target);
    if (err < bestErr) { bestErr = err; best = mins; }
  }
  return best;
}

function projectionMoment() {
  if (layer === LAYER.DAY) {
    const rot = layerRot(layer, layerUnit(layer)) + camera.yaw;
    const ringPos = (rot - Math.PI / 2) / TAU;
    const restCont = tFromHMS(0, timeState.h, timeState.m, timeState.s || 0) * 7;
    const dayShift = Math.round(ringPos - restCont);
    const mins = minutesFromDayCont(ringPos);
    return {
      ms: timeState.dateMs + dayShift * DAY_MS + mins * 60000,
      hasTime: true
    };
  }

  if (layer === LAYER.WEEK) {
    // now, carried by the spin. One turn = 7 days. Anchored so at
    // rest it equals the current moment (the front shows now).
    const nowMs = timeState.dateMs +
      (timeState.h * 60 + timeState.m) * 60000;
    const restMs = weekOffset === 0
      ? nowMs
      : mondayMsOf(weekOffset) + (timeState.dayIdx + fracOfDay()) * DAY_MS;
    return { ms: restMs + (camera.yaw / TAU) * 7 * DAY_MS, hasTime: true };
  }

  if (layer === LAYER.MONTH) {
    // At rest the front is today; spinning sweeps day by day so
    // the "WED 15" label tracks the marker. One turn = one month.
    const weeks = monthCrownWeeks(selMonthAbs);
    const N = weeks.length;
    const rest = (selMonthAbs === timeState.monthAbs)
      ? timeState.dateMs
      : mondayMsOf(weeks[0]) + 3 * DAY_MS;
    const dayFloat = (camera.yaw / TAU) * (N * 7);
    return { ms: rest + dayFloat * DAY_MS, hasTime: false };
  }

  // Year: at rest the front is the current month; spinning
  // forward (+yaw) moves to later months. One turn = one year.
  const rest = (Math.floor(timeState.monthAbs / 12) === selYear)
    ? timeState.dateMs
    : Date.UTC(selYear, 6, 1);
  const moFloat = (camera.yaw / TAU) * 12;
  return { ms: rest + moFloat * 30.4375 * DAY_MS, hasTime: false };
}

function projectionT(pm) {
  const d = new Date(pm.ms);

  if (layer === LAYER.DAY) {
    return tFromHMS(0, d.getUTCHours(), d.getUTCMinutes(), d.getUTCSeconds()) * 7;
  }

  if (layer === LAYER.WEEK) {
    const dow = (d.getUTCDay() + 6) % 7;
    return tFromHMS(dow, d.getUTCHours(), d.getUTCMinutes(), d.getUTCSeconds());
  }

  if (layer === LAYER.MONTH) {
    const weeks = monthCrownWeeks(selMonthAbs);
    const N = weeks.length;
    // find which week row and day-of-week this date falls on
    for (let w = 0; w < N; w++) {
      const monday = mondayMsOf(weeks[w]);
      const off = (pm.ms - monday) / DAY_MS;
      if (off >= 0 && off < 7) {
        return (w + MONTH_DAY_OFFSETS[Math.floor(off)]) / N;
      }
    }
    return 0;
  }

  // Year in weeks: find the week slot holding the moment, same as the month.
  if (yearMode === "weeks") {
    const weeks = yearCrownWeeks(d.getUTCFullYear());
    const N = weeks.length;
    for (let w = 0; w < N; w++) {
      const monday = mondayMsOf(weeks[w]);
      const off = (pm.ms - monday) / DAY_MS;
      if (off >= 0 && off < 7) {
        return tY((w + MONTH_DAY_OFFSETS[Math.floor(off)]) / N);
      }
    }
    return 0;
  }

  // Year (mirrored ring)
  const mo = d.getUTCMonth();
  const dim = new Date(Date.UTC(d.getUTCFullYear(), mo + 1, 0)).getUTCDate();
  const frac = (d.getUTCDate() - 1 + (d.getUTCHours() + d.getUTCMinutes() / 60) / 24) / dim;
  return tY((mo + frac) / 12);
}

function projLabel(p) {
  const d = new Date(p.ms);
  const dow = (d.getUTCDay() + 6) % 7;
  const base = `${DAYS[dow]} ${String(d.getUTCDate()).padStart(2,"0")} ` +
               `${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  if (!p.hasTime) return `${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  const hh = String(d.getUTCHours()).padStart(2, "0");
  const mm = String(d.getUTCMinutes()).padStart(2, "0");
  return `${base} · ${hh}:${mm}`;
}

function drawLayerCrown(whichLayer, unit, cx, cy, effZoom,
                        alphaMain, alphaDetail, rot, collectHits) {
  if (whichLayer === LAYER.DAY) {
    drawDayCrown(unit, cx, cy, effZoom, alphaMain, alphaDetail, rot, collectHits);
  } else if (whichLayer === LAYER.WEEK) {
    drawWeekCrown(unit, cx, cy, effZoom, alphaMain, alphaDetail, rot, collectHits);
  } else if (whichLayer === LAYER.MONTH) {
    drawMonthCrown(unit, cx, cy, effZoom, alphaMain, alphaDetail, rot, collectHits);
  } else {
    drawYearCrown(unit, cx, cy, effZoom, alphaMain, alphaDetail, rot, collectHits);
  }
}

// The unit currently selected on a layer
function layerUnit(l) {
  if (l === LAYER.DAY) return selDayMs;
  if (l === LAYER.WEEK) return weekOffset;
  if (l === LAYER.MONTH) return selMonthAbs;
  return selYear;
}

// Resting rotation for a layer's crown. The current week is
// special: now stays front and centre, the wave travelling
// beneath the red marker.
function layerRot(l, unit) {
  if (l === LAYER.DAY && unit === timeState.dateMs) {
    // Today rests with now front and centre, the wave
    // travelling beneath the floating time
    const tDay = tFromHMS(0, timeState.h, timeState.m, timeState.s) * 7;
    return Math.PI / 2 + tDay * 2 * Math.PI;
  }
  // Other days rest like a sundial: midnight's crest at the
  // back, the working hours across the front
  if (l === LAYER.DAY) return Math.PI / 2;
  // Every week rests on the same anchor as the current one - today's
  // fraction through the week sets where the seam sits - so spinning from
  // this week to any other never shifts the dates. What works at now works
  // everywhere.
  // The week rests with now at front and centre. The date numbering is a
  // window centred on that same point, so the dates read around today and
  // roll consecutively either way as it turns.
  if (l === LAYER.WEEK) return Math.PI / 2 + timeState.t * 2 * Math.PI;
  if (l === LAYER.MONTH && unit === timeState.monthAbs) {
    // The current month rests with today front and centre,
    // like the time on the week and day crowns
    const weeks = monthCrownWeeks(unit);
    for (let w = 0; w < weeks.length; w++) {
      const monday = mondayMsOf(weeks[w]);
      const d = (timeState.dateMs - monday) / DAY_MS;
      if (d >= 0 && d < 7) {
        const tToday = (w + MONTH_DAY_OFFSETS[d]) / weeks.length;
        return Math.PI / 2 + tToday * 2 * Math.PI;
      }
    }
  }
  if (l === LAYER.MONTH) return homeRot(monthCrownWeeks(unit).length);

  // The year in weeks rests the way the month does: today's week front and
  // centre on the current year, January leading on any other.
  if (l === LAYER.YEAR && yearMode === "weeks") {
    const weeks = yearCrownWeeks(unit);
    if (unit === Math.floor(timeState.monthAbs / 12)) {
      const w = weeks.indexOf(0);
      if (w >= 0) {
        const t = (w + MONTH_DAY_OFFSETS[timeState.dayIdx]) / weeks.length;
        return Math.PI / 2 + t * TAU;
      }
    }
    return homeRot(weeks.length);
  }

  if (l === LAYER.YEAR && unit === Math.floor(timeState.monthAbs / 12)) {
    // The current year rests with today's needle front and
    // centre - the spotlight leads at every magnification
    const mo = ((timeState.monthAbs % 12) + 12) % 12;
    const dim = new Date(Date.UTC(unit, mo + 1, 0)).getUTCDate();
    const dom = new Date(timeState.dateMs).getUTCDate();
    const t = (mo + (dom - 1) / dim) / 12;
    return Math.PI / 2 + t * TAU;   // forward, same as week/month
  }
  // Other years: January front and centre, months anticlockwise
  // (forward-in-time, same reading direction as week and month)
  return Math.PI / 2 + Math.PI / 12;
}




/* =========================
   RADIO
   Music from outside, played as music - full range, straight to the output,
   not through the room's low pass. The crown's own sounds belong under water;
   a record does not.

   The spectrum is what the panels read. Getting at it is the only hard part:
   a browser will not let a page analyse audio from another origin unless that
   origin says it may, and if the stream is routed through the audio graph
   without that permission it goes silent rather than merely unreadable. So
   the permissioned route is tried first and, if nothing comes back, the whole
   graph is abandoned and the stream is played plainly. Music either way; the
   equaliser only when the station allows it.
========================= */

const RADIO = {
  /* The station. This is the stream itself rather than the page that hosts
     it. Overridable at the address with ?radio=<url> */
  url: "https://usa19.fastcast4u.com:8340/;?type=http&nocache=1",   // Disc Break
  el: null,
  on: false,
  wired: false,
  analyser: null,
  bins: null,
  bands: new Float32Array(48),
  reading: false,        // is the spectrum actually coming through
  queue: [],             // addresses still to try
  tried: [],             // addresses that came to nothing
  playingSince: 0,
  told: "",              // the last state we announced, so it is said once
  askedCors: false,      // did we ask this connection to be readable
  plainOnly: false,      // has it already refused once
  startedAt: 0,          // when this address was asked for, to time it out
  showBars: false,       // is the crown reading the music, or just playing it
  drift: 0,              // how far the spectrum has travelled round the ring
  trail: new Float32Array(168),  // the music's own wake, all the way round
  trailPos: 0,
  trailSpeed: 0.0032,    // turns per frame - a lap in about five seconds
  bandAvg: new Float32Array(48),  // each band's own habit, to measure it against
  dyn: new Float32Array(48),      // and how far above it each one is standing
  lowAvg: 0,             // the low end's own average, to measure a beat against
  lowNow: 0,
  beat: 0,               // how far above that it is standing right now
  beatPeak: 0.25,        // the hardest it has hit lately, to measure against
  peak: 0.4,             // the loudest band lately, for scaling the rest
  why: 0,                // the media error code, when one is given
  state: "off"           // off | starting | plain | playing | failed
};

{
  // A remembered address beats the built-in one; an address in the link beats
  // both, so a particular station can be shared as a link.
  try {
    const kept = localStorage.getItem("weekwave.radio.v1");
    if (kept) RADIO.url = kept;
  } catch (e) {}

  const q = new URLSearchParams(location.search);
  if (q.has("radio")) RADIO.url = q.get("radio");
}

/*
  A live stream should never be served from a cache, so the address carries a
  value that changes every time it is asked for. Shoutcast servers use exactly
  this trick, and reusing a stale one can hand back a recording of the moment
  the link was written rather than what is on air.
*/
function radioUrl() {
  const u = RADIO.url;
  const stamp = Date.now().toString(36) +
    Math.floor(Math.random() * 1296).toString(36);
  if (/[?&]nocache=/.test(u)) return u.replace(/([?&]nocache=)[^&]*/, "$1" + stamp);
  return u + (u.includes("?") ? "&" : "?") + "nocache=" + stamp;
}

function radioElement(withCors) {
  const a = new Audio();
  a.preload = "none";
  a.loop = false;
  a.autoplay = false;
  a.volume = 0.85;
  if (withCors) a.crossOrigin = "anonymous";

  /* Declared rather than sniffed. Handed a bare src, the browser works out
     the type from what comes back - and a Shoutcast server's reply is odd
     enough that it often decides the stream is not playable and refuses it.
     Naming the type up front, the way the station's own player does, is the
     difference between silence and music. */
  try {
    const s = document.createElement("source");
    s.src = radioUrl();
    s.type = "audio/mpeg";
    a.appendChild(s);
  } catch (e) {
    a.src = radioUrl();
  }
  return a;
}

/*
  Start the station. The audio graph is built only if the stream permits it;
  otherwise the element plays on its own and the panels stay still.
*/
/*
  Stream addresses are rarely the one you were handed. A Shoutcast server
  wants a trailing semicolon to give up audio rather than its status page,
  some mounts answer on /stream, and a server on a custom port very often
  speaks plain http - which an https page refuses outright. Rather than make
  you guess, this walks the usual forms and stops at the first that plays,
  then says which, so the working one can be kept.
*/
function radioCandidates() {
  const base = RADIO.url;
  const out = [base];
  try {
    const u = new URL(base);
    const q = u.search;
    const host = u.protocol + "//" + u.host;
    const add = p => { const c = host + p + q; if (!out.includes(c)) out.push(c); };
    add("/;");
    add("/");
    add("/stream");
    add("/;stream.mp3");
    add("/live");
    if (location.protocol !== "https:") {
      const plain = base.replace(/^https:/, "http:");
      if (!out.includes(plain)) out.push(plain);
    }
  } catch (e) {}
  return out;
}

/*
  One connection, asked to be readable.

  This used to open two: a plain one for the music and a second, silent one to
  test whether the spectrum could be read. That is what made the equaliser
  come and go - a Shoutcast server counts every connection as a listener and
  will refuse or throttle a second from the same address, so whether the probe
  got through depended on the server's mood rather than anything here.

  So the stream is asked for with permission from the start. If the station
  grants it we have music and a spectrum from the one connection; if it does
  not, the request fails and we reconnect plainly - music, no spectrum. The
  fallback is on a timer as well as an error, because a refusal often just
  stalls rather than raising anything to catch.
*/
function radioRelease(el) {
  if (!el) return;
  try {
    while (el.firstChild) el.removeChild(el.firstChild);
    el.removeAttribute("src");
    if (el.load) el.load();
  } catch (e) {}
}

function radioPlay() {
  RADIO.wired = false;
  RADIO.reading = false;
  RADIO.bands.fill(0);
  RADIO.plainOnly = false;
  radioAttempt(true);
}

function radioAttempt(withCors) {
  // Reading needs the audio engine, whether or not the crown is making
  // sounds of its own - so this asks for it outright.
  if (withCors) wakeAudio(true);
  if (withCors && !AUDIO.ctx) withCors = false;

  RADIO.el = radioElement(withCors);
  RADIO.askedCors = withCors;
  RADIO.startedAt = performance.now();

  /* Why it failed matters, and the element knows. A network error means the
     address was not reached; "not supported" means something came back but it
     was not playable audio - a player page rather than the stream itself. */
  const failed = () => {
    const e = RADIO.el && RADIO.el.error;
    RADIO.why = e ? e.code : 0;
    if (RADIO.askedCors) { radioPlainRetry(); return; }
    radioNext();
  };

  if (RADIO.el.addEventListener) {
    RADIO.el.addEventListener("error", failed, { once: true });
  }

  RADIO.el.play().then(() => {
    RADIO.state = withCors ? "playing" : "plain";
    RADIO.playingSince = performance.now();
    if (withCors) radioWire();
  }).catch(failed);
}

// Tap the stream that is already playing. Same element, same connection.
function radioWire() {
  if (RADIO.wired || !AUDIO.ctx) return;
  try {
    if (AUDIO.ctx.state === "suspended" && AUDIO.ctx.resume) AUDIO.ctx.resume();
    const src = AUDIO.ctx.createMediaElementSource(RADIO.el);
    const an = AUDIO.ctx.createAnalyser();
    an.fftSize = 512;
    an.smoothingTimeConstant = 0.72;
    RADIO.bins = new Uint8Array(an.frequencyBinCount);
    src.connect(an);
    an.connect(AUDIO.ctx.destination);      // straight out, full range
    RADIO.analyser = an;
    RADIO.wired = true;
  } catch (e) {
    RADIO.wired = false;
  }
}

/*
  The station would not be read. Let the connection go and take the same
  address again without asking - music, and a still crown.
*/
function radioPlainRetry() {
  if (RADIO.plainOnly) { radioNext(); return; }
  RADIO.plainOnly = true;
  if (RADIO.el) { RADIO.el.pause(); radioRelease(RADIO.el); }
  RADIO.analyser = null;
  RADIO.wired = false;
  RADIO.reading = false;
  radioAttempt(false);
}

// This address gave nothing either way. Move along, or admit defeat.
function radioNext() {
  if (!RADIO.on) return;
  if (RADIO.queue.length) RADIO.tried.push(RADIO.queue.shift());
  if (RADIO.queue.length) {
    RADIO.url = RADIO.queue[0];
    radioPlay();
    return;
  }
  RADIO.state = "failed";
}

function radioStart() {
  wakeAudio(true);
  RADIO.state = "starting";
  RADIO.queue = radioCandidates();
  RADIO.tried = [];
  RADIO.url = RADIO.queue[0];
  radioPlay();
}

function radioStop() {
  if (RADIO.el) { RADIO.el.pause(); radioRelease(RADIO.el); }
  RADIO.el = null;
  RADIO.analyser = null;
  RADIO.wired = false;
  RADIO.reading = false;
  RADIO.plainOnly = false;
  RADIO.queue = [];
  RADIO.tried = [];
  RADIO.startedAt = 0;
  RADIO.bands.fill(0);
  RADIO.state = "off";
}

/*
  Read the spectrum into the bands the crown draws. Bins are gathered
  logarithmically, so the low end is not crushed into the first two bars the
  way a linear split leaves it.
*/
function radioRead(nowMs) {
  /* The trail.

     A meter is anchored: it grows from one end and shrinks back to it, and
     however it is dressed up that is all it can ever do. This is not anchored.
     The music drops a mark at the head of each curve - loud moment, bright
     mark - and from then on the mark travels along the curve on its own,
     fading as it goes. A beat becomes a shape moving through the form with a
     tail behind it, and a quiet passage leaves the curve to empty out.

     Everything on the ring is the past of this one number: the head is what
     the music is doing now, and everything behind it is what it did a moment
     ago, carried round and dimming. */
  if (RADIO.on && RADIO.reading) {
    const T = RADIO.trail;
    const n = T.length;

    /* One trail around the whole crown, not one per curve.

       Repeated per curve, the same little animation played in every arc and
       nothing ever went anywhere - there was no forward motion because there
       was nothing to follow. Wrapped once round the ring instead, a mark
       dropped by the music travels the entire crown, passing through one
       curve after another, and at any moment there are several of them
       strung out around it, each dimmer than the one behind. */
    RADIO.trailPos += RADIO.trailSpeed * n;
    while (RADIO.trailPos >= 1) {
      RADIO.trailPos -= 1;
      for (let i = n - 1; i > 0; i--) T[i] = T[i - 1];
      T[0] = RADIO.beat;                  // a bright mark on a hit, nothing between
    }

    /* Slow enough that a mark is still visible most of the way round, so the
       crown carries a string of them rather than one lonely spark. */
    for (let i = 0; i < n; i++) T[i] *= 0.9955;
  }

  /* The spectrum travels anticlockwise round the ring. Advanced here, before
     anything else, so it keeps moving whatever state the connection is in -
     put after the early returns it simply never ran. Fast enough that the
     movement round the crown is what you notice rather than the rise and
     fall, slow enough that a phrase stays legible as it goes. */
  /* The same way time goes. Positions on the crown are laid out in order of
     t, and t runs forward with the clock - so the belt has to advance with it,
     travelling anticlockwise round the form, left to right across the front.
     It was running backwards, against the direction the whole piece reads. */
  if (RADIO.on) RADIO.drift = (RADIO.drift + 0.0012) % 1;

  /* A request that is neither answered nor refused will sit there forever -
     which is what a sandboxed page does to an outbound connection. So a
     stream that has not actually started after a few seconds is treated as
     a refusal and the next address is tried. Without this it says it is
     tuning in indefinitely, which tells you nothing. */
  if (RADIO.on && RADIO.startedAt && nowMs - RADIO.startedAt > 9000) {
    const el = RADIO.el;
    const moving = el && (el.currentTime > 0 || (el.readyState || 0) >= 3);
    if (!moving) {
      RADIO.startedAt = 0;
      RADIO.why = RADIO.why || 2;
      /* A stream asked to be readable often just stalls when the station will
         not allow it, rather than raising an error - so silence for this long
         is taken as a refusal and the same address is tried again plainly. */
      if (RADIO.askedCors) radioPlainRetry();
      else radioNext();
      return;
    }
    RADIO.startedAt = 0;      // it is genuinely playing; stop watching
  }

  /* Tap the stream once it is running. */
  /* If the engine came up after the stream did, tap it now. */
  if (RADIO.on && RADIO.askedCors && !RADIO.wired &&
      RADIO.state === "playing" && AUDIO.ctx) {
    radioWire();
  }

  /* Say what happened, out loud. The strip only shows when something is
     under the cursor, and on a phone there is no cursor - so a station that
     will not play, or will not be read, would simply do nothing with no
     explanation. Announced once per change, not repeated. */
  if (RADIO.on && RADIO.state !== RADIO.told) {
    RADIO.told = RADIO.state;
    if (RADIO.state === "playing") {
      flashInfo("Playing · reading the music", 2200);
    } else if (RADIO.state === "plain") {
      flashInfo(RADIO.showBars
        ? "Playing · this browser or station will not allow reading"
        : "Playing", 2600);
    } else if (RADIO.state === "failed") {
      flashInfo("Station unreachable · press U to set the address", 3400);
    }
  }
  if (!RADIO.on) RADIO.told = "";

  if (!RADIO.on || !RADIO.analyser || !RADIO.bins) return;

  RADIO.analyser.getByteFrequencyData(RADIO.bins);

  const N = RADIO.bands.length;
  const top = RADIO.bins.length * 0.72;      // the useful part of the range
  let any = 0;

  for (let i = 0; i < N; i++) {
    const a = Math.pow(i / N, 1.7) * top;
    const b = Math.pow((i + 1) / N, 1.7) * top;
    let sum = 0, n = 0;
    for (let k = Math.floor(a); k <= Math.min(top, Math.max(Math.floor(a), Math.floor(b))); k++) {
      sum += RADIO.bins[k]; n++;
    }
    let v = n ? (sum / n) / 255 : 0;
    any += v;

    /* Music does not fill the meter. Frequency data sits well below the top
       of its range even when loud, and the high end is quieter again, so a
       panel drawn at the raw value never reaches the curve and leaves the
       daylight showing under every crest. Lifted with a curve rather than a
       multiplier, so the quiet parts still read as quiet, and tilted a
       little toward the top end which is naturally softer. */
    /* A gentle lift and a slight tilt toward the top end, which is naturally
       quieter. Kept light: the normalising below is what sets the height, and
       shaping hard here as well simply pins every band to the top and the row
       stops moving. */
    v = Math.pow(clamp(0, 1, v), 0.88);
    v = clamp(0, 1, v * (1 + 0.22 * (i / N)));

    // rises quickly, falls back slowly, the way a meter should
    const prev = RADIO.bands[i];
    RADIO.bands[i] = v > prev ? v : prev + (v - prev) * 0.14;
  }

  /* The beat, taken from the raw reading before anything is normalised.

     This is what the trail was missing. The bands below are divided by the
     loudest of them, which is right for drawing a spectrum - it keeps the
     shape visible however quiet the music - but it throws away exactly what a
     beat is: the whole spectrum getting louder at once. Read after that, the
     trail was fed a number that barely moved, and a trail of a number that
     does not move is a line that does not move.

     So the low end is measured from the raw bins, and what is dropped into
     the trail is how far it stands above its own recent average. A kick
     drops a bright mark; the space between kicks drops nothing. */
  {
    let lowSum = 0, lowN = 0;
    const lowTop = Math.floor(RADIO.bins.length * 0.10);
    for (let k = 1; k < lowTop; k++) { lowSum += RADIO.bins[k]; lowN++; }
    const low = lowN ? (lowSum / lowN) / 255 : 0;

    // a slow average to measure against, and a fast one to catch the hit
    RADIO.lowAvg += (low - RADIO.lowAvg) * 0.02;
    RADIO.lowNow += (low - RADIO.lowNow) * 0.45;

    const over = RADIO.lowAvg > 0.01
      ? (RADIO.lowNow - RADIO.lowAvg) / RADIO.lowAvg
      : 0;

    /* Measured against its own recent best, not against a fixed figure.

       A beat is how far the low end stands above its average - but on steady
       music the average climbs to meet it, so a track with a constant pulse
       slowly stops registering as having one. Measured over ten seconds the
       reading fell by half and the crown emptied with it. Scaling against the
       biggest hit lately keeps a steady beat reading as a beat, and a track
       that genuinely gets quieter still reads quieter, because the reference
       falls away too. */
    // Clamped, because the very first frames - before the average has any
    // history - throw a huge figure that would otherwise become the standard
    // everything after is judged against.
    const raw = clamp(0, 1.2, over);
    RADIO.beatPeak = raw > RADIO.beatPeak
      ? RADIO.beatPeak + (raw - RADIO.beatPeak) * 0.5
      : RADIO.beatPeak * 0.997;
    RADIO.beat = clamp(0, 1, raw / Math.max(0.10, RADIO.beatPeak * 0.80));
  }

  /* Normalised against the loudest band, so whatever is currently the peak
     of the spectrum fills its curve completely. Frequency data never comes
     near the top of its own range, so left raw the panels always stopped
     short of the line no matter how loud the music - and quiet passages
     would have flattened out altogether. The reference falls back slowly, so
     a sudden peak lifts everything at once rather than making the whole ring
     shrink around it. */
  let loudest = 0;
  for (let i = 0; i < N; i++) if (RADIO.bands[i] > loudest) loudest = RADIO.bands[i];
  RADIO.peak = loudest > RADIO.peak
    ? loudest
    : RADIO.peak + (loudest - RADIO.peak) * 0.02;

  /* Scaled so the loudest band of the moment fills its curve outright, with
     a little headroom past it - the quieter bands then sit proportionally
     high rather than hugging the base, which is what makes the row read as
     an equaliser rather than a ripple. */
  /* A little past the loudest band, so the peak of the spectrum presses right
     against its curve rather than stopping just short, and the whole ring
     stands taller with it. Pushed much further everything pins solid and the
     movement is lost. */
  const ref = Math.max(0.25, RADIO.peak) * 0.96;
  for (let i = 0; i < N; i++) {
    RADIO.bands[i] = clamp(0, 1, RADIO.bands[i] / ref);
  }

  /* What each band is doing against its own habit.

     The spectrum's shape barely changes: bass loud, treble quiet, all the way
     through a track. Drawn from that shape alone the crown shows the same
     fixed ramp however many times it is repeated round the ring - a pattern
     that drifts but never switches. Every band is therefore also measured
     against its own slow average, so a band that is hitting lights and one
     that is merely present does not. That is what makes panels come and go
     rather than dim a little. */
  for (let i = 0; i < N; i++) {
    const v = RADIO.bands[i];
    RADIO.bandAvg[i] += (v - RADIO.bandAvg[i]) * 0.035;
    const lift = Math.max(0, v - RADIO.bandAvg[i]);
    /* Most of the reading is still the band's own strength, so the crown
       keeps a shape and never blacks out between hits; the rest is how far
       above its habit it is standing, which is what tips cells over and back
       under the threshold. Weighted the other way it emptied the whole ring
       in the gaps between beats. */
    RADIO.dyn[i] = clamp(0, 1, v * 0.50 + lift * 3.6);
  }

  if (RADIO.wired && any > 0.02) RADIO.reading = true;
}

/*
  The crown as a graphic equaliser. The music is read into the form itself
  rather than drawn over it: a panel in each hour cell, standing between the
  same two stems that divide the crown, and never taller than the wave above
  it. At full level a panel reaches the curve exactly; it can never break the
  line, because its height is a fraction of the height the line already has.
  In a trough it is a sliver, at a crest it is full - so the music arrives
  shaped by the day it is playing in.

  As the crown settles and strips back to the bare line, the panels give up
  their edges and become a mist: the same colours, the same levels, blurred
  into one another and drifting. Northern lights rather than a meter.
*/
function drawEqualiser(WH, R, A, rot, tilt, cx, cy, alpha, crests, restA) {
  if (!RADIO.on || !RADIO.showBars || !RADIO.reading || alpha <= 0.01) return;

  const N = RADIO.bands.length;
  const sharp = 1 - restA;
  const mist = restA;

  /* Each curve of the crown is a meter.

     A curve is divided into the cells the stems already give it, and the
     level decides how many of them are lit - filling from the left, so the
     ones at the right hand end switch on and off as the music moves. That is
     the movement: panels appearing and disappearing along each arc, rather
     than a solid block changing colour.

     The curves are what the crown is already made of, so the gaps between
     them come free: two neighbours meet where the wave touches its own base
     and there is nothing there to fill. */
  const sections = crests >= 4 ? crests : 12;
  const perCurve = Math.max(4, Math.min(24, Math.round(168 / sections)));

  /* What the spectrum is doing at a point, given as a position along one
     curve rather than round the whole ring.

     Laid across the ring once, the spectrum's quiet stretches showed as a
     single gap travelling round the crown - one curve dark while the rest
     were lit. Every curve now carries the whole spectrum, so the same runs
     and the same gaps appear in all of them at once and move through each in
     step. What travels is a pattern repeated seven times, not one gap making
     a lap. */
  /* What the trail holds at a place on the ring.

     The trail is the music's own history laid once round the crown: the head
     is what it is doing now and everything behind it is what it did a moment
     ago, dimming as it goes. Reading a spectrum repeated in every curve gave
     the same small animation seven times over and nothing ever travelled -
     there was no forward motion because there was nothing to follow. */
  const TR = RADIO.trail, TN = TR.length;
  const levelRing = (a0, a1) => {
    const i0 = Math.floor((((a0 % 1) + 1) % 1) * TN);
    const i1 = Math.floor((((a1 % 1) + 1) % 1) * TN);
    if (i0 === i1) return TR[i0 % TN];
    let sum = 0, m = 0;
    for (let k = i0; m < TN; k = (k + 1) % TN) {
      sum += TR[k]; m++;
      if (k === i1) break;
    }
    return m ? sum / m : 0;
  };


  ctx.save();

  /* A section of light travelling through each curve.

     Every cell reads the part of the spectrum passing over it at that
     instant, and lights only if it is loud enough. Because the spectrum has
     shape - peaks and quiet stretches - what appears is runs of lit cells
     with gaps in front and behind, and as the reading drifts round the crown
     those runs travel through one curve and into the next. A cell switches
     off behind the run as the next switches on ahead of it, the way a letter
     moves across a matrix of lamps.

     The alternative, filling each curve from one end, only ever grew and
     shrank in place. This actually moves. */
  /* How much has to be there before a bar lights, eased by how hard the
     music is hitting. On a beat the ring lights further and the gaps pull
     in; between beats they open out again. The gaps travel; the volume
     decides how wide they are.

     Set low, so what is lit is long blocks with gaps between them rather
     than the other way round - the blocks are the subject and the gaps are
     what let you see them move. */
  const THRESH = 0.15;

  /* The mist reads lower still, and never quite runs out. Left on the same
     threshold as the bars it emptied the whole ring on a quiet passage,
     which is not a settled instrument going quiet - it is one that has
     stopped. */
  const MIST_THRESH = 0.085;

  if (sharp > 0.02) {
    for (let i = 0; i < sections; i++) {
      const s0 = i / sections, s1 = (i + 1) / sections;

      for (let c = 0; c < perCurve; c++) {
        const t0 = s0 + (s1 - s0) * (c / perCurve);
        const t1 = s0 + (s1 - s0) * ((c + 1) / perCurve)
                 + 0.3 / (sections * perCurve);
        const tc = (t0 + t1) / 2;

        // read at this cell's place on the ring, not within its curve
        const lv = levelRing(t0, t1);
        if (lv <= THRESH) continue;

        // how far past the threshold it is, so a run has a soft leading edge
        const over = clamp(0, 1, (lv - THRESH) / (1 - THRESH));
        const near = (Math.sin(-tc * TAU + rot) + 1) / 2;

        fillBand(
          WH, R, A, rot, tilt, cx, cy, t0, t1, daylightColor(tc * 24),
          alpha * sharp * (0.30 + 0.55 * over) * (0.45 + 0.55 * near),
          1
        );
      }
    }
  }

  /* At rest it becomes mist - the same travelling runs, softened.

     It reads exactly what the lit cells read, from the same threshold, so the
     colour appears and clears in the same places and moves the same way. The
     crown settling blurs the reading rather than replacing it with a
     different one, which is what had been happening: sideways motion before
     it settled and a rise and fall after. */
  if (mist > 0.02) {
    /* Coarser than the lit cells. Each disc is five times its own spacing
       across, so they merge regardless - matching the cell count one for one
       only paid for overdraw nobody could see. */
    const step = 1 / Math.max(40, Math.min(84, Math.round(crests * 12)));
    const spacing = (TAU * R) * step;

    for (let t = step * 0.5; t < 1; t += step) {
      const lv = levelRing(t, t + step);
      if (lv <= MIST_THRESH) continue;

      const p = pointAtT(t, WH, R, A, rot, tilt, cx, cy);
      const waveH = Math.max(0, p.yBase - p.y);
      if (waveH < 1.5) continue;

      const over = clamp(0, 1, (lv - MIST_THRESH) / (1 - MIST_THRESH));
      const near = (Math.sin(-t * TAU + rot) + 1) / 2;
      const rgb = daylightColor(t * 24).slice(4, -1);

      /* One size, one depth. Anything here that followed the level would be
         a rise and fall, and the rise and fall is not what this is reading. */
      const rx = Math.min(spacing * 5.0, R * 0.20);
      const ry = Math.max(3, Math.min(waveH * 0.46, rx));
      const my = p.yBase - Math.min(waveH * 0.55, waveH - ry * 1.1);

      const a = alpha * mist * (0.26 + 0.46 * over) * (0.7 + 0.3 * near);
      if (a <= 0.004) continue;

      ctx.save();
      ctx.translate(p.x, my);
      ctx.scale(1, ry / rx);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
      g.addColorStop(0, `rgba(${rgb},${a.toFixed(4)})`);
      g.addColorStop(0.5, `rgba(${rgb},${(a * 0.42).toFixed(4)})`);
      g.addColorStop(1, `rgba(${rgb},0)`);
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, rx, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  ctx.restore();
}

/* =========================
   SKY
   Where the crown is, and what is overhead. Two sources: the sun, moon and
   stars, which are pure arithmetic and need no network at all; and the
   which is all arithmetic and needs no network at all.

   Everything here answers the same question - what was it like at this
   moment - so it works for any point the crown is showing, behind or ahead
   of now, which is what makes it a document rather than a dashboard.
========================= */

const SKY = {
  starsOn: true,                // the sky overhead
  lightOn: true,                // the daylight, the shadow and the colour
  lat: 52.37, lon: 4.90,        // Amsterdam until the browser says otherwise
  located: false,
  starAmt: 0,                   // how much of the sky is showing
};

const RAD = Math.PI / 180;


// Days since J2000.0, the epoch everything below is measured from.
function daysSinceJ2000(ms) {
  return ms / 86400000 - 10957.5;
}

// Greenwich mean sidereal time, in degrees.
function gmst(ms) {
  const d = daysSinceJ2000(ms);
