<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Week-Wave Clock</title>

<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Helvetica, Arial, sans-serif;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
    touch-action: none;
  }

  video {
    position: fixed;
    right: 12px;
    bottom: 12px;
    width: 160px;
    opacity: 0.12;
    display: none;
    transform: scaleX(-1);
    border: 1px solid #222;
    border-radius: 6px;
  }

  body.debug video { display: block; }

  #hud {
    position: fixed;
    left: 12px;
    top: 12px;
    font: 12px Helvetica, Arial, sans-serif;
    color: #b9b9b9;
    display: none;
    z-index: 10;
    white-space: pre;
  }

  body.debug #hud { display: block; }

  /* Step arrows live in the corners of the zones that summon
     them: hover above the crown for next, below for previous.
     They step whatever the current layer is - weeks, months,
     years. Hidden until summoned. */

  #nav button {
    position: fixed;
    right: 22px;
    width: 34px;
    height: 34px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }

  body.stack #nav button {
    opacity: 0.45;
    pointer-events: auto;
  }

  body.stack #nav button:hover { opacity: 1; }

  #nUp { top: 26px; }
  #nDown { bottom: 26px; }

  /* Info strip: contextual readout below the form. Fed by
     rollovers; later, by calendar events. */

  #info {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    font: 13px Helvetica, Arial, sans-serif;
    letter-spacing: 0.05em;
    color: #b9b9b9;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 9;
  }

  body.info #info { opacity: 1; }

  /* Composer: a single quiet line for naming a moment. Opens
     on a half-hour chunk; Enter keeps it, Escape lets it go,
     emptying an existing title removes the event. */

  #composer {
    position: fixed;
    left: 50%;
    bottom: 52px;
    transform: translateX(-50%);
    width: 280px;
    background: transparent;
    border: none;
    border-bottom: 1px solid #3a3f45;
    outline: none;
    color: #fff;
    font: 14px Helvetica, Arial, sans-serif;
    letter-spacing: 0.04em;
    text-align: center;
    padding: 4px 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 11;
  }

  body.compose #composer {
    opacity: 1;
    pointer-events: auto;
  }

  /* Touch and small screens: bigger tap targets, thumb-safe
     placement, no accidental text selection or callouts. */

  @media (pointer: coarse), (max-width: 640px) {
    #nav button { width: 46px; height: 46px; }
    #nUp { top: max(16px, env(safe-area-inset-top)); }
    #nDown { bottom: max(16px, env(safe-area-inset-bottom)); }
    #nLeft, #nRight { margin-top: -23px; }

    #layers { top: max(18px, env(safe-area-inset-top)); }
    #layers button { font-size: 13px; padding: 4px 2px; }

    #nowclock {
      font-size: 19px;
      left: 18px;
      bottom: max(18px, env(safe-area-inset-bottom));
    }

    #info { bottom: max(20px, env(safe-area-inset-bottom)); font-size: 14px; }
    #composer { bottom: 96px; width: min(300px, 82vw); font-size: 16px; }
  }

  * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #composer { -webkit-user-select: text; user-select: text; }

  /* Layer ladder: the four magnifications, whisper-quiet in
     the corner. The one you're on is lit; click any to go. */

  #layers {
    position: fixed;
    left: 22px;
    top: 26px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 10;
  }

  #layers button {
    background: none;
    border: none;
    padding: 0;
    text-align: left;
    cursor: pointer;
    font: 10px Helvetica, Arial, sans-serif;
    letter-spacing: 0.22em;
    color: #fff;
    opacity: 0.22;
    transition: opacity 0.2s;
  }

  #layers button:hover { opacity: 0.7; }
  #layers button.on { opacity: 0.95; }



  #sound {
    position: fixed;
    left: 22px;
    top: 176px;
    background: none;
    border: none;
    padding: 0;
    text-align: left;
    cursor: pointer;
    font: 10px Helvetica, Arial, sans-serif;
    letter-spacing: 0.22em;
    color: #fff;
    opacity: 0.22;
    transition: opacity 0.2s;
    z-index: 10;
  }

  #sound:hover { opacity: 0.7; }
  #sound.on { opacity: 0.95; }

  #light {
    position: fixed;
    left: 22px;
    top: 202px;
    background: none;
    border: none;
    padding: 0;
    text-align: left;
    cursor: pointer;
    font: 10px Helvetica, Arial, sans-serif;
    letter-spacing: 0.22em;
    color: #fff;
    opacity: 0.22;
    transition: opacity 0.2s;
    z-index: 10;
  }

  #light:hover { opacity: 0.7; }
  #light.on { opacity: 0.95; }

  #stars {
    position: fixed;
    left: 22px;
    top: 228px;
    background: none;
    border: none;
    padding: 0;
    text-align: left;
    cursor: pointer;
    font: 10px Helvetica, Arial, sans-serif;
    letter-spacing: 0.22em;
    color: #fff;
    opacity: 0.22;
    transition: opacity 0.2s;
    z-index: 10;
  }

  #stars:hover { opacity: 0.7; }
  #stars.on { opacity: 0.95; }

  #radio {
    position: fixed;
    left: 22px;
    top: 254px;
    background: none;
    border: none;
    padding: 0;
    text-align: left;
    cursor: pointer;
    font: 10px Helvetica, Arial, sans-serif;
    letter-spacing: 0.22em;
    color: #fff;
    opacity: 0.22;
    transition: opacity 0.2s;
    z-index: 10;
  }

  #radio:hover { opacity: 0.7; }
  #radio.on { opacity: 0.95; }

  @media (pointer: coarse), (max-width: 640px) {
    #sound { top: 150px; }
    #light { top: 176px; }
    #stars { top: 202px; }
    #radio { top: 228px; }
  }

  @media (pointer: coarse), (max-width: 640px) {
    /*
       hidden where it does not belong. */
  }

  /* The now beacon: the current time, always present, bottom
     left, in the colour of the light. Click it anywhere,
     anytime, and you come home to now. It rests when you're
     with it and burns brighter the moment you wander. */

  #nowclock {
    position: fixed;
    left: 22px;
    bottom: 24px;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font: 16px Helvetica, Arial, sans-serif;
    letter-spacing: 0.1em;
    opacity: 0.5;
    transition: opacity 0.3s;
    z-index: 10;
  }

  #nowclock:hover { opacity: 1 !important; }

  #nav button::before {
    content: "";
    position: absolute;
    left: 10px;
    width: 13px;
    height: 13px;
    border-left: 1.5px solid #fff;
    border-top: 1.5px solid #fff;
  }

  #nUp::before { top: 13px; transform: rotate(45deg); }
  #nDown::before { top: 7px; transform: rotate(225deg); }

  /* Spin arrows: one full revolution to the previous / next
     week, month or year, depending on the layer. */

  #nLeft { left: 22px; top: 50%; margin-top: -17px; right: auto; }
  #nRight { right: 22px; top: 50%; margin-top: -17px; }

  #nLeft::before { top: 10px; left: 13px; transform: rotate(-45deg); }
  #nRight::before { top: 10px; left: 7px; transform: rotate(135deg); }
</style>

<body>
<canvas id="cv"></canvas>
<video id="video" autoplay playsinline muted></video>
<div id="hud"></div>
<div id="info"></div>
<input id="composer" type="text" spellcheck="false"
       placeholder="name this moment" aria-label="Event title" />
<button id="nowclock" title="Return to now"></button>
<div id="layers">
  <button id="lYear">YEAR</button>
  <button id="lMonth">MONTH</button>
  <button id="lWeek">WEEK</button>
  <button id="lDay">DAY</button>
</div>
<button id="sound" title="Sound">SOUND</button>
<button id="light" title="Daylight, shadow and colour">LIGHT</button>
<button id="stars" title="The sky overhead">STARS</button>
<button id="radio" title="Play the station">RADIO</button>
<div id="nav">
  <button id="nUp" aria-label="Next"></button>
  <button id="nDown" aria-label="Previous"></button>
  <button id="nLeft" aria-label="Spin to previous"></button>
  <button id="nRight" aria-label="Spin to next"></button>
</div>

<script>
"use strict";

/* ============================================================
   WEEK-WAVE CLOCK - the crown microscope
   ------------------------------------------------------------
   One design language, three magnifications:

     WEEK crown   - 7 crests, one per day. Hours engraved along
                    the form. The wave's rise and fall is day
                    and night. The red HH:MM is now.
     MONTH crown  - one crest per week of the month (4 or 5).
                    Day-of-month numbers engraved along it.
                    Today reads red.
     YEAR crown   - 12 crests, one per month. The current month
                    reads red.

   Zoom is the microscope. Stretch out past a layer's framed
   view and you pass through to the next magnification; push in
   on a month or year crown and you dive into the unit at hand.
   Click any day on the month crown to drop into its week;
   click any month on the year crown to drop into that month.

   Time is never controlled by the viewer. The current week
   always rests with now front and centre, the wave travelling
   beneath the red marker one second at a time.

   State blocks:
     TIME        - real Amsterdam clock, discrete one-second ticks
     GEOMETRY    - the crown form, parameterised by crest count
     CAMERA      - yaw / tilt / zoom with cinematic damping
     LAYERS      - week / month / year, selections, transitions
     INTERACTION - mouse, wheel, keys, clicks, touch
   ============================================================ */

/* =========================
   CONFIG
========================= */

const CONFIG = {

  zoomMax: 24,            // close inspection within a layer

  idleDelayMs: 8000,      // no interaction before drifting home
  idleRate: 0.5,          // gentleness of the drift home

  baseRadius: 260,
  baseAmplitude: 92,
  wavePoints: 1400,

  tiltMin: 0.22,
  tiltMax: 0.9,
  tiltDefault: 0.24,      // just above the shape, near flat
  tiltDefaultDay: 0.42,   // day crown rests tilted, so the back shows

  damping: { yaw: 8, tilt: 8, zoom: 1.7, yawSettle: 1.7 },

  // Elastic band. Spin away and tension builds with distance. Let go and the
  // crown waits out the dwell, giving you a chance to work where you landed,
  // then recoils to now - faster and tighter the further you had stretched.
  yearMorphMs: 1150,           // stretch between the year systems
  yearMorphStretch: 0.32,      // how far the bases pull wide on the way
                               // through. Past about 0.35 the peaks start
                               // overlapping and the troughs lift.

  // How long the crown waits before it starts taking things away. All three
  // are generous on purpose: parking the cursor to read a projected moment
  // should not start a countdown.
  elasticDwellMs: 6000,        // pause after release before the band recoils
  restDelayMs: 9000,           // stillness before the engraving strips back
  projQuietMs: 6000,           // stillness before the projection starts to go
  elasticMinStretch: 0.2,      // ignore a nudge; only real travel recoils
  recoilBaseTurnsPerSec: 1.8,  // speed of the snap back with no stretch
  recoilTensionGain: 0.85,     // extra speed per unit of stretch

  // Layer transition: duration and how far the optics travel
  layerAnimMs: 700,
  layerScaleOut: 0.3,     // outgoing crown shrinks to this
  layerScaleIn: 3.4,      // incoming crown arrives from this

  // Zoom-in level (relative to fit) that triggers a dive on
  // month / year layers
  // Zoom is pure play within a layer: from about a third of
  // the framed view up to full close inspection. Layers change
  // only by click.


  dprCap: 2
};

const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

/* =========================
   GEOMETRY
   The crown form, parameterised by crest count. The week's
   accepted hour mapping is preserved exactly.
========================= */

// Week hour mapping: 00 at each crest, 01-08 down the wave,
// 09-23 back up toward the next crest.
const hourOffsets = [];
hourOffsets.push(0.5);
for (let h = 1; h <= 8; h++)  hourOffsets.push(0.5 + h * (0.5 / 8));
for (let h = 9; h < 24; h++)  hourOffsets.push(1 + (h - 8) * (0.5 / 16));

function hourT(day, hour) {
  return (day + hourOffsets[hour]) / 7;
}

/*
  Month-crown day placement: perfectly even spacing - every day
  exactly one seventh apart, no gaps - phased so the crest
  falls between Saturday and Sunday. The week reads as terrain:
  weekend on the summit, Monday and Tuesday coming down off the
  previous peak, Wednesday in the valley, Thursday and Friday
  climbing to the next weekend.
*/
const MONTH_DAY_OFFSETS = [0, 1, 2, 3, 4, 5, 6].map(d => (d - 2) / 7);

// Precomputed unit-wave heights, cached per crest count.
// N crests <=> sin(N/2 * angle), |.|^1.5 for the crown profile.
const waveCache = new Map();

function waveHeights(crests, power = 1.5) {
  const key = `${crests}|${power}`;
  let WH = waveCache.get(key);
  if (WH) return WH;

  WH = new Array(CONFIG.wavePoints + 1);
  for (let i = 0; i <= CONFIG.wavePoints; i++) {
    const angle = -(i / CONFIG.wavePoints) * 2 * Math.PI;
    const r = Math.sin((crests / 2) * angle);
    WH[i] = Math.pow(Math.abs(r), power);
  }
  waveCache.set(key, WH);
  return WH;
}

/*
  A crown profile taken apart into its peaks. |sin(N/2 . angle)|^1.5 is
  exactly a row of evenly spaced bumps, each cos((pi/2)(d/w))^1.5 out to a
  half width of 1/(2N) - so the wave can be rebuilt peak by peak, and each
  peak given its own centre, width and height.

  That is what lets one form become another sideways. The peaks the two forms
  share slide and stretch between their two widths at full height; the peaks
  only one form has fade on the spot. Nothing rises or falls as a whole.
*/
/*
  Two closed forms, crossfaded by opacity, each stretching horizontally.

  Changing the number of crests in the geometry can never be purely lateral:
  going from twelve crests to fifty three has to carve new troughs, and a
  trough appearing is the curve travelling downward. So the count is not
  animated at all. Instead both forms are drawn whole, one fading out as the
  other fades in, and the only thing that moves in either is the width of the
  bases: the outgoing form stretches wider as it goes, the incoming one
  arrives stretched and settles to its own width. Peaks hold full height in
  both. Nothing rises or falls - it reads as the curves pulling wide and
  releasing, with the swap carried on the fade.
*/
const peakBufs = [null, null];

function peaksAt(N, widthMul, slot) {
  const n = CONFIG.wavePoints + 1;
  if (!peakBufs[slot] || peakBufs[slot].length !== n) peakBufs[slot] = new Array(n);
  const out = peakBufs[slot];
  for (let i = 0; i < n; i++) out[i] = 0;

  const w = (1 / (2 * N)) * widthMul;
  for (let j = 0; j < N; j++) addPeak(out, (j + 0.5) / N, w, 1);

  out[n - 1] = out[0];
  return out;
}

function addPeak(out, c, w, h) {
  if (h <= 0 || w <= 0) return;
  const n = CONFIG.wavePoints;
  const span = Math.ceil(w * n) + 1;
  const mid = Math.round(c * n);

  for (let o = -span; o <= span; o++) {
    let i = mid + o;
    while (i < 0) i += n;
    while (i >= n) i -= n;

    // True distance from the peak's real centre, not the rounded index, so a
    // crest count that doesn't divide the sample grid still lands cleanly.
    let d = Math.abs(i / n - c);
    if (d > 0.5) d = 1 - d;
    if (d >= w) continue;

    const v = h * Math.pow(Math.cos((d / w) * (Math.PI / 2)), 1.5);
    if (v > out[i]) out[i] = v;
  }
}

// Sample a heights array at any t, for callers drawing at their own step.
function sampleHeights(WH, t) {
  const n = CONFIG.wavePoints;
  let f = (t - Math.floor(t)) * n;
  const i = Math.floor(f);
  return WH[i] + (WH[i + 1] - WH[i]) * (f - i);
}

function pointAtT(t, WH, R, A, rot, tiltK, cx, cy) {
  const angle = -t * 2 * Math.PI + rot;

  const x = cx + R * Math.cos(angle);
  const yBase = cy + R * Math.sin(angle) * tiltK;

  const idx = Math.floor((t - Math.floor(t)) * CONFIG.wavePoints) % CONFIG.wavePoints;
  const y = yBase - A * WH[idx];

  return { x, y, yBase };
}

// The screen y for a marker floating over the wave at t, keeping a constant
// buffer of clear space between the marker and the highest part of the wave
// beneath the marker's whole width - not just its centre. halfW is the
// marker's half-width in px; we convert it to a span of t (the ring maps t
// 0..1 around a circumference of ~2*PI*R) and sample across it, so the left
// and right edges of the text clear the line as well as the middle. gap is in
// px. The marker holds the same clearance at a peak as at a trough; it never
// touches the line, it orbits it.
function markerY(t, WH, R, A, rot, tiltK, cx, cy, gap, halfW = 0) {
  const dt = halfW / (2 * Math.PI * Math.max(1, R));   // px half-width -> t span
  const span = Math.max(0.5 / CONFIG.wavePoints * 6, dt);
  let top = pointAtT(t, WH, R, A, rot, tiltK, cx, cy).y;
  const steps = 12;
  for (let i = -steps; i <= steps; i++) {
    const yy = pointAtT(t + span * (i / steps), WH, R, A, rot, tiltK, cx, cy).y;
    if (yy < top) top = yy;                    // smallest y = highest on screen
  }
  return top - gap;
}

// Resting orientation: first crest one step in from the left
// edge, seen face-on rather than in profile.
function homeRot(crests) {
  return Math.PI - Math.PI / crests;
}

/* =========================
   TIME STATE
   Discrete one-second ticks. No smooth interpolation of time.
========================= */

const amsFormatter = new Intl.DateTimeFormat("en-GB", {
  timeZone: "Europe/Amsterdam",
  hour12: false,
  weekday: "short",
  day: "2-digit",
  month: "2-digit",
  year: "numeric",
  hour: "2-digit",
  minute: "2-digit",
  second: "2-digit"
});

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun",
                "Jul","Aug","Sep","Oct","Nov","Dec"];
// Full month names retired: everything uses the 3-char title-case
// form (Jan, Feb ... Dec). MONTHS_FULL aliases MONTHS so old call
// sites keep working without ever showing a full month name.
const MONTHS_FULL = MONTHS;
const DAY_MS = 86400e3;
const TAU = 2 * Math.PI;
const tY = t => t;   // year reads forward like week/month

const timeState = {
  dayIdx: 0, h: 0, m: 0, s: 0,
  t: 0,                 // 0..1 position along the current week
  mondayMs: 0,          // UTC ms of this week's Monday (date only)
  monthAbs: 0,          // current absolute month (year*12 + month)
  dateMs: 0,            // UTC ms of today (date only)
  lastSecondKey: -1
};

function readAMS() {
  const map = Object.fromEntries(
    amsFormatter.formatToParts(new Date()).map(p => [p.type, p.value])
  );

  const day = Number(map.day);
  const month = Number(map.month);
  const year = Number(map.year);

  /*
    The weekday derives from the date itself, never from the
    formatter's weekday string - locale string matching is a
    silent off-by-one-day waiting to happen. The hour is
    wrapped mod 24 to absorb the engines that report midnight
    as "24".
  */
  const dayIdx =
    (new Date(Date.UTC(year, month - 1, day)).getUTCDay() + 6) % 7;

  return {
    dayIdx,
    day,
    month,
    year,
    h: Number(map.hour) % 24,
    m: Number(map.minute),
    s: Number(map.second)
  };
}

function tFromHMS(dayIdx, h, m, s) {
  const hourFloat = h + m / 60 + s / 3600;
  const hour = Math.floor(hourFloat);
  const frac = hourFloat - hour;

  const off = hourOffsets[hour];
  const next = hourOffsets[(hour + 1) % 24] + (hour === 23 ? 1 : 0);

  // Floor to whole seconds. The tick stays discrete.
  const fracSec = Math.floor(frac * 3600) / 3600;
  const offPerHour = off + (next - off) * fracSec;

  return (dayIdx + offPerHour) / 7;
}

function updateTime() {
  const now = readAMS();
  const key = ((now.dayIdx * 24 + now.h) * 60 + now.m) * 60 + now.s;

  if (key !== timeState.lastSecondKey) {
    timeState.lastSecondKey = key;
    timeState.dayIdx = now.dayIdx;
    timeState.h = now.h;
    timeState.m = now.m;
    timeState.s = now.s;
    timeState.t = tFromHMS(now.dayIdx, now.h, now.m, now.s);
    timeState.dateMs = Date.UTC(now.year, now.month - 1, now.day);
    timeState.mondayMs = timeState.dateMs - now.dayIdx * DAY_MS;
    timeState.monthAbs = now.year * 12 + (now.month - 1);
  }
}

/* --- Calendar helpers --- */

const weekInfoCache = new Map();
let weekInfoCacheMonday = 0;

// A week belongs to the month its Monday falls in.
function weekInfo(k) {
  if (weekInfoCacheMonday !== timeState.mondayMs) {
    weekInfoCache.clear();
    weekInfoCacheMonday = timeState.mondayMs;
  }
  let info = weekInfoCache.get(k);
  if (!info) {
    const d = new Date(timeState.mondayMs + k * 7 * DAY_MS);
    info = {
      monthAbs: d.getUTCFullYear() * 12 + d.getUTCMonth(),
      monthDay: d.getUTCDate()
    };
    weekInfoCache.set(k, info);
  }
  return info;
}

function firstWeekOfMonth(mAbs) {
  let k = Math.round((mAbs - weekInfo(0).monthAbs) * 4.348);
  while (weekInfo(k).monthAbs > mAbs) k--;
  while (weekInfo(k).monthAbs < mAbs) k++;
  while (weekInfo(k - 1).monthAbs === mAbs) k--;
  return k;
}

// Week offsets (from the current week) of every week in a month
function weeksOfMonth(mAbs) {
  const out = [];
  let k = firstWeekOfMonth(mAbs);
  while (weekInfo(k).monthAbs === mAbs) {
    out.push(k);
    k++;
  }
  return out;
}

/*
  Weeks shown on a month's crown: every week that touches the
  month, so all of its days are present. A straddling week
  appears on both neighbouring crowns, its out-of-month days
  dimmed - the paper calendar rule.
*/
function monthCrownWeeks(mAbs) {
  const year = Math.floor(mAbs / 12);
  const mo = ((mAbs % 12) + 12) % 12;

  const firstMs = Date.UTC(year, mo, 1);
  const lastMs = Date.UTC(year, mo + 1, 0);

  const firstDow = (new Date(firstMs).getUTCDay() + 6) % 7; // Mon = 0
  let ms = firstMs - firstDow * DAY_MS;

  const out = [];
  while (ms <= lastMs) {
    out.push(Math.round((ms - timeState.mondayMs) / (7 * DAY_MS)));
    ms += 7 * DAY_MS;
  }
  return out;
}

// The week offset (from this week) that holds a given date.
function weekOffsetOfDate(dateMs) {
  const dow = (new Date(dateMs).getUTCDay() + 6) % 7;
  return Math.round(
    (dateMs - dow * DAY_MS - timeState.mondayMs) / (7 * DAY_MS)
  );
}

function mondayMsOf(k) {
  return timeState.mondayMs + k * 7 * DAY_MS;
}

/*
  The year reads two ways. In months it is twelve crests, one per month, with
  the days as grain. In weeks it is the month crown stretched all the way
  round: a crest for every week of the year, days as the stems. Same layer,
  same navigation - just a different unit doing the counting.
*/
let yearMode = "months";        // "months" | "weeks"

// Week offsets (k) whose Monday falls inside the calendar year: 52 or 53 of
// them. Cached because the crown asks for this once per slot per frame.
const yearWeekCache = new Map();

function yearCrownWeeks(year) {
  // Keyed on the current Monday too, so the offsets can't go stale if the
  // page is left open across a week boundary.
  const key = `${year}|${timeState.mondayMs}`;
  let out = yearWeekCache.get(key);
  if (out) return out;

  // Start on the Monday holding 1 January, even when that Monday sits in the
  // previous year - the same partial week the month crown carries at its
  // edges, so no day of the year is left without a stem.
  const first = Date.UTC(year, 0, 1);
  const last = Date.UTC(year, 11, 31);
  let k = Math.floor((first - timeState.mondayMs) / (7 * DAY_MS));
  out = [];
  while (mondayMsOf(k) <= last) { out.push(k); k++; }

  yearWeekCache.set(key, out);
  return out;
}

// How many crests the year crown carries in its current mode.
function yearCrests(year) {
  return yearMode === "weeks" ? yearCrownWeeks(year).length : 12;
}

function weekLabel(offset) {
  const a = new Date(mondayMsOf(offset));
  const b = new Date(a.getTime() + 6 * DAY_MS);

  const dd = n => String(n).padStart(2, "0");
  const dA = dd(a.getUTCDate()), mA = MONTHS[a.getUTCMonth()], yA = a.getUTCFullYear();
  const dB = dd(b.getUTCDate()), mB = MONTHS[b.getUTCMonth()], yB = b.getUTCFullYear();

  if (yA !== yB) return `${dA} ${mA} ${yA} - ${dB} ${mB} ${yB}`;
  if (mA !== mB) return `${dA} ${mA} - ${dB} ${mB} ${yA}`;
  return `${dA} - ${dB} ${mA} ${yA}`;
}

// Short crest label for a week on the month crown: "06 - 12"
function weekCrestLabel(k) {
  const a = new Date(mondayMsOf(k));
  const b = new Date(a.getTime() + 6 * DAY_MS);
  const dd = n => String(n).padStart(2, "0");
  return `${dd(a.getUTCDate())} - ${dd(b.getUTCDate())}`;
}

// If a new month begins during this week, its full name
function monthStartingInWeek(offset) {
  for (let i = 0; i < 7; i++) {
    const d = new Date(mondayMsOf(offset) + i * DAY_MS);
    if (d.getUTCDate() === 1) return MONTHS_FULL[d.getUTCMonth()];
  }
  return null;
}

/*
  The colour of now. The HH:MM follows the daylight: moonlit
  blue through the night, amber at dawn, gold through the
  morning, near-white at noon, back through gold to a sunset
  orange and dusk violet-blue. Linear blend between stops.
*/
const DAYLIGHT_STOPS = [
  [0,    [100, 120, 200]],   // deep night blue
  [4.5,  [110, 130, 210]],   // late night
  [6,    [242, 166, 90]],    // dawn amber
  [9,    [255, 209, 102]],   // morning gold
  [13,   [255, 240, 160]],   // noon, near white
  [17,   [255, 209, 102]],   // afternoon gold
  [19.5, [244, 132, 95]],    // sunset orange
  [21.5, [138, 147, 216]],   // dusk violet-blue
  [24,   [100, 120, 200]]    // night again
];

function daylightColor(hourFloat) {
  let a = DAYLIGHT_STOPS[0], b = DAYLIGHT_STOPS[DAYLIGHT_STOPS.length - 1];
  for (let i = 0; i < DAYLIGHT_STOPS.length - 1; i++) {
    if (hourFloat >= DAYLIGHT_STOPS[i][0] && hourFloat <= DAYLIGHT_STOPS[i + 1][0]) {
      a = DAYLIGHT_STOPS[i];
      b = DAYLIGHT_STOPS[i + 1];
      break;
    }
  }
  const f = b[0] === a[0] ? 0 : (hourFloat - a[0]) / (b[0] - a[0]);
  const c = a[1].map((v, i) => Math.round(v + (b[1][i] - v) * f));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

// "WED 09 JUL 2026" for the day crown's corner label
function dayTitle(dateMs) {
  const d = new Date(dateMs);
  const dow = (d.getUTCDay() + 6) % 7;
  return `${DAYS[dow]} ${String(d.getUTCDate()).padStart(2, "0")} ` +
         `${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}

function monthTitle(mAbs) {
  const m = ((mAbs % 12) + 12) % 12;
  return `${MONTHS_FULL[m]} ${Math.floor(mAbs / 12)}`;
}

/* =========================
   CAMERA STATE
========================= */

let fitZoom = 1; // frames one crown; computed on resize

const camera = {
  yaw: 0,
  tilt: CONFIG.tiltDefault,
  zoomLog: 0,

  target: {
    yaw: 0,
    tilt: CONFIG.tiltDefault,
    zoomLog: 0
  }
};

function clamp(min, max, v) {
  return Math.max(min, Math.min(max, v));
}

// Smoothstep: eases a 0..1 value so transitions start and stop gently
// rather than linearly. Used for the more gradual, cascading fades.
function smooth(x) {
  x = clamp(0, 1, x);
  return x * x * (3 - 2 * x);
}

// Resting tilt per layer. The day crown sits more tilted by default so you
// can see over the top to the back of the curve; the rest stay near flat.
function layerTilt() {
  return layer === LAYER.DAY ? CONFIG.tiltDefaultDay : CONFIG.tiltDefault;
}

function setZoomTarget(z) {
  // Zoom-out room extends below the framed view; the leap to
  // the next layer only happens at the bottom of that room.
  camera.target.zoomLog = Math.log(clamp(fitZoom * 0.35, CONFIG.zoomMax, z));
}

function updateCamera(dt) {
  const k = (rate) => 1 - Math.exp(-rate * dt);

  const yawBefore = camera.yaw;

  /* Returning to now runs in two gears. While whole turns are still to be
     covered the crown spins at a steady rate, so the trip reads as a spin
     rather than a blur. Inside the last turn it hands over to a gentle ease,
     which brings it round slowly onto the exact day and time. */
  const yawGap = camera.target.yaw - camera.yaw;

  if (returnRush && Math.abs(yawGap) <= TAU * 1.15) returnRush = false;

  if (returnRush) {
    const step = Math.sign(yawGap) * recoilTurnsPerSec * TAU * dt;
    camera.yaw += Math.abs(step) > Math.abs(yawGap) ? yawGap : step;
  } else {
    const yawRate = returningNow ? recoilSettle : CONFIG.damping.yaw;
    camera.yaw += yawGap * k(yawRate);
  }

  // No tilt travel while changing magnification: the move is a zoom and a
  // fade, not a tip.
  if (!layerAnim) {
    camera.tilt  += (camera.target.tilt    - camera.tilt)    * k(CONFIG.damping.tilt);
  }
  camera.zoomLog += (camera.target.zoomLog - camera.zoomLog) * k(CONFIG.damping.zoom);

  camera.tilt = clamp(CONFIG.tiltMin, CONFIG.tiltMax, camera.tilt);

  // Smoothed spin speed (turns per frame), low-pass filtered so it doesn't
  // flicker. Drives how much of the back of a crown is hidden: still crown
  // shows all the way round, a spinning one hides its back to cover the
  // date changing hands.
  const instSpeed = Math.abs(camera.yaw - yawBefore) / TAU;
  spinSpeed += (instSpeed - spinSpeed) * 0.25;
  // The same thing but signed, so the sound knows which way it is winding.
  spinVel += ((camera.yaw - yawBefore) / TAU - spinVel) * 0.25;
}

function cameraZoom() {
  return Math.exp(camera.zoomLog);
}

/* =========================
   CANVAS
========================= */

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const hud = document.getElementById("hud");
const videoEl = document.getElementById("video");

let viewW = 0, viewH = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.dprCap);
  viewW = cv.clientWidth || innerWidth;
  viewH = cv.clientHeight || innerHeight;

  cv.width = Math.floor(viewW * dpr);
  cv.height = Math.floor(viewH * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // The framed view of one crown, at any tilt
  const shapeW = 2 * CONFIG.baseRadius + 80;
  const shapeH = 2 * CONFIG.baseRadius * CONFIG.tiltMax
               + CONFIG.baseAmplitude + 120;

  fitZoom = Math.min(
    (viewW * 0.94) / shapeW,
    (viewH * 0.92) / shapeH
  );

  camera.target.zoomLog = Math.max(camera.target.zoomLog, Math.log(fitZoom));
}

window.addEventListener("resize", resize);
resize();

camera.zoomLog = camera.target.zoomLog = Math.log(fitZoom);

/* =========================
   LAYER STATE
   The microscope. layer is what you're looking at; layerAnim
   carries the optical crossfade between magnifications.
========================= */

const LAYER = { WEEK: 0, MONTH: 1, YEAR: 2, DAY: 3 };

let layer = LAYER.WEEK;

// Selections at each magnification
let weekOffset = 0;                       // weeks from now
let spinSpeed = 0;                        // smoothed |yaw| turns/frame
let spinVel = 0;                          // the same, signed - drives the sound
// Once the drift home takes hold it latches on, so its own gentle movement
// can't trip the motion guard and stall it half way. Interaction drops it.
let driftEngaged = false;
let selMonthAbs = null;                   // set on first use
let selYear = null;
let selDayMs = null;                      // UTC date ms of the viewed day

// Layer transition: null or { from, to, start, dir }
// dir +1 = zooming out (to bigger unit), -1 = diving in
let layerAnim = null;

function easeInOut(p) {
  return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
}

function startLayerAnim(from, to, dir) {
  layerAnim = { from, to, start: performance.now(), dir };
  layer = to;
  // Diving in falls, stepping out rises.
  soundStep(dir < 0);

  /* A change of magnification is a straight zoom with a fade through it, and
     nothing else. The tilt is snapped to the new layer's resting angle right
     away rather than eased, so the camera never appears to tip over during
     the move - the crossfade covers the change. The zoom target is set and
     left to travel, so the move reads as a zoom rather than a cut.

     The spin is cleared outright, not eased away. Layers read their date from
     the accumulated yaw - one turn is a day on the day crown, a week on the
     week crown - so arriving with spin still on the camera would have the new
     crown showing, and tagging, the wrong day until it settled. */
  camera.yaw = 0;
  camera.target.yaw = 0;
  camera.target.tilt = layerTilt();
  camera.tilt = camera.target.tilt;
  setZoomTarget(fitZoom);
}

/*
  Fold whatever has been spun into the selected unit. The yaw runs free while
  you turn the crown - that is what lets the elastic band remember how far you
  travelled - so the unit only catches up at the moments it matters: changing
  magnification, or jumping across layers. Without this you would step out of
  the week you are looking at and land on the one you started from.
*/
function syncUnitToSpin() {
  const turns = Math.round(camera.yaw / TAU);
  if (turns !== 0) {
    if (layer === LAYER.DAY) selDayMs += turns * DAY_MS;
    else if (layer === LAYER.WEEK) weekOffset += turns;
    else if (layer === LAYER.MONTH) selMonthAbs += turns;
    else selYear += turns;
  }
  camera.yaw = 0;
  camera.target.yaw = 0;
}

/*
  Turn a crown so a given point on its ring sits front and centre. Takes the
  short way round - never a needless extra revolution - and is used when
  stepping out, so the bigger view opens on whatever you were just inside
  rather than snapping back to now.
*/
function centreOnT(tTarget, rotBase) {
  let turns = tTarget - (rotBase - Math.PI / 2) / TAU;
  turns -= Math.round(turns);
  camera.yaw = turns * TAU;
  camera.target.yaw = camera.yaw;
}

/*
  Turn the week crown so a given date's hours sit at the front. weekOffset
  already carries the whole weeks, so the yaw carries only what is left -
  folding it again would take off an extra week whenever the day sits in a
  neighbouring calendar week.
*/
function centreWeekOnDate(dateMs) {
  const dayDelta = Math.round((dateMs - timeState.dateMs) / DAY_MS);
  camera.yaw = ((dayDelta - weekOffset * 7) / 7) * TAU;
  camera.target.yaw = camera.yaw;
}

function zoomOutLayer() {
  if (layerAnim) return;
  syncUnitToSpin();

  if (layer === LAYER.DAY) {
    // Step out of a day and the week opens with that day at the front.
    const dayMs = selDayMs;
    weekOffset = weekOffsetOfDate(dayMs);
    startLayerAnim(LAYER.DAY, LAYER.WEEK, +1);
    centreWeekOnDate(dayMs);

  } else if (layer === LAYER.WEEK) {
    // Step out of a week and the month opens with that week at the front.
    const wk = weekOffset;
    selMonthAbs = weekInfo(wk).monthAbs;
    startLayerAnim(LAYER.WEEK, LAYER.MONTH, +1);
    const weeks = monthCrownWeeks(selMonthAbs);
    const w = Math.max(0, weeks.indexOf(wk));
    centreOnT((w + 0.5) / weeks.length,
              layerRot(LAYER.MONTH, selMonthAbs));

  } else if (layer === LAYER.MONTH) {
    // Step out of a month and the year opens with that month at the front.
    const mAbs = selMonthAbs;
    selYear = Math.floor(mAbs / 12);
    startLayerAnim(LAYER.MONTH, LAYER.YEAR, +1);
    if (yearMode === "weeks") {
      const wk = yearCrownWeeks(selYear);
      const target = weekOffsetOfDate(Date.UTC(selYear, ((mAbs % 12) + 12) % 12, 15));
      const w = Math.max(0, wk.indexOf(target));
      centreOnT((w + 0.5) / wk.length, layerRot(LAYER.YEAR, selYear));
    } else {
      const mo = ((mAbs % 12) + 12) % 12;
      centreOnT((mo + 0.5) / 12, layerRot(LAYER.YEAR, selYear));
    }
  }
}

/*
  Open a day at a particular moment: the day crown arrives with that time at
  the front, exactly where the projected marker was pointing. Used when the
  projected time itself is clicked.
*/
function diveIntoDayAt(ms) {
  if (layerAnim) return;
  const d = new Date(ms);
  const dayMs = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  diveIntoDay(dayMs);
  const tTime = tFromHMS(0, d.getUTCHours(), d.getUTCMinutes(), 0) * 7;
  centreOnT(tTime, layerRot(LAYER.DAY, dayMs));
}

/*
  Drop into a day and arrive with a given minute of it front and centre. The
  projected moment uses this, so clicking it takes you to that day at that
  time rather than merely to the day.
*/
function diveIntoDayAt(dateMs, mins) {
  if (layerAnim) return;
  syncUnitToSpin();
  const from = layer;
  selDayMs = dateMs;
  startLayerAnim(from, LAYER.DAY, -1);
  centreOnT(tFromHMS(0, Math.floor(mins / 60), mins % 60, 0) * 7,
            layerRot(LAYER.DAY, dateMs));
}

function diveIntoDay(dateMs) {
  if (layerAnim) return;
  syncUnitToSpin();
  selDayMs = dateMs;
  startLayerAnim(LAYER.WEEK, LAYER.DAY, -1);
}

function diveIntoWeek(k, dayIdx) {
  if (layerAnim) return;
  syncUnitToSpin();
  weekOffset = k;
  startLayerAnim(LAYER.MONTH, LAYER.WEEK, -1);

  // Arrive with the chosen day front and centre. Idle drift
  // will ease it home later.
  if (dayIdx != null) {
    const rotNeeded = Math.PI / 2 + (dayIdx + 0.5) * 2 * Math.PI / 7;
    const base = weekOffset === 0
      ? Math.PI / 2 + timeState.t * 2 * Math.PI
      : homeRot(7);
    camera.target.yaw = rotNeeded - base;
    camera.yaw = camera.target.yaw;
  }
}

function diveIntoMonth(mAbs) {
  if (layerAnim) return;
  syncUnitToSpin();
  selMonthAbs = mAbs;
  startLayerAnim(LAYER.YEAR, LAYER.MONTH, -1);
}

// The week system year holds weeks, so clicking one drops straight into it
// rather than by way of the month.
function diveIntoWeekFromYear(k) {
  if (layerAnim) return;
  syncUnitToSpin();
  weekOffset = k;
  selMonthAbs = weekInfo(k).monthAbs;
  startLayerAnim(LAYER.YEAR, LAYER.WEEK, -1);
}

/*
  Flip the year between its two systems. Rather than swapping the crown out,
  it stretches: the crests draw down toward a flat ring, the profile crossfades
  from one count to the other while it is at its lowest, and it swells back
  out in the new form. The detail goes with it, so nothing pops - the whole
  thing contracts, changes, and expands.
*/
let yearMorph = null;   // { t0, from, to, nextMode, switched }

function toggleYearMode() {
  if (layerAnim || yearMorph) return;
  touch();

  const nextMode = yearMode === "months" ? "weeks" : "months";
  yearMorph = {
    t0: performance.now(),
    from: yearCrests(selYear),
    to: nextMode === "weeks" ? yearCrownWeeks(selYear).length : 12,
    nextMode,
    switched: false
  };

  flashInfo(nextMode === "weeks" ? "Year by week" : "Year by month", 1600);
}

// Where the morph has got to, and the moment it hands over. Returns null when
// there is no morph running.
function yearMorphNow() {
  if (!yearMorph) return null;

  const p = clamp(0, 1, (performance.now() - yearMorph.t0) / CONFIG.yearMorphMs);

  // The systems change hands at the pinch, where the crown is flattest and
  // the detail has faded out, so the swap is never seen.
  if (p >= 0.5 && !yearMorph.switched) {
    yearMode = yearMorph.nextMode;
    yearMorph.switched = true;
    camera.target.yaw = 0;
    camera.yaw = 0;
  }

  if (p >= 1) { yearMorph = null; return null; }

  /* Both forms are live at once, crossfaded by opacity. The only geometry
     that moves is the width of the bases, and it is kept on a short leash:
     at rest each peak already spans exactly to its neighbour's centre, so
     widening past that overlaps them and lifts the troughs - which reads as
     the curve rising, the very thing we are avoiding. A modest swell stretches
     the bases visibly while leaving the valleys on the floor. */
  const e = smooth(p);
  const swell = Math.sin(p * Math.PI) * CONFIG.yearMorphStretch;

  return {
    p,
    e,
    from: yearMorph.from,
    to: yearMorph.to,
    outWidth: 1 + swell,        // the form on its way out pulls wide
    inWidth: 1 + swell,         // the one arriving settles back to its own
    outAlpha: 1 - e,
    inAlpha: e,
    detail: 1 - Math.sin(p * Math.PI)
  };
}

/*
  Which slot is at the front of a crown right now - the one facing the camera,
  dead centre. Stepping in should always take you into whatever is sitting
  there, not into today.
*/
function frontSlot(count, rotBase) {
  const rot = rotBase + camera.yaw;
  let best = -2, bestSlot = 0;
  for (let i = 0; i < count; i++) {
    const f = Math.sin(-((i + 0.5) / count) * TAU + rot);
    if (f > best) { best = f; bestSlot = i; }
  }
  return bestSlot;
}

// The date the week crown is showing at front and centre - the day whose
// hours occupy that point, not the nearest crest. A day's hours run forward
// from its own crest, so late in the evening the next crest is closer while
// the hours at the front are still today's. One turn carries the front point
// seven days.
function frontWeekDayMs() {
  return timeState.dateMs + weekOffset * 7 * DAY_MS +
    Math.round((camera.yaw / TAU) * 7) * DAY_MS;
}

function diveDefault() {
  if (layer === LAYER.WEEK) {
    // The day at the front, whichever one you have turned to.
    diveIntoDay(frontWeekDayMs());

  } else if (layer === LAYER.MONTH) {
    // The week at the front of the month crown.
    const weeks = monthCrownWeeks(selMonthAbs);
    const N = weeks.length;
    const rotBase = layerRot(LAYER.MONTH, selMonthAbs);
    const w = frontSlot(N, rotBase);
    diveIntoWeek(weeks[w] + N * crownK(w, N, rotBase, camera.yaw), null);

  } else if (layer === LAYER.YEAR && yearMode === "weeks") {
    // The week at the front of the year-by-weeks crown.
    const wk = yearCrownWeeks(selYear);
    const N = wk.length;
    const rotBase = layerRot(LAYER.YEAR, selYear);
    const w = frontSlot(N, rotBase);
    const yr = selYear + crownK(w, N, rotBase, camera.yaw);
    const list = yearCrownWeeks(yr);
    diveIntoWeekFromYear(list[Math.min(w, list.length - 1)]);

  } else if (layer === LAYER.YEAR) {
    // The month at the front of the year-by-months crown.
    const rotBase = layerRot(LAYER.YEAR, selYear);
    const mo = frontSlot(12, rotBase);
    diveIntoMonth((selYear + crownK(mo, 12, rotBase, camera.yaw)) * 12 + mo);
  }
}

/*
  Home. Whether you've spun three weeks ahead, dived into a
  distant month, or drifted the camera off axis - one call
  brings the spotlight back: now's unit on the current layer,
  camera settled, time front and centre.
*/
// Distance from now in whole units plus the live fraction of a turn, so it
// survives the spin commit folding turns away.
function unitsFromNow() {
  let whole = 0;
  if (layer === LAYER.DAY) whole = (selDayMs - timeState.dateMs) / DAY_MS;
  else if (layer === LAYER.WEEK) whole = weekOffset;
  else if (layer === LAYER.MONTH) whole = selMonthAbs - timeState.monthAbs;
  else whole = selYear - Math.floor(timeState.monthAbs / 12);
  return Math.abs(whole) + Math.abs(camera.yaw) / TAU;
}

// The same distance, signed and in whole units only.
function signedUnitsFromNow() {
  if (layer === LAYER.DAY) {
    return Math.round((selDayMs - timeState.dateMs) / DAY_MS);
  }
  if (layer === LAYER.WEEK) return weekOffset;
  if (layer === LAYER.MONTH) return selMonthAbs - timeState.monthAbs;
  return selYear - Math.floor(timeState.monthAbs / 12);
}

function isAtNow() {
  if (layer === LAYER.DAY) return selDayMs === timeState.dateMs;
  if (layer === LAYER.WEEK) return weekOffset === 0;
  if (layer === LAYER.MONTH) return selMonthAbs === timeState.monthAbs;
  return selYear === Math.floor(timeState.monthAbs / 12);
}

/*
  Recoil to now. The crown is set to now outright, then the camera is
  displaced backwards by however far you had travelled, so the view opens
  exactly where you were and unwinds from there. Because the destination is
  set up front it can never land on the wrong week. Distance sets the tension:
  the further out, the faster it comes back, while the landing stays soft.
*/
const RETURN_MAX_TURNS = 8;

function goToNow(fromElastic = false) {
  touch();
  projFade = 0;
  projNow = null;
  returningNow = true;

  let signed = signedUnitsFromNow() + camera.yaw / TAU;

  weekOffset = 0;
  selMonthAbs = timeState.monthAbs;
  selYear = Math.floor(timeState.monthAbs / 12);
  selDayMs = timeState.dateMs;

  if (Math.abs(signed) > RETURN_MAX_TURNS) {
    signed = Math.sign(signed) * RETURN_MAX_TURNS;
  }

  const stretch = Math.abs(signed);
  recoilTurnsPerSec = CONFIG.recoilBaseTurnsPerSec + stretch * CONFIG.recoilTensionGain;
  recoilSettle = CONFIG.damping.yawSettle + stretch * 0.55;

  camera.yaw = signed * TAU;
  camera.target.yaw = 0;
  returnRush = stretch >= 1;

  camera.target.tilt = layerTilt();
  setZoomTarget(fitZoom);
  elasticArmed = false;
}

/*
  Jump to any magnification directly. Going out, the chain of
  containment is derived from where you are; coming in, it aims
  at the unit holding now when it can, the first unit when it
  can't.
*/
const LAYER_RANK = {
  [LAYER.DAY]: 0, [LAYER.WEEK]: 1, [LAYER.MONTH]: 2, [LAYER.YEAR]: 3
};

function goToLayer(target) {
  if (layerAnim || target === layer) return;
  syncUnitToSpin();
  const up = LAYER_RANK[target] > LAYER_RANK[layer];

  // sync the containment chain from the current position
  if (layer === LAYER.DAY) {
    const dow = (new Date(selDayMs).getUTCDay() + 6) % 7;
    weekOffset = Math.round(
      (selDayMs - dow * DAY_MS - timeState.mondayMs) / (7 * DAY_MS)
    );
  }
  if (LAYER_RANK[layer] <= 1) selMonthAbs = weekInfo(weekOffset).monthAbs;
  if (LAYER_RANK[layer] <= 2) selYear = Math.floor(selMonthAbs / 12);

  if (!up) {
    if (LAYER_RANK[layer] === 3 && LAYER_RANK[target] <= 2) {
      selMonthAbs = Math.floor(timeState.monthAbs / 12) === selYear
        ? timeState.monthAbs
        : selYear * 12;
    }
    if (LAYER_RANK[target] <= 1) {
      const weeks = monthCrownWeeks(selMonthAbs);
      weekOffset = weeks.includes(0) ? 0 : weeks[0];
    }
    if (target === LAYER.DAY) {
      const monday = mondayMsOf(weekOffset);
      const inWeek = timeState.dateMs >= monday &&
                     timeState.dateMs < monday + 7 * DAY_MS;
      selDayMs = inWeek ? timeState.dateMs : monday;
    }
  }

  touch();
  startLayerAnim(layer, target, up ? 1 : -1);
}

// Step the current layer's unit (arrows / arrow keys)
function stepUnit(dir) {
  if (layerAnim) return;
  if (layer === LAYER.DAY) selDayMs += dir * DAY_MS;
  else if (layer === LAYER.WEEK) weekOffset += dir;
  else if (layer === LAYER.MONTH) selMonthAbs += dir;
  else selYear += dir;
}

/*
  Launch a full animated spin to the previous or next unit.
  Adds one revolution to the yaw target; the spin-commit in the
  draw loop folds it back immediately and swaps the engraving,
  so the damped recovery plays out as the spin itself. The sign
  follows each layer's reading direction - the year runs
  mirrored - so "next" always spins forward in time.
*/
/*
  Spiral streaming. The ring is a window onto a helix of time.
  As the crown spins, each slot swaps to its next occurrence at
  the moment it passes the seam - the hidden point half a turn
  from the spin phase - so old time slips out through the back
  while new time emerges, one slot at a time, like treads on a
  spiral staircase. A full turn advances everything by exactly
  one unit and hands over seamlessly to the spin commit.

  aj: the slot's fractional position around the ring (0..1).
  yawForward: yaw signed so that forward-in-time is positive.
  Returns how many whole rings this slot has advanced.
*/
/*
  Shared crown numbering. Works out which occurrence a slot is showing, and
  swaps it only at the dead back of the ring, where the spin fade has already
  taken the label to black - so a date is never seen changing hands.

  slot is the index of the crest, count how many there are, rotBase the
  layer's rotation without the camera yaw.
*/
function crownK(slot, count, rotBase, yaw) {
  const t = (slot + 0.5) / count;
  const back0 = (-Math.PI / 2 + t * TAU - rotBase) / TAU;
  return Math.round(yaw / TAU - back0 + 0.5) - Math.round(-back0 + 0.5);
}

function streamK(aj, yawForward) {
  const s = yawForward / TAU;
  return Math.floor(aj - 0.5 + s) - Math.floor(aj - 0.5);
}

function spinToUnit(dir) {
  if (layerAnim) return;
  // Push yaw the same way the wrap reads it: a forward step (dir = 1) spins
  // yaw forward, which the wrap turns into the next unit. Every layer now
  // reads a forward spin as later, so there is no per layer sign flip.
  camera.target.yaw += dir * 2 * Math.PI;
  touch();
}

/* =========================
   CALENDAR
   Events live in the browser: localStorage, keyed date +
   half-hour. No server, no accounts. Export and import move
   them between machines as plain JSON.
========================= */

const STORE_KEY = "weekwave.events.v1";
const canStore = typeof localStorage !== "undefined";

let events = [];
if (canStore) {
  try { events = JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); }
  catch (e) { events = []; }
}

let eventsByDate = new Map();

function indexEvents() {
  eventsByDate = new Map();
  for (const ev of events) {
    if (!eventsByDate.has(ev.dateMs)) eventsByDate.set(ev.dateMs, []);
    eventsByDate.get(ev.dateMs).push(ev);
  }
  for (const list of eventsByDate.values()) {
    list.sort((a, b) => a.startMin - b.startMin);
  }
}
indexEvents();

function saveEvents() {
  if (canStore) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(events)); }
    catch (e) {}
  }
  indexEvents();
}

function minToHHMM(min) {
  return `${String(Math.floor(min / 60)).padStart(2, "0")}:` +
         `${String(min % 60).padStart(2, "0")}`;
}

/* --- Composer --- */

const composerEl = document.getElementById("composer");
let composing = null; // { dateMs, startMin, id? }

function openComposer(slot, existing) {
  composing = existing
    ? { dateMs: existing.dateMs, startMin: existing.startMin, id: existing.id }
    : { dateMs: slot.dateMs, startMin: slot.startMin };

  composerEl.value = existing ? existing.title : "";
  document.body.classList.add("compose");
  if (composerEl.focus) composerEl.focus();
  touch();
}

function closeComposer(save) {
  if (save && composing) {
    const title = (composerEl.value || "").trim();

    if (composing.id) {
      const i = events.findIndex(ev => ev.id === composing.id);
      if (i >= 0) {
        if (title) events[i].title = title;
        else events.splice(i, 1);   // emptied = removed
      }
    } else if (title) {
      events.push({
        id: Math.random().toString(36).slice(2, 10),
        dateMs: composing.dateMs,
        startMin: composing.startMin,
        title
      });
    }
    saveEvents();
  }

  composing = null;
  composerEl.value = "";
  if (composerEl.blur) composerEl.blur();
  document.body.classList.remove("compose");
}

composerEl.addEventListener("keydown", e => {
  e.stopPropagation();
  if (e.key === "Enter") closeComposer(true);
  if (e.key === "Escape") closeComposer(false);
});

/* --- Export / import (E and I keys) --- */

function exportEvents() {
  const blob = new Blob([JSON.stringify(events, null, 2)],
                        { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "weekwave-events.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function importEvents() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "application/json";
  inp.onchange = () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (Array.isArray(data)) {
          events = data.filter(ev =>
            ev && typeof ev.dateMs === "number" &&
            typeof ev.startMin === "number" &&
            typeof ev.title === "string"
          ).map(ev => ({
            id: ev.id || Math.random().toString(36).slice(2, 10),
            dateMs: ev.dateMs,
            startMin: ev.startMin,
            title: ev.title
          }));
          saveEvents();
        }
      } catch (e) {}
    };
    reader.readAsText(file);
  };
  inp.click();
}

  Information proximity. At rest the instrument goes quiet: all

  floating time. Bring the cursor toward the ring and the
  engraving surfaces - numbers first; touch a number on the
  month crown and its day letter appears beside it.
*/

// whatever is under the cursor.

// The half-hour chunk under the cursor, if any - a click on it
// opens the composer to name that moment.

let hoverInfoShown = "";
let flashMsg = "";
let flashUntil = 0;

// A line in the strip for a moment, then gone.
function flashInfo(msg, ms) {
  flashMsg = msg;
  flashUntil = performance.now() + (ms || 3400);
}
const infoEl = document.getElementById("info");

const DAY_LETTERS = ["m", "t", "w", "t", "f", "s", "s"];

window.addEventListener("mousemove", e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

window.addEventListener("mouseleave", () => {
  mouseX = -1;
  mouseY = -1;
});

/*
  Touch and mouse share the pointer events. One finger drags to
  spin and tilt; two fingers pinch to zoom and twist to spin,
  exactly like the trackpad. On a phone there is no hover, so
  the finger's last resting place becomes the focus - it wakes
  the engraving and drives the info strip the way a cursor
  would. It fades after a moment so the crown returns to calm.
*/
const active = new Map(); // pointerId -> {x, y}
let pinch = null;         // { dist, cx, cy, ang }
let touchFocusUntil = 0;

cv.addEventListener("pointerdown", e => {
  touch();
  active.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cv.setPointerCapture(e.pointerId);

  if (active.size === 1) {
    pointer.dragging = true;
    pointer.moved = 0;
    pointer.lastX = e.clientX;
    pointer.lastY = e.clientY;
    pointer.held = true;
    pointer.grabX = e.clientX;
    pointer.curX = e.clientX;
  } else if (active.size === 2) {
    pointer.dragging = false;   // two fingers is pinch, not drag
    pointer.held = false;       // and not a throttle either
    startPinch();
  }
});

cv.addEventListener("pointerup", e => {
  const was = active.get(e.pointerId);
  active.delete(e.pointerId);
  cv.releasePointerCapture(e.pointerId);

  if (active.size < 2) pinch = null;

  if (active.size === 1) {
    // one finger remains: resume dragging from it
    const [only] = active.values();
    pointer.dragging = true;
    pointer.moved = 999; // a lifted pinch finger is not a tap
    pointer.lastX = only.x;
    pointer.lastY = only.y;
    pointer.held = true;
    pointer.grabX = only.x;
    pointer.curX = only.x;
  } else if (active.size === 0) {
    pointer.dragging = false;
    pointer.held = false;

    // A press without a drag is a tap: navigate, and leave a
    // focus so the tapped spot behaves like a hover briefly.
    if (was && pointer.moved < 8 && !layerAnim) {
      if (e.pointerType === "touch") {
        mouseX = was.x;
        mouseY = was.y;
        touchFocusUntil = performance.now() + 2600;
      }
      handleClick(was.x, was.y);
    }
  }
});

function startPinch() {
  const pts = [...active.values()];
  const dx = pts[1].x - pts[0].x, dy = pts[1].y - pts[0].y;
  pinch = {
    dist: Math.hypot(dx, dy),
    ang: Math.atan2(dy, dx),
    cx: (pts[0].x + pts[1].x) / 2,
    cy: (pts[0].y + pts[1].y) / 2
  };
}

cv.addEventListener("pointermove", e => {
  if (!active.has(e.pointerId)) return;
  touch();
  active.get(e.pointerId).x = e.clientX;
  active.get(e.pointerId).y = e.clientY;

  if (active.size >= 2 && pinch) {
    const pts = [...active.values()];
    const dx = pts[1].x - pts[0].x, dy = pts[1].y - pts[0].y;
    const dist = Math.hypot(dx, dy);
    const ang = Math.atan2(dy, dx);

    // Spread to zoom
    if (pinch.dist > 0) {
      setZoomTarget(Math.exp(camera.target.zoomLog) * (dist / pinch.dist));
    }
    // Twist to spin
    let dAng = ang - pinch.ang;
    if (dAng > Math.PI) dAng -= 2 * Math.PI;
    if (dAng < -Math.PI) dAng += 2 * Math.PI;
    camera.target.yaw += dAng;

    pinch.dist = dist;
    pinch.ang = ang;
    return;
  }

  if (!pointer.dragging) return;

  const dx = e.clientX - pointer.lastX;
  const dy = e.clientY - pointer.lastY;
  pointer.moved += Math.abs(dx) + Math.abs(dy);

  /* Horizontal is the throttle, not a shove: how far you hold from the grab
     point sets how fast the crown turns, and the draw loop spins it for as
     long as you hold. Vertical still tilts. */
  pointer.curX = e.clientX;
  camera.target.tilt = clamp(
    CONFIG.tiltMin, CONFIG.tiltMax,
    camera.target.tilt - dy * 0.0008
  );

  // On touch, a moving finger is also the live focus
  if (e.pointerType === "touch") {
    mouseX = e.clientX;
    mouseY = e.clientY;
    touchFocusUntil = performance.now() + 2600;
  }

  pointer.lastX = e.clientX;
  pointer.lastY = e.clientY;
});

cv.addEventListener("wheel", e => {
  touch();
  e.preventDefault();
  if (layerAnim) return;

  /*
    Every gesture stays inside the form. Pinch, scroll, pull
    apart, spin - all play with the crown you're on. Levels
    change only by choice: a click. Pinch (ctrl-wheel on
    trackpads) is just a stronger zoom.
  */
  if (e.ctrlKey) {
    setZoomTarget(
      Math.exp(camera.target.zoomLog) * (e.deltaY > 0 ? 0.95 : 1.055)
    );
    return;
  }

  // Horizontal scroll spins the crown - the trackpad way to
  // scrub through weeks, months, years.
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
    camera.target.yaw += e.deltaX * 0.003;
    return;
  }

  setZoomTarget(
    Math.exp(camera.target.zoomLog) * (e.deltaY > 0 ? 0.965 : 1.036)
  );
}, { passive: false });

window.addEventListener("keydown", e => {
  if (composing) return;   // the composer owns the keyboard
  touch();

  /* Set the station by hand. Stream addresses are guesswork from the outside
     and this ends the guessing: paste one, it is tried at once and kept if it
     works, so the next visit opens on it. */
  if (e.key === "u" || e.key === "U") {
    const entered = prompt("Stream address", RADIO.url);
    if (entered && entered.trim()) {
      RADIO.url = entered.trim();
      if (canStore) {
        try { localStorage.setItem("weekwave.radio.v1", RADIO.url); } catch (err) {}
      }
      RADIO.on = true;
      radioBtn.classList.add("on");
      radioStop();
      RADIO.on = true;
      radioStart();
      flashInfo("Tuning in…", 2200);
    }
    return;
  }
  if (e.key === "r" || e.key === "R") {
    if (RADIO.on) { radioStop(); RADIO.on = true; radioStart(); flashInfo("Tuning in…", 2200); }
    return;
  }
  /* Full screen, for leaving it running on a spare display. The day crown at
     rest is the one worth looking at for a long time. */
  if (e.key === "f" || e.key === "F") {
    const el = document.documentElement;
    if (document.fullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
    } else if (el.requestFullscreen) {
      el.requestFullscreen();
    }
    return;
  }
  if (e.key === "e" || e.key === "E") { exportEvents(); return; }
  if (e.key === "i" || e.key === "I") { importEvents(); return; }
  if (e.key === "Escape") {
    // Escape always steps out one magnification
    if (layer !== LAYER.YEAR && !layerAnim) zoomOutLayer();
    return;
  }
  if (e.key === "=" || e.key === "+") {
    setZoomTarget(Math.exp(camera.target.zoomLog) * 1.055);
  }
  if (e.key === "-") {
    setZoomTarget(Math.exp(camera.target.zoomLog) * 0.95);
  }
  if (e.key === "ArrowUp") {
    stepUnit(1);
    e.preventDefault();
  }
  if (e.key === "ArrowDown") {
    stepUnit(-1);
    e.preventDefault();
  }
  if (e.key === "ArrowRight") {
    spinToUnit(1);
    e.preventDefault();
  }
  if (e.key === "ArrowLeft") {
    spinToUnit(-1);
    e.preventDefault();
  }
  if (e.key === "0") goToNow();
});

/* --- Click hit testing against the visible crown's targets --- */

// Elastic band: spinning away stretches it, letting go recoils. Armed once the
// crown settles away from now; fires after the dwell if you don't engage.
let elasticArmed = false;
let elasticSince = 0;
let returnRush = false;
let recoilTurnsPerSec = 2.6;
let recoilSettle = 1.7;

let projFade = 0;           // projection markers: full on activity, fade when idle
let projNow = null;         // the moment at front-and-centre when spun off
let returningNow = false;   // set while snapping back to now - hides projection
let restAmt = 0;            // 0 = full detail, 1 = stripped to wave + now
// How close the cursor is to the ring, 0..1. Read by anything that should
// treat looking at the crown as using it. Written once per frame in draw.
let nearRing = 0;

let hitTargets = [];   // rebuilt each frame: {x, y, r, action}

function handleClick(x, y) {
  /* The half-hour chunk under the cursor is the finest target on the form, so
     it takes the click before the broader ones.

     A chunk that already holds a moment is a way further in: on the week it
     drops to that day, where the moment can be opened and edited. An empty
     chunk names a new moment. On the day crown there is nowhere deeper to go,
     so a chunk there always opens the composer. */
  /* Things you aim at - a day label, the projected moment - are checked on
     their own and take the click outright. Near the front of the crown they
     sit almost on top of the half-hour chunks, so leaving it to whichever is
     marginally nearer means a label click keeps landing on the chunk beside
     it, which belongs to the day before. */
  let aimed = null;
  for (const h of hitTargets) {
    if (!h.primary) continue;
    const d = Math.hypot(x - h.x, y - h.y);
    if (d < h.r && (!aimed || d < aimed.d)) aimed = { d, h };
  }
  if (aimed) {
    touch();
    aimed.h.action();
    return;
  }

  let best = null;
  for (const h of hitTargets) {
    const d = Math.hypot(x - h.x, y - h.y);
    if (d < h.r && (!best || d < best.d)) best = { d, h };
  }

  const slotD = hoverSlot ? hoverSlot.dist : Infinity;
  if (hoverSlot && slotD <= (best ? best.d : Infinity) &&
      (layer === LAYER.WEEK || layer === LAYER.DAY)) {
    touch();
    if (layer === LAYER.WEEK && hoverSlot.existing) diveIntoDay(hoverSlot.dateMs);
    else openComposer(hoverSlot, hoverSlot.existing || null);
    return;
  }

  if (best) {
    touch();
    best.h.action();
    return;
  }

  /*
    The chosen step upward: click the open space inside the
    ring. Engraved targets take you down into their unit; the
    void takes you back up to the containing one.
  */
  if (layerAnim) return;
  const zone = stepZone(x, y);
  if (zone === "in") {
    touch();
    diveDefault();
  } else if (zone === "out") {
    touch();
    zoomOutLayer();
  }
}

// The most recent frame's view geometry, for click routing
let lastView = { cx: 0, cy: 0, R: 1, tilt: 0.24 };

/*
  Cursor space decides which way open space steps. Inside the ring, held
  within the curves, is the way in: click there and you drop into the unit at
  the front. Outside the ring and below the crown is the way back out. The
  innermost and outermost magnifications have no move in that direction, so
  those zones go quiet.
*/
function stepZone(x, y) {
  const er = Math.hypot(
    x - lastView.cx,
    (y - lastView.cy) / Math.max(0.05, lastView.tilt)
  );
  if (er < lastView.R * 0.62) {
    return layer === LAYER.DAY ? null : "in";
  }
  if (er > lastView.R * 1.05 && y > lastView.cy) {
    return layer === LAYER.YEAR ? null : "out";
  }
  return null;
}

/* =========================
   CROWN RENDERERS
   One form, three dressings. Text scale rules carry over from
   the verified week crown: the 4.5px/zoom hour font is the
   intersection-tested maximum for 224 slots; sparser layers
   scale up with their slot spacing but stay conservative.
========================= */

/*
  The wave line, rendered for smoothness and depth.

  Smoothness: the height is computed analytically per sample
  (no lookup-table quantisation), sample density follows the
  radius so close inspection stays liquid, and the polyline is
  drawn as midpoint quadratics so no facet ever shows.

  Depth: the line is drawn in short arcs, each graded by how
  near it is to the camera - the near side runs bright, crisp
  and slightly heavier; the far side falls away dimmer, with a
  wider, softer halo. A faint halo pass under the whole line
  gives it a little air. Reads as depth of field without the
  cost of true blur.
*/
function drawWaveLine(crests, R, A, rot, tilt, cx, cy, width, alpha, power = 1.5) {
  const n = Math.round(clamp(1200, 4200, R * 1.1));
  const pts = new Array(n + 1);

  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const angle = -t * 2 * Math.PI + rot;
    const h = Math.pow(Math.abs(Math.sin(crests * Math.PI * t)), power);
    const yBase = cy + R * Math.sin(angle) * tilt;

    pts[i] = {
      x: cx + R * Math.cos(angle),
      y: yBase - A * h,
      d: (Math.sin(angle) + 1) / 2   // 1 = nearest the camera
    };
  }

  const per = Math.max(10, Math.floor(n / 72));
  ctx.strokeStyle = "#fff";

  /* Butt ends, not round. The line is stroked in seventy two short segments
     so each can fade with its distance from the camera - but a round cap
     leaves a half-disc at both ends of every segment, and adjacent segments
     stack theirs on top of one another. Seventy two overlapping caps is
     seventy two small beads down the line, which is what has been showing
     as blobs. The segments share their end points, so cutting the caps off
     leaves no gap between them. */
  ctx.lineCap = "butt";
  ctx.lineJoin = "round";

  /* The line is white. It was briefly tinted by the music when the crown
     settled - an attempt to reproduce deliberately what the mist was already
     doing to it by accident - but colouring the stroke itself is not the same
     effect at all: it left the line looking marked rather than lit. The
     colour belongs under the curve; the line stays as it was drawn. */

  /* One unbroken path per pass, not seventy two short ones.

     Segmenting it was how the depth fade was done - each little stretch
     stroked at its own alpha - but every join then got painted twice, and two
     coats of a semi-transparent white make a bright bead. Seventy two joins,
     seventy two beads down the line. That is what has been showing.

     Instead the fade is carried by clipping: the ring is drawn in a handful
     of depth bands, each a wedge of the frame, and within a band the line is
     one continuous stroke at one alpha. The bands abut rather than overlap,
     so nothing is ever painted on top of itself. */
  /* One stroke. No segments, no bands, no clipping - the line is drawn once
     per pass, end to end, and nothing is ever painted on top of itself.

     Depth used to be done by cutting the line into pieces and fading each,
     which is what put beads all down it: every join, and later every clip
     seam, was painted twice, and two coats of a semi-transparent white make
     a bright spot. A gradient does the same job with no seams at all. It is
     a horizontal ramp, which is not quite the true depth of a tilted ring,
     but the difference is a few percent of brightness and no one can see it -
     whereas the beads were plainly visible. */
  const grad = ctx.createLinearGradient(cx - R, 0, cx + R, 0);
  for (let k = 0; k <= 8; k++) {
    const u = k / 8;
    // across the frame the line runs from the far side, through the near, and
    // back - so brightness peaks in the middle of each half
    const d = 0.5 - 0.5 * Math.cos(u * TAU);
    const focus = 0.3 + 0.7 * d;
    grad.addColorStop(u, `rgba(255,255,255,${focus.toFixed(3)})`);
  }

  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < n; i++) {
      const mx = (pts[i].x + pts[i + 1].x) / 2;
      const my = (pts[i].y + pts[i + 1].y) / 2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    ctx.lineTo(pts[n].x, pts[n].y);

    if (pass === 0) {
      /* The glow: a wide soft white pass beneath the line, so the form reads
         as lit rather than drawn. */
      ctx.globalAlpha = alpha * 0.22;
      ctx.lineWidth = width * 4.4;
    } else {
      ctx.globalAlpha = alpha;
      ctx.lineWidth = width;
    }
    ctx.strokeStyle = grad;
    ctx.stroke();
  }

  ctx.strokeStyle = "#fff";

  ctx.globalAlpha = alpha;
}

/*
  Spokes with the same depth grading, binned so the batching
  survives: five alpha bands instead of one flat grey.
*/
function drawSpokesDepth(segs, width, alphaBase, rest = 0) {
  const B = 5;
  ctx.strokeStyle = "#6a6f75";
  ctx.lineWidth = width;

  /* The stems run the whole way up to the curve, as they were built to. They
     were briefly held short of it while I was hunting a row of small marks
     along the line - which turned out to be the line's own doing, not theirs,
     so there is nothing for the gap to solve. */

  for (let b = 0; b < B; b++) {
    ctx.beginPath();
    let any = false;

    for (const s of segs) {
      if (Math.min(B - 1, Math.floor(s.dn * B)) !== b) continue;
      // y1 is the top, at the curve; y2 the foot, on the base plane
      ctx.moveTo(s.x1, s.y1);
      ctx.lineTo(s.x2, s.y2);
      any = true;
    }
    if (!any) continue;

    const mid = (b + 0.5) / B;

    // Cascading rest fade: each depth band lets go at a slightly different
    // point as the crown comes to rest, so the stems peel away front to back
    // rather than all dimming together, and the whole set is clear by the
    // time rest completes.
    const trigger = (B - 1 - b) / B * 0.55;
    const restVis = 1 - smooth(clamp(0, 1, (rest - trigger) / (1 - trigger)));

    ctx.globalAlpha = alphaBase * (0.25 + 0.75 * mid) * restVis;
    ctx.stroke();
  }

  ctx.globalAlpha = alphaBase;
}

/*
  The time owns its space. Each crown declares where its now
  marker sits; any engraved label falling inside that spot
  yields, fading so the time always floats clear. The
  principle: the current time leads at every magnification.
*/
let nowSpot = null; // { x, y, r } - set per crown, per frame

function nowYield(x, y) {
  if (!nowSpot) return 1;
  const d = Math.hypot(x - nowSpot.x, y - nowSpot.y);
  return clamp(0, 1, (d - nowSpot.r * 0.5) / (nowSpot.r * 0.65));
}

/*
  The spotlight. The current time is the one lit thing in this
  world: a soft pool of the daylight colour under the now
  marker at every magnification.
*/
function drawSpotlight(x, y, radius, color, alpha) {
  if (alpha <= 0.01) return;

  /* Eased rather than linear, for the same reason the daylight pools are:
     a two stop gradient draws the circle it was made from, and against a lit
     space that circle is plainly visible around the time. */
  const rgb = color.startsWith("rgb")
    ? color.slice(color.indexOf("(") + 1, color.lastIndexOf(")"))
    : "255,255,255";
  const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
  for (let i = 0; i <= 9; i++) {
    const t = i / 9;
    const e = t * t * t * (t * (t * 6 - 15) + 10);
    g.addColorStop(t, `rgba(${rgb},${(1 - e).toFixed(4)})`);
  }

  const keep = ctx.globalAlpha;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, TAU);
  ctx.fill();
  ctx.globalAlpha = keep;
}


/*
  A tinted panel between the wave and the base across a span of the ring.

  A half hour is about a three hundredth of the circumference, which at a
  framed view is four or five pixels - a sliver you would never notice. So a
  panel is never drawn narrower than it needs to be to be seen: it opens out
  symmetrically about its own centre until it is worth looking at, and once
  the crown is magnified enough its true span takes over again.
*/
function bandFloor(R, t0, t1) {
  /* Two limits, pulling against each other.

     A floor in pixels, because a half hour is a three hundredth of the ring
     and would otherwise vanish - the tilt squashes it to as little as a third
     again on screen where the ellipse turns, so it aims generously.

     And a ceiling as a fraction of the ring, because a floor measured only in
     pixels keeps its size while the crown shrinks: zoom out and the panel
     would swell to take an ever larger bite of an ever smaller ring. Beyond
     about a hundredth of the way round it stops growing and simply shrinks
     with everything else. */
  const wantPx = 30;
  const pixelFloor = wantPx / Math.max(1, TAU * R);
  const ringCeiling = 1 / 110;

  const span = Math.abs(t1 - t0);
  const want = Math.min(Math.max(span, pixelFloor), Math.max(span, ringCeiling));
  if (want <= span) return [t0, t1];

  const mid = (t0 + t1) / 2;
  return [mid - want / 2, mid + want / 2];
}

function fillBand(WH, R, A, rot, tilt, cx, cy, t0, t1, color, alpha, rise) {
  if (alpha <= 0.003) return;

  /* A hover panel or a tagged moment is a marker and gets a floor on its
     size, or a half hour would be a hair. An equaliser bar is given a rise -
     the fraction of the curve it reaches - and takes the cell exactly as it
     is, because it is one of a continuous row and any padding would show as
     a gap between neighbours. */
  const bar = typeof rise === "number";
  if (!bar) [t0, t1] = bandFloor(R, t0, t1);

  /* The panel fills between the wave and the base - which in a trough is a
     gap barely a pixel tall, and most of the ring is trough. So it has a
     floor on its height as well as its width: it rises from the base to the
     curve, or to a readable height, whichever is the greater. */
  const minH = bar
    ? 0
    : Math.min(A * 0.34, Math.max(9, 13 * (R / CONFIG.baseRadius)));
  const STEPS = 14;

  const top = i => {
    const p = pointAtT(t0 + (t1 - t0) * i / STEPS, WH, R, A, rot, tilt, cx, cy);
    const h = Math.max(0, p.yBase - p.y);
    const y = bar ? p.yBase - h * rise : Math.min(p.y, p.yBase - minH);
    return { x: p.x, y, yBase: p.yBase };
  };

  ctx.beginPath();
  for (let i = 0; i <= STEPS; i++) {
    const p = top(i);
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  for (let i = STEPS; i >= 0; i--) {
    const p = top(i);
    ctx.lineTo(p.x, p.yBase);
  }
  ctx.closePath();

  const keep = ctx.globalAlpha;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.fill();
  ctx.globalAlpha = keep;
}

/*
  Hour categories for the week crown's hover shading. The tint
  itself is the daylight of that hour; the category sets how
  much presence it holds: sleep (23:00-07:00), working hours
  (09:00-18:00 on weekdays), free time everything else.
*/
// What the info strip calls each hour category
function hourCategoryName(dayIdx, hour) {
  if (hour >= 23 || hour < 7) return "Sleep";
  if (dayIdx < 5 && hour >= 9 && hour < 18) return "Working hours";
  return "Free time";
}

function hourCategoryAlpha(dayIdx, hour) {
  if (hour >= 23 || hour < 7) return 0.22;            // sleep
  if (dayIdx < 5 && hour >= 9 && hour < 18) return 0.28; // work
  return 0.14;                                         // free
}

/*
  Day categories for the month crown's hover shading. These are
  not daylight colours - they name the kind of day. Edit the
  holiday list to taste (ISO dates).
*/
const BANK_HOLIDAYS = new Set([
  "2026-01-01", "2026-04-03", "2026-04-05", "2026-04-06",
  "2026-04-27", "2026-05-05", "2026-05-14", "2026-05-24",
  "2026-05-25", "2026-12-25", "2026-12-26"
]);

function isHoliday(dateMs) {
  return BANK_HOLIDAYS.has(new Date(dateMs).toISOString().slice(0, 10));
}

function dayCategoryName(dateMs, dayIdx) {
  if (isHoliday(dateMs)) return "Bank holiday";
  if (dayIdx >= 5) return "Weekend";
  return "Workday";
}

function dayCategory(dateMs, dayIdx) {
  if (isHoliday(dateMs)) return { color: "#f4845f", alpha: 0.24 }; // holiday
  if (dayIdx >= 5)       return { color: "#ffd166", alpha: 0.20 }; // weekend
  return { color: "#7d95c9", alpha: 0.14 };                        // workday
}

/* --- WEEK crown: the original, exactly as accepted --- */

function drawWeekCrown(k, cx, cy, effZoom, alphaMain, alphaDetail, rot, collectHits) {
  const WH = waveHeights(7);
  const R = CONFIG.baseRadius * effZoom;
  const A = CONFIG.baseAmplitude * effZoom;
  const tilt = camera.tilt;
  const sceneScale = clamp(0.12, 3.0, effZoom);

  // The time's reserved space on this crown - engraving yields
  nowSpot = null;
  const showsNow =
    k === 0 && crownK(timeState.dayIdx, 7, rot - camera.yaw, camera.yaw) === 0;
  if (showsNow) {
    const pN = pointAtT(timeState.t, WH, R, A, rot, tilt, cx, cy);
    nowSpot = { x: pN.x, y: pN.y - 11 * effZoom * 1.4, r: 52 * effZoom };
  }

  drawWaveLine(7, R, A, rot, tilt, cx, cy, 1.6 * sceneScale, alphaMain);
  ctx.globalAlpha = alphaMain;

  /* Week date label top right; month name larger when a new
     month begins in this week */

  const labelX = cx + R;
  const labelY = cy - R * tilt - A - 30 * effZoom;

  ctx.globalAlpha = alphaMain * infoAmt;

  /* The week the crown is actually showing, taken from the day sitting at the
     front - so the label names the week those dates belong to rather than an
     approximation from the spin. */
  const frontDayMs = timeState.dateMs + k * 7 * DAY_MS +
    Math.round((camera.yaw / TAU) * 7) * DAY_MS;
  const shownK = weekOffsetOfDate(frontDayMs);

  const monthName = monthStartingInWeek(shownK);
  if (monthName) {
    ctx.font = `${30 * effZoom}px Helvetica, Arial`;
    ctx.fillStyle = "#fff";
    ctx.textAlign = "right";
    ctx.fillText(monthName, labelX, labelY - 16 * effZoom);
  }

  ctx.font = `${12 * effZoom}px Helvetica, Arial`;
  ctx.fillStyle = "#b9b9b9";
  ctx.textAlign = "right";
  ctx.fillText(weekLabel(shownK), labelX, labelY);

  ctx.globalAlpha = alphaMain;

  if (alphaDetail > 0) {
    ctx.globalAlpha = alphaMain * alphaDetail;

    /* One date function for the whole crown. The labels, the hover, the tags
       and the hit targets all read from this, so they can never disagree
       about which day a cup is showing.

       The reference is today's own crest, not where now happens to sit along
       the curve. A day's hours run forward from its crest - midnight at the
       crest, the evening most of the way to the next one - so by late in the
       day now is nearer the following crest than its own. Centring on now
       would shift every label a slot forward and put a tag in the next day's
       hours; centring on the crest keeps the labels locked to the hour
       geometry they sit above. */
    const yawTurnsW = camera.yaw / TAU;
    const tNowCurve = (timeState.dayIdx + 0.5) / 7;
    const cupDate = cup => {
      let gap = (cup + 0.5) / 7 - tNowCurve - yawTurnsW;
      gap -= Math.round(gap);
      return timeState.dateMs + k * 7 * DAY_MS +
        Math.round(yawTurnsW * 7 + gap * 7) * DAY_MS;
    };


    // The span of one half-hour chunk, as a pair of ring positions.
    const halfSpan = (day, hour, half) => {
      const t0 = hourT(day, hour);
      const t1 = hour === 23 ? (day + 1.5) / 7 : hourT(day, hour + 1);
      const tMid = (t0 + t1) / 2;
      return half ? [tMid, t1] : [t0, tMid];
    };

    /* Hour spokes, depth-graded */

    const spokes = [];
    const segs = [];
    const slots = [];          // every half-hour chunk, for hover and tagging
    const dnOf = p => clamp(0, 1, ((p.yBase - cy) / (R * tilt) + 1) / 2);

    for (let day = 0; day < 7; day++) {
      for (let hour = 0; hour < 24; hour++) {
        const p = pointAtT(hourT(day, hour), WH, R, A, rot, tilt, cx, cy);
        const dn = dnOf(p);
        segs.push({ x1: p.x, y1: p.y, x2: p.x, y2: p.yBase, dn });
        spokes.push({ day, hour, p, dn });

        /* Both halves of every hour are their own target, each measured at
           its own midpoint - so the second half is exactly as selectable as
           the first rather than losing out to the next hour's spoke. */
        for (let half = 0; half < 2; half++) {
          const [a, b] = halfSpan(day, hour, half);
