  return ((280.46061837 + 360.98564736629 * d) % 360 + 360) % 360;
}

/*
  The sun's position, good to about a minute of arc - far beyond what a few
  hundred pixels can show. Returns right ascension and declination in degrees.
*/
function sunPosition(ms) {
  const d = daysSinceJ2000(ms);
  const g = (357.529 + 0.98560028 * d) * RAD;         // mean anomaly
  const q = 280.459 + 0.98564736 * d;                 // mean longitude
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * RAD;
  const e = (23.439 - 0.00000036 * d) * RAD;          // obliquity

  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)) / RAD;
  const dec = Math.asin(Math.sin(e) * Math.sin(L)) / RAD;
  return { ra: (ra + 360) % 360, dec };
}

/*
  The moon: position and phase. A short series - enough for where it sits in
  the sky and how lit it is, which is all the form asks of it.
*/
function moonPosition(ms) {
  const d = daysSinceJ2000(ms);

  const L = (218.316 + 13.176396 * d) * RAD;   // mean longitude
  const M = (134.963 + 13.064993 * d) * RAD;   // mean anomaly
  const F = (93.272 + 13.229350 * d) * RAD;    // argument of latitude

  const lon = L + 6.289 * RAD * Math.sin(M);
  const lat = 5.128 * RAD * Math.sin(F);
  const e = 23.439 * RAD;

  const ra = Math.atan2(
    Math.sin(lon) * Math.cos(e) - Math.tan(lat) * Math.sin(e),
    Math.cos(lon)
  ) / RAD;
  const dec = Math.asin(
    Math.sin(lat) * Math.cos(e) + Math.cos(lat) * Math.sin(e) * Math.sin(lon)
  ) / RAD;

  // Phase from the elongation between moon and sun.
  const sun = sunPosition(ms);
  const sunLon = (280.459 + 0.98564736 * d) * RAD;
  let elong = lon - sunLon;
  elong = Math.atan2(Math.sin(elong), Math.cos(elong));
  const illum = (1 - Math.cos(elong)) / 2;       // 0 new, 1 full
  const waxing = Math.sin(elong) > 0;

  return { ra: (ra + 360) % 360, dec, illum, waxing };
}

/*
  Turn a position on the sky into where it sits from here: altitude above the
  horizon and azimuth round from north. This is the only place the observer's
  own latitude and longitude come into it.
*/
function toAltAz(ra, dec, ms, lat, lon) {
  const H = (gmst(ms) + lon - ra) * RAD;
  const dr = dec * RAD, lr = lat * RAD;

  const sinAlt = Math.sin(dr) * Math.sin(lr) +
                 Math.cos(dr) * Math.cos(lr) * Math.cos(H);
  const alt = Math.asin(clamp(-1, 1, sinAlt)) / RAD;

  const az = Math.atan2(
    -Math.sin(H) * Math.cos(dr),
    Math.cos(lr) * Math.sin(dr) - Math.sin(lr) * Math.cos(dr) * Math.cos(H)
  ) / RAD;

  return { alt, az: (az + 360) % 360 };
}

function skyDarkness(ms) {
  const s = sunPosition(ms);
  const { alt } = toAltAz(s.ra, s.dec, ms, SKY.lat, SKY.lon);
  return clamp(0, 1, (-alt - 2) / 14);     // twilight fades over ~14 degrees

/*
  Where we are, for the sky. The sun, the moon and the stars are all computed
  from a latitude and longitude, so the piece asks the browser once. Declining
  costs nothing much: it falls back to Amsterdam and the sky is simply
  somebody else's.
*/
function locate() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    p => {
      SKY.lat = p.coords.latitude;
      SKY.lon = p.coords.longitude;
      SKY.located = true;
      LIGHTBUF.key = "";
    },
    () => {},
    { timeout: 8000, maximumAge: 3600000 }
  );
}

/* =========================
   SKY RENDERING
   Both of these sit in the crown's own space rather than on top of it: the
   same tilted projection, so they turn with the camera and belong to the
   form instead of floating over it as an overlay.
========================= */

/*
  A point inside the ring: r out from the centre, a round it, h above the
  base plane. Returns screen position and how near the camera it is, so the
  far side of a body can be drawn behind the near side.
*/
function crownPoint(r, a, h, R, tilt, cx, cy) {
  return {
    x: cx + r * Math.cos(a),
    y: cy + r * Math.sin(a) * tilt - h,
    near: (Math.sin(a) + 1) / 2
  };
}




/*
  The light in the room. Everything above is where things are; this is what
  they do to the space. The sun and moon are drawn where they actually sit,
  and the whole frame takes its colour from how far the sun is above or below
  the horizon - so dawn arrives from the direction it really arrives from,
  and a day no longer looks like a night with the stars turned off.
*/

/*
  The sunlight in the space. Not a lamp you can look at - there is no disc -
  but light arriving from a direction, sweeping round the ring through the
  day the way it crosses a room: in low from the east at dawn, high and
  short at noon, long from the west by evening. A sundial rather than a sun.

  The colour is the same daylight palette the current time and the hover
  panels use, so the light and the markers always agree about what hour it
  is. Strength follows the sun's height, and nothing is painted once it is
  properly down - the black the whole piece is built on stays black at night.
*/

/*
  A pool of light with no edge to it. A two stop gradient always shows the
  circle it was made from - the falloff is linear and the eye finds the rim.
  Stepping through a smootherstep instead means the light thins away without
  ever drawing a line, which is what makes it read as light rather than as a
  shape that happens to be bright.
*/
function softPool(g, x, y, r, rgb, peak) {
  const grad = g.createRadialGradient(x, y, 0, x, y, r);
  for (let i = 0; i <= 9; i++) {
    const t = i / 9;
    const e = t * t * t * (t * (t * 6 - 15) + 10);   // smootherstep
    grad.addColorStop(t, `rgba(${rgb},${(peak * (1 - e)).toFixed(4)})`);
  }
  return grad;
}

const LIGHTBUF = { cv: null, g: null, w: 0, h: 0, key: "" };

/*
  The light is the one thing here that touches every pixel of the frame, so
  it is also the first thing to give up if the machine cannot keep up. Frame
  time is watched, and if it stays poor the light drops to a coarser buffer
  and then stops being drawn at all - the crown, which is the point, keeps
  its speed. It comes back on its own once there is room for it again.
*/
let frameMs = 16.7;
let lightQuality = 1;          // 1 full, 0.5 coarse, 0 off
let qualityCheckedAt = 0;

function watchFrameCost(nowMs, dtMs) {
  frameMs += (Math.min(200, dtMs) - frameMs) * 0.06;
  if (nowMs - qualityCheckedAt < 1500) return;
  qualityCheckedAt = nowMs;

  if (frameMs > 34 && lightQuality > 0) {
    lightQuality = lightQuality > 0.5 ? 0.5 : 0;
    LIGHTBUF.key = "";
  } else if (frameMs < 19 && lightQuality < 1) {
    lightQuality = lightQuality < 0.5 ? 0.5 : 1;
    LIGHTBUF.key = "";
  }
}

/*
  The light is broad and soft, so it costs nothing to draw it small and blow
  it up. It is painted into a buffer a third of the size and only repainted
  when the minute, the rotation or the frame actually change - which turns
  three full screen gradients every frame into one cheap copy.
*/

/*
  Shadows. A shadow is not something drawn on top of a scene, it is light that
  did not arrive - so these are cut out of the light itself, which is why they
  are only ever as dark as the light was bright. At noon they are short stubs
  under the curve; at dawn and dusk they stretch away across the plane, and
  they swing round through the day with the light that casts them.

  Both the wave and the stems throw them. The stems only when they are out -
  once the crown settles and they retract, their shadows go with them.
*/
function carveShadows(g, ms, R, A, tilt, cx, cy, rot, crests, fade) {
  const sun = sunPosition(ms);
  const sa = toAltAz(sun.ra, sun.dec, ms, SKY.lat, SKY.lon);
  if (sa.alt < 1.5) return;                     // nothing to cast by

  const heading = (rot / TAU) * 360;
  const fromA = (sa.az - heading) * RAD;
  // away from the light
  const dx = -Math.sin(fromA), dy = Math.cos(fromA);

  // How far a thing of height h throws. Kept in hand at low sun, or a shadow
  // at first light would run to the horizon.
  const stretch = Math.min(3.2, 1 / Math.tan(Math.max(6, sa.alt) * RAD));

  const strength = clamp(0, 1, (sa.alt - 1.5) / 22) * fade;
  if (strength <= 0.02) return;

  // Enough points to describe the form it is casting from: a week has seven
  // crests, a year by weeks has fifty three, and a shadow drawn too coarsely
  // for its curve turns into a zigzag.
  const N = Math.max(96, crests * 9);
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const ang = -t * TAU + rot;
    const h = A * Math.pow(Math.abs(Math.sin(crests * Math.PI * t)), 1.5);
    const u = R * Math.cos(ang), v = R * Math.sin(ang);
    const off = h * stretch;
    pts.push({
      bx: cx + u,
      by: cy + v * tilt,
      sx: cx + u + dx * off,
      sy: cy + (v + dy * off) * tilt,
      h
    });
  }

  g.save();
  g.globalCompositeOperation = "destination-out";

  /* The crown is a line, so its shadow is a line - a second curve lying on
     the plane, swinging round with the sun. Drawn twice: a wide soft pass for
     the penumbra and a tighter one inside it for the core, so the edge gives
     way rather than stopping.

     Nothing else casts. The stems are grain on the form rather than objects
     standing on the plane, and a shadow from each of them turned the ground
     into hatching; the filled version treated the crown as a solid wall,
     which is not what you are looking at. */
  const line = (width, alpha) => {
    g.strokeStyle = `rgba(0,0,0,${alpha.toFixed(3)})`;
    g.lineWidth = width;
    g.lineJoin = "round";
    g.lineCap = "round";
    g.beginPath();
    g.moveTo(pts[0].sx, pts[0].sy);
    for (let i = 1; i < pts.length - 1; i++) {
      const p = pts[i], q = pts[i + 1];
      g.quadraticCurveTo(p.sx, p.sy, (p.sx + q.sx) / 2, (p.sy + q.sy) / 2);
    }
    g.stroke();
  };

  // A low sun throws it wide and soft, a high one tight and dark.
  const soft = clamp(0, 1, 1 - sa.alt / 60);
  line(10 + 14 * soft, 0.26 * strength);
  line(3 + 3 * soft, 0.52 * strength);

  g.restore();
}

function lightBuffer(ms, R, A, tilt, cx, cy, rot, amt, crests, castScale, castFade) {
  const S = lightQuality >= 1 ? 0.34 : 0.18;
  const w = Math.max(2, Math.round(viewW * S));
  const h = Math.max(2, Math.round(viewH * S));
  /* The fade is applied when the buffer is blitted, not painted into it, so
     a continuously easing value can never keep missing the cache. What is
     left changes only by the minute, or when the crown is actually moved. */
  const key = [
    Math.round(ms / 60000), Math.round(rot * 10), w, h,
    Math.round(R), Math.round(tilt * 40), Math.round(amt * 10),
    crests, Math.round(A),
    Math.round(castScale * 24), Math.round(castFade * 12)
  ].join(",");

  if (LIGHTBUF.key === key && LIGHTBUF.cv) return LIGHTBUF.cv;

  if (!LIGHTBUF.cv || LIGHTBUF.w !== w || LIGHTBUF.h !== h) {
    LIGHTBUF.cv = document.createElement("canvas");
    LIGHTBUF.cv.width = w; LIGHTBUF.cv.height = h;
    LIGHTBUF.g = LIGHTBUF.cv.getContext("2d");
    LIGHTBUF.w = w; LIGHTBUF.h = h;
  }

  const g = LIGHTBUF.g;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, w, h);
  g.setTransform(S, 0, 0, S, 0, 0);

  paintSunLight(g, ms, R, tilt, cx, cy, rot, amt);
  paintMoonLight(g, ms, R, tilt, cx, cy, rot, amt);
  /* The shadow belongs to the crown, not to the room - so through a change of
     magnification it takes the incoming crown's own size and fades up with
     it. Drawn at full size against a curve still on its way in, the shade
     arrived before the thing casting it. */
  carveShadows(g, ms, R * castScale, A * castScale,
               tilt, cx, cy, rot, crests, castFade);

  g.setTransform(1, 0, 0, 1, 0, 0);
  LIGHTBUF.key = key;
  return LIGHTBUF.cv;
}

function drawSkyLight(ms, R, A, tilt, cx, cy, rot, amt, crests,
                     castScale, castFade) {
  if (!SKY.lightOn || amt <= 0.01 || lightQuality <= 0) return;
  const buf = lightBuffer(ms, R, A, tilt, cx, cy, rot, amt, crests,
                          castScale, castFade);
  if (!buf) return;
  // Blitted at full opacity: the fade is already in the buffer, and an alpha
  // multiply on a full frame image costs more than the occasional repaint.
  ctx.drawImage(buf, 0, 0, viewW, viewH);
}

function paintSunLight(ctx, ms, R, tilt, cx, cy, rot, amt) {

  const sun = sunPosition(ms);
  const sa = toAltAz(sun.ra, sun.dec, ms, SKY.lat, SKY.lon);

  // Below about eight degrees down there is no light left to speak of.
  const day = clamp(0, 1, (sa.alt + 8) / 14);
  if (day <= 0.005) return;

  const d = new Date(ms);
  const hourFloat = d.getUTCHours() + d.getUTCMinutes() / 60;
  const col = daylightColor(hourFloat);
  let rgb = col.slice(4, -1).split(",").map(Number);

  // The hour gives the colour. Nothing dims or greys it any more - the piece
  // no longer asks what the weather is doing.
  const dim = 1;

  /* Where the light comes from, on the crown's own plane. The bearing is
     taken against the same heading the stars use, so turning
     the crown turns the light with the rest of the world. Altitude lifts the
     source: raking across the plane when the sun is low, hanging above it
     when the sun is high. */
  const heading = (rot / TAU) * 360;
  const fromA = (sa.az - heading) * RAD;
  const lx = Math.sin(fromA), ly = -Math.cos(fromA);

  const reach = R * 1.75;
  const lift = clamp(0, 1, sa.alt / 70);
  const srcX = cx + lx * reach;
  const srcY = cy + ly * reach * tilt - lift * R * 1.25;

  ctx.save();

  /* The ambient: what the light does to the whole space regardless of where
     it is coming from. Thin, and thinner still at the top of the frame, so
     the space reads as lit rather than as painted over. */
  {
    const k = amt * day * 0.30 * dim;
    const g = ctx.createLinearGradient(0, 0, 0, viewH);
    g.addColorStop(0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${(k * 0.16).toFixed(3)})`);
    g.addColorStop(0.55, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${(k * 0.34).toFixed(3)})`);
    g.addColorStop(1, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${(k * 0.10).toFixed(3)})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, viewW, viewH);
  }

  /* The directional part: a broad pool centred where the light is coming
     from, so one side of the space is lit and the other falls away. A low
     sun throws it hard across; a high sun spreads it out and flattens it. */
  {
    const low = 1 - lift;                      // how raking the light is
    const rad = R * (2.0 + 1.4 * lift);
    // Under cloud there is no direction left in the light at all.
    const k = amt * day * (0.30 + 0.34 * low) * dim;
    ctx.fillStyle = softPool(ctx, srcX, srcY, rad, rgb.join(","), k);
    ctx.fillRect(0, 0, viewW, viewH);
  }

  /* And the light lying on the plane the ring sits in. This one is centred on
     the crown rather than thrown toward the sun: ground under a low sun is
     lit fairly evenly, and what makes the hour readable is the shadows lying
     across it, not a bright patch on one side. Offsetting it left the far
     side dark and gave the shade nothing to bite into. */
  {
    const px = cx + lx * R * 0.2;
    const py = cy + ly * R * 0.2 * tilt;
    const k = amt * day * 0.34 * (0.45 + 0.55 * (1 - lift)) * dim;
    ctx.fillStyle = softPool(ctx, px, py, R * 2.1, rgb.join(","), k);
    ctx.fillRect(0, 0, viewW, viewH);
  }

  ctx.restore();
}

/*
  Moonlight: the same idea, far quieter, and only once the sun is out of the
  way. Cool where the sun is warm, and scaled by how much of the moon is lit.
*/
function paintMoonLight(ctx, ms, R, tilt, cx, cy, rot, amt) {
  if (amt <= 0.01) return;

  const sun = sunPosition(ms);
  const sa = toAltAz(sun.ra, sun.dec, ms, SKY.lat, SKY.lon);
  if (sa.alt > -4) return;

  const mo = moonPosition(ms);
  const ma = toAltAz(mo.ra, mo.dec, ms, SKY.lat, SKY.lon);
  if (ma.alt < 0) return;

  const heading = (rot / TAU) * 360;
  const fromA = (ma.az - heading) * RAD;
  const lx = Math.sin(fromA), ly = -Math.cos(fromA);
  const lift = clamp(0, 1, ma.alt / 70);

  const srcX = cx + lx * R * 1.6;
  const srcY = cy + ly * R * 1.6 * tilt - lift * R * 1.1;

  const k = amt * 0.17 * mo.illum *
    clamp(0, 1, -(sa.alt + 4) / 8) * clamp(0.2, 1, ma.alt / 30);
  if (k <= 0.004) return;

  ctx.save();
  ctx.fillStyle = softPool(ctx, srcX, srcY, R * 2.8, "168,190,236", k);
  ctx.fillRect(0, 0, viewW, viewH);
  ctx.restore();
}

/*
  The sky overhead at a given moment, above the crown. Azimuth spans across
  the frame and altitude climbs from the crown's far edge, so turning the
  crown pans the sky the way turning your head would. Stars fade with the
  sun: nothing is visible in daylight, everything by full dark.
*/
function drawSky(ms, R, tilt, cx, cy, rot, amt) {
  if (!SKY.starsOn || amt <= 0.01) return;
  const dark = skyDarkness(ms);
  const show = amt * dark;
  if (show <= 0.01) return;

  const horizon = cy - R * tilt - CONFIG.baseAmplitude * cameraZoom() - 26;
  const domeH = Math.max(60, horizon - 30);
  const heading = (rot / TAU) * 360;

  ctx.save();

  for (const st of STARS) {
    const { alt, az } = toAltAz(st[0], st[1], ms, SKY.lat, SKY.lon);
    if (alt <= 1) continue;                        // below the horizon

    let azRel = ((az - heading + 540) % 360) - 180;
    if (Math.abs(azRel) > 105) continue;           // outside the view

    const x = cx + (azRel / 95) * R;
    const y = horizon - (alt / 90) * domeH;

    // brighter stars are bigger and hold on longer through twilight
    const mag = st[2];
    const bright = clamp(0, 1, (2.6 - mag) / 3.4);
    // Present rather than hinted at: the faintest still read, the brightest
    // carry properly, and none of it depends on where the cursor is.
    const a = show * (0.55 + 0.45 * bright);
    if (a <= 0.02) continue;

    const rad = (1.0 + 2.4 * bright) * Math.min(2.4, cameraZoom());
    ctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, TAU);
    ctx.fill();

    // the few worth naming, once they are properly out
    if (mag < 1.4 && show > 0.4) {
      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = "#b9b9b9";
      ctx.font = `${9 * Math.min(1.6, cameraZoom())}px Helvetica, Arial`;
      ctx.textAlign = "left";
      ctx.fillText(st[3], x + rad + 4, y + 3);
      ctx.globalAlpha = 1;
    }
  }

  /* The moon itself, where it actually is and lit as much as it actually
     is. The light it casts is handled separately; this is just the body. */
  const mo = moonPosition(ms);
  const maa = toAltAz(mo.ra, mo.dec, ms, SKY.lat, SKY.lon);
  if (maa.alt > 1) {
    let azRel = ((maa.az - heading + 540) % 360) - 180;
    if (Math.abs(azRel) <= 105) {
      const x = cx + (azRel / 95) * R;
      const y = horizon - (maa.alt / 90) * domeH;
      const rad = 7 * Math.min(2.0, cameraZoom());

      ctx.globalAlpha = amt * (0.55 + 0.45 * dark);
      ctx.fillStyle = "rgba(232,236,244,0.40)";
      ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();

      ctx.fillStyle = "rgba(244,247,255,0.92)";
      ctx.beginPath();
      ctx.ellipse(x, y, rad, rad, 0,
        mo.waxing ? -Math.PI / 2 : Math.PI / 2,
        mo.waxing ? Math.PI / 2 : 3 * Math.PI / 2);
      ctx.ellipse(x, y, rad * Math.abs(2 * mo.illum - 1), rad, 0,
        Math.PI / 2, -Math.PI / 2, false);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  ctx.restore();
}

/* =========================
   SOUND
   Everything here is synthesised in the page - no files, no network. The
   whole bus runs through a low pass, so nothing is ever bright or dry: the
   room is meant to feel like deep water, or the inside of something. Levels
   are deliberately low. It stays silent until you touch the page, because
   browsers require a gesture before audio, and it can be switched off.
========================= */

const AUDIO = {
  on: true,
  ctx: null,
  master: null,     // everything lands here
  muffle: null,     // the low pass that makes the whole thing feel submerged
  space: null,      // the dark diffuse room everything is heard in
  spinLP: null,     // keeps the running tape out of the upper mid
  spinGain: null,   // the tape hiss, level follows spin speed
  spinRate: null,   // its playback rate, follows spin direction and speed
  fwd: null, rev: null,   // forward and reversed tape textures
  fwdGain: null, revGain: null,
  heartNext: 0,
  ready: false
};

// A short band of noise shaped into slow flutter - the texture a tape makes
// running past a head. Reversed for the other direction.
function makeTapeBuffer(ctx, reversed) {
  const secs = 2.4;
  const n = Math.floor(ctx.sampleRate * secs);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const ch = buf.getChannelData(0);

  let last = 0;
  for (let i = 0; i < n; i++) {
    const white = Math.random() * 2 - 1;
    /* A very slow one pole, so the texture is born in the low mid rather
       than being hiss that has to be filtered afterwards. There is almost
       no treble in it to begin with. */
    last = last * 0.945 + white * 0.055;
    const t = i / n;
    // slow flutter, plus a faint wow, so it breathes like tape
    const flutter = 0.72 + 0.28 * Math.sin(t * Math.PI * 2 * 7);
    const wow = 0.9 + 0.1 * Math.sin(t * Math.PI * 2 * 1.3);
    ch[i] = last * flutter * wow;
  }
  if (reversed) ch.reverse();
  return buf;
}

/*
  The engine is built for two different reasons and only one of them is the
  crown's own sounds. The other is reading the music, which needs an analyser
  and therefore a context - so switching SOUND off must not stop the engine
  existing, only stop it making a noise. It used to return here, which meant
  the equaliser silently fell back to plain playback and then blamed the
  station for refusing to be read.
*/
function startAudio(force) {
  if (AUDIO.ready) return;
  if (!AUDIO.on && !force) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  try {
    const ctx = new AC();
    AUDIO.ctx = ctx;

    AUDIO.muffle = ctx.createBiquadFilter();
    AUDIO.muffle.type = "lowpass";
    AUDIO.muffle.frequency.value = 520;   // everything sits under water
    AUDIO.muffle.Q.value = 0.6;

    AUDIO.master = ctx.createGain();
    // Silent if the engine was only brought up to read the music.
    AUDIO.master.gain.value = AUDIO.on ? 0.17 : 0;

    /* The space. Two delays at unrelated lengths, each fed back through the
       other and darkened a little more on every pass, so repeats smear into
       one another instead of ticking. Nothing here is a clean echo - it is
       the sound of a room that is mostly water. */
    AUDIO.space = ctx.createGain();
    AUDIO.space.gain.value = 0.34;

    /* The room had been damped so hard that everything coming back out of it
       was bass and nothing else - which is what arrived a beat after each
       whoosh and read as a pulse. Its return is now cut below two hundred
       hertz, so the space is heard as space rather than as a thump. */
    const spaceCut = ctx.createBiquadFilter();
    spaceCut.type = "highpass";
    spaceCut.frequency.value = 200;
    spaceCut.Q.value = 0.7;
    const spaceCut2 = ctx.createBiquadFilter();
    spaceCut2.type = "highpass";
    spaceCut2.frequency.value = 200;
    spaceCut2.Q.value = 0.7;
    spaceCut.connect(spaceCut2);
    spaceCut2.connect(AUDIO.master);

    const dA = ctx.createDelay(2.0); dA.delayTime.value = 0.34;
    const dB = ctx.createDelay(2.0); dB.delayTime.value = 0.53;
    const dampA = ctx.createBiquadFilter();
    dampA.type = "lowpass"; dampA.frequency.value = 620;
    const dampB = ctx.createBiquadFilter();
    dampB.type = "lowpass"; dampB.frequency.value = 480;
    const fbA = ctx.createGain(); fbA.gain.value = 0.11;
    const fbB = ctx.createGain(); fbB.gain.value = 0.095;

    AUDIO.space.connect(dA);
    AUDIO.space.connect(dB);
    dA.connect(dampA); dampA.connect(fbA); fbA.connect(dB);   // cross fed,
    dB.connect(dampB); dampB.connect(fbB); fbB.connect(dA);   // so it diffuses
    dampA.connect(spaceCut);
    dampB.connect(spaceCut);

    AUDIO.muffle.connect(AUDIO.master);   // dry
    AUDIO.muffle.connect(AUDIO.space);    // and into the room
    AUDIO.master.connect(ctx.destination);

    // --- the spin bus: two tape textures, crossfaded by direction ---
    AUDIO.spinGain = ctx.createGain();
    AUDIO.spinGain.gain.value = 0;

    /* The tape is the one sound that runs continuously, so it gets its own
       filter on top of the room's - anything left in the upper mid would
       sit there the whole time you were turning. */
    AUDIO.spinLP = ctx.createBiquadFilter();
    AUDIO.spinLP.type = "lowpass";
    AUDIO.spinLP.frequency.value = 340;
    AUDIO.spinLP.Q.value = 0.5;

    AUDIO.spinGain.connect(AUDIO.spinLP);
    AUDIO.spinLP.connect(AUDIO.muffle);

    const mk = (rev) => {
      const src = ctx.createBufferSource();
      src.buffer = makeTapeBuffer(ctx, rev);
      src.loop = true;
      const g = ctx.createGain();
      g.gain.value = 0;
      src.connect(g);
      g.connect(AUDIO.spinGain);
      src.start();
      return { src, g };
    };
    const f = mk(false), r = mk(true);
    AUDIO.fwd = f.src; AUDIO.fwdGain = f.g;
    AUDIO.rev = r.src; AUDIO.revGain = r.g;

    AUDIO.ready = true;
  } catch (e) {
    AUDIO.ready = false;
  }
}

// Browsers suspend the context until a gesture; nudge it awake on any touch.
function wakeAudio(force) {
  if (!AUDIO.on && !force) return;
  if (!AUDIO.ready) startAudio(force);
  if (AUDIO.ctx && AUDIO.ctx.state === "suspended") AUDIO.ctx.resume();
}

/*
  A swept tone under a swell of noise. Diving in falls, stepping out rises -
  the sound of going under and coming back up. Both heavily filtered, so it
  reads as pressure rather than as a note.
*/
function soundStep(down) {
  if (!AUDIO.ready || !AUDIO.on) return;
  const ctx = AUDIO.ctx, t = ctx.currentTime;

  /* A whoosh, not a note. It is noise driven through a resonant low pass
     that sweeps - shutting down as you sink, opening up as you surface -
     so the movement is heard as water passing rather than as a thump. No
     oscillator anywhere in it; a tone at this depth only ever booms. */
  const DUR = 1.6, TAIL = 0.5, ATT = 0.3;

  const nb = ctx.createBufferSource();
  nb.buffer = makeTapeBuffer(ctx, !down);
  nb.playbackRate.setValueAtTime(down ? 0.30 : 0.12, t);
  nb.playbackRate.exponentialRampToValueAtTime(down ? 0.12 : 0.30, t + DUR);

  const sweep = ctx.createBiquadFilter();
  sweep.type = "lowpass";
  /* Resonance is what let you hear the sweep travelling, but a resonant low
     pass landing at fifty five hertz rings there - which is what turned the
     end of the move into a bass thump. Enough Q to follow the movement, not
     enough to sing at the bottom of it. */
  sweep.Q.value = 0.9;
  /* Going in is the mirror of coming out: the same span of the filter, the
     same tape, travelled the other way. The one thing not mirrored is the
     envelope - both answer the click straight away, because a sound that
     swells for a second and a half before it arrives reads as a fault
     rather than as depth. To keep them matched in tone despite both being
     loudest at the start, the descent begins from where the ascent spends
     its own loud moment, so neither is heard any brighter than the other. */
  sweep.frequency.setValueAtTime(down ? 520 : 260, t);
  sweep.frequency.exponentialRampToValueAtTime(down ? 250 : 900, t + DUR);

  /* And the bottom taken out altogether. The move is a whoosh, not a pulse;
     anything below about a hundred hertz here reads as a heartbeat and
     collides with the one on the day crown. */
  const cut = ctx.createBiquadFilter();
  cut.type = "highpass";
  cut.frequency.value = 200;
  cut.Q.value = 0.7;
  const cut2 = ctx.createBiquadFilter();      // twice, so it is a wall
  cut2.type = "highpass";
  cut2.frequency.value = 200;
  cut2.Q.value = 0.7;

  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  // The descent sits lower in the spectrum, where the texture has more
  // energy, so it is trimmed to land at the same level as the ascent.
  g.gain.exponentialRampToValueAtTime(down ? 1.25 : 2.1, t + ATT);
  g.gain.exponentialRampToValueAtTime(0.0001, t + DUR + TAIL);

  nb.connect(sweep); sweep.connect(cut); cut.connect(cut2); cut2.connect(g);
  g.connect(AUDIO.muffle);
  // a heavier send, so the move leaves a wake behind it
  const sg = ctx.createGain();
  sg.gain.value = 0.9;
  g.connect(sg); sg.connect(AUDIO.space);

  nb.start(t); nb.stop(t + DUR + 0.6);
}

/*
  The distant heartbeat on the day crown. Two thumps, the second softer, both
  so far under the filter they are felt more than heard. Quiet enough to sit
  behind everything; it only runs while you are inside a single day.
*/
function soundHeart(strength) {
  if (!AUDIO.ready || !AUDIO.on) return;
  const ctx = AUDIO.ctx, t0 = ctx.currentTime;

  /* Pitched an octave below where a heart would sit, so it is felt rather
     than heard. The shape is unchanged - two thumps, the second softer. */
  const thump = (at, level, freq) => {
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, at);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.6, at + 0.18);

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(level, at + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.3);

    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 80;

    // Straight out, no room on it. A pulse this close should not echo -
    // it is the one thing that belongs to you rather than to the space.
    osc.connect(lp); lp.connect(g);
    g.connect(AUDIO.master);
    osc.start(at); osc.stop(at + 0.34);
  };

  thump(t0, 0.30 * strength, 29);
  thump(t0 + 0.26, 0.19 * strength, 24);
}

/*
  The spin texture, updated every frame. Level follows how fast the crown is
  turning; the two tape directions crossfade on which way it is going, and the
  playback rate rises with speed so it reads as winding rather than as noise.
*/
function soundSpin(vel, dt) {
  if (!AUDIO.ready || !AUDIO.on) return;
  const ctx = AUDIO.ctx, t = ctx.currentTime;

  const speed = Math.abs(vel);                      // turns per frame
  const drive = clamp(0, 1, speed / 0.012);
  const level = drive * drive * 0.25;               // stays out of the way

  /* The tape runs at half speed throughout - an octave below where the
     texture naturally sits - so winding it up still reads as something
     heavy and slow rather than as a rewind. */
  AUDIO.spinGain.gain.setTargetAtTime(level, t, 0.08);

  const fwd = vel > 0 ? 1 : 0;
  AUDIO.fwdGain.gain.setTargetAtTime(fwd, t, 0.1);
  AUDIO.revGain.gain.setTargetAtTime(1 - fwd, t, 0.1);

  const rate = 0.12 + drive * 0.26;
  AUDIO.fwd.playbackRate.setTargetAtTime(rate, t, 0.1);
  AUDIO.rev.playbackRate.setTargetAtTime(rate, t, 0.1);

  // The room opens a little as it speeds up, then closes again at rest.
  AUDIO.muffle.frequency.setTargetAtTime(520 + drive * 300, t, 0.15);
}


/*
  A cursor that says where it will take you. The step zones are the one place
  the piece asks you to trust an invisible boundary, so rather than a symbol
  that has to be learned, the pointer carries the name of the magnification
  it opens - WEEK, MONTH, YEAR, DAY.

  Drawn once per word into a small canvas and handed to CSS as an image. The
  word is set in the same letterspaced capitals as the ladder in the corner,
  with a dark pass behind it so it holds on a lit sky as well as on black.
*/
const CURSOR_CACHE = {};

function wordCursor(word) {
  if (CURSOR_CACHE[word]) return CURSOR_CACHE[word];

  const W = 108, H = 26, HOTX = 5, HOTY = 13;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");

  g.font = "10px Helvetica, Arial, sans-serif";
  g.textBaseline = "middle";

  // letterspacing by hand, so it matches the ladder on every browser
  const track = 2.2;
  const draw = (x, y) => {
    let cx = x;
    for (const ch of word) {
      g.fillText(ch, cx, y);
      cx += g.measureText(ch).width + track;
    }
  };

  // a dark pass first, so the word survives a bright sky
  g.fillStyle = "rgba(0,0,0,0.55)";
  for (const [dx, dy] of [[-1,0],[1,0],[0,-1],[0,1],[1,1],[-1,-1]]) {
    draw(18 + dx, HOTY + dy);
  }

  g.fillStyle = "rgba(255,255,255,0.96)";
  draw(18, HOTY);

  // the point itself, so it still aims at something
  g.fillStyle = "rgba(255,255,255,0.95)";
  g.beginPath(); g.arc(HOTX, HOTY, 2.2, 0, TAU); g.fill();
  g.strokeStyle = "rgba(0,0,0,0.5)";
  g.lineWidth = 1;
  g.beginPath(); g.arc(HOTX, HOTY, 2.8, 0, TAU); g.stroke();

  CURSOR_CACHE[word] = `url(${c.toDataURL()}) ${HOTX} ${HOTY}, pointer`;
  return CURSOR_CACHE[word];
}

// What each step zone opens, from wherever you are now.
function zoneWord(zone) {
  if (zone === "in") {
    return layer === LAYER.YEAR ? "MONTH"
         : layer === LAYER.MONTH ? "WEEK"
         : layer === LAYER.WEEK ? "DAY" : null;
  }
  if (zone === "out") {
    return layer === LAYER.DAY ? "WEEK"
         : layer === LAYER.WEEK ? "MONTH"
         : layer === LAYER.MONTH ? "YEAR" : null;
  }
  return null;
}

/* =========================
   RENDER LOOP
========================= */

let cursorShown = "";
let lastFrameTime = performance.now();

function draw(nowMs) {
  const dtMs = nowMs - lastFrameTime;
  const dt = Math.min(0.05, dtMs / 1000);
  lastFrameTime = nowMs;
  watchFrameCost(nowMs, dtMs);

  updateTime();
  hoverInfo = "";
  hoverSlot = null;

  // Touch focus fades on its own, returning the crown to calm
  if (touchFocusUntil && nowMs > touchFocusUntil) {
    touchFocusUntil = 0;
    mouseX = -1;
    mouseY = -1;
  }

  if (selMonthAbs === null) selMonthAbs = timeState.monthAbs;
  if (selYear === null) selYear = Math.floor(timeState.monthAbs / 12);
  if (selDayMs === null) selDayMs = timeState.dateMs;

  /* Elastic band. Travelling away from now stretches it. Once the crown
     settles out there the dwell arms, giving you a beat to work on the week
     you landed on. Touch anything and the dwell restarts. Leave it alone and
     the band lets go and pulls the crown home, harder the further you went. */
  if (!layerAnim && !returningNow) {
    const stretch = unitsFromNow();
    const moving =
      spinSpeed > 0.0025 ||
      Math.abs(camera.target.yaw - camera.yaw) > 0.02 ||
      pointer.held ||
      pointer.dragging;

    /* Reading the crown is using it. The cursor resting on the ring, or the
       composer open while a moment is being named, holds the band rather than
       letting the dwell run down - so working on a tag is never interrupted
       by the crown snapping home. It only lets go once you have left it. */
    /* Holding it while the cursor is anywhere near the crown was far too
       generous - the proximity reaches nearly three hundred pixels out, so
       almost anywhere on screen kept the band armed forever and it read as
       broken. It now holds only when you are genuinely on the form, or
       naming a moment. */
    if (stretch < CONFIG.elasticMinStretch || moving ||
        nearRing > 0.84 || composing) {
      elasticArmed = false;
    } else if (!elasticArmed) {
      elasticArmed = true;
      elasticSince = nowMs;
    }

    if (elasticArmed) {
      if (lastInteraction > elasticSince) elasticSince = lastInteraction;
      if (nowMs - elasticSince > CONFIG.elasticDwellMs) goToNow(true);
    }
  }

  /* Idle drift home: yaw, tilt, and zoom back to the framed
     view of whatever layer you're on. It waits for the crown to actually
     be still - not just for the cursor to stop - so a spin in flight is
     never cut short and dragged back. Coasting, easing toward a target, or
     a held jog wheel all count as motion. Once the drift has taken hold it
     latches on, so its own gentle movement doesn't stall it half way. */
  // The drift home waits on the same terms as the band: a cursor on the crown
  // or an open composer means you are still working, so it holds off.
  if (nearRing > 0.84 || composing) driftEngaged = false;

  if (nowMs - lastInteraction > CONFIG.idleDelayMs && !layerAnim &&
      nearRing < 0.84 && !composing) {
    const spinning =
      spinSpeed > 0.0025 ||
      Math.abs(camera.target.yaw - camera.yaw) > 0.02 ||
      pointer.held ||
      pointer.dragging;

    if (!spinning) driftEngaged = true;

    if (driftEngaged) {
      const k = 1 - Math.exp(-CONFIG.idleRate * dt);
      const yawHome = TAU * Math.round(camera.target.yaw / TAU);

      camera.target.yaw += (yawHome - camera.target.yaw) * k;
      camera.target.tilt += (layerTilt() - camera.target.tilt) * k;
      camera.target.zoomLog += (Math.log(fitZoom) - camera.target.zoomLog) * k;
    }
  }

  // (Whole-turn folding into weekOffset was removed: it fought the idle
  // drift and made the dates lurch. The numbering is stable at any yaw, so
  // the raw yaw can grow freely without affecting which dates show.)

  // Grab-throttle: while a finger is held off-centre, spin the
  // crown continuously - faster the further from the grab point,
  // like a jog wheel. A cubic response keeps small holds gentle.
  if (pointer.held && !layerAnim) {
    const off = clamp(-1, 1, (pointer.curX - pointer.grabX) / (viewW * 0.42));
    const DEAD = 0.03;
    if (Math.abs(off) > DEAD) {
      const s = Math.sign(off);
      const mag = (Math.abs(off) - DEAD) / (1 - DEAD);
      camera.target.yaw += s * Math.pow(mag, 3) * 7.5 * dt;
    }
  }

  updateCamera(dt);

  /* Spin navigation no longer folds whole turns into the unit. The raw yaw
     grows freely as you spin; the belt-drive numbering is stable at any
     yaw, so the dates stay correct, and goToNow reads the accumulated yaw
     to spin back exactly as far as you travelled. */

  /* The units are home, so the last stretch of a return aims at the crown's
     true resting angle. The month and year anchor their current unit
     differently from the rest, which leaves a residual offset after the
     spin; this hands that offset to the slow settle instead of leaving it
     for the idle drift to mop up much later. */
  if (returningNow && !returnRush && signedUnitsFromNow() === 0) {
    camera.target.yaw = 0;
  }

  /* Sound follows the state rather than the events: the tape texture tracks
     how the crown is turning, and the heartbeat only runs while you are
     inside a single day, quieter as the crown strips back to rest. */
  soundSpin(spinVel, dt);
  radioRead(nowMs);
  if (AUDIO.ready && AUDIO.on && layer === LAYER.DAY && !layerAnim) {
    if (nowMs > AUDIO.heartNext) {
      soundHeart(0.55 * (1 - 0.5 * restAmt));
      AUDIO.heartNext = nowMs + 1150 + Math.random() * 90;
    }
  } else if (AUDIO.ready) {
    AUDIO.heartNext = nowMs + 600;
  }

  ctx.clearRect(0, 0, viewW, viewH);
  hitTargets = [];

  const zoom = cameraZoom();
  const cx = viewW / 2;
  const cy = viewH / 2 + 20;
  const tilt = camera.tilt;

  const R = CONFIG.baseRadius * zoom;
  const A = CONFIG.baseAmplitude * zoom;

  lastView.cx = cx;
  lastView.cy = cy;
  lastView.R = R;
  lastView.tilt = tilt;

  /* Cursor proximity to the ring drives the engraving */

  nearRing = 0;
  if (mouseX >= 0) {
    const ex = mouseX - cx;
    const ey = (mouseY - cy) / Math.max(0.05, tilt);
    const distRing = Math.abs(Math.hypot(ex, ey) - R);
    nearRing = clamp(0, 1, 1 - (distRing - 70 * zoom) / (150 * zoom));
  }
  // Raw proximity is kept separate from the rest-damped value, or rest would
  // feed its own condition and latch itself on once it had engaged.
  const infoTarget = nearRing * (1 - restAmt);
  infoAmt += (infoTarget - infoAmt) * (1 - Math.exp(-3.5 * dt));

  /* Rest means you have left it alone, not that you are holding still to
     read. Hovering the crown keeps everything lit however long you look;
     only stillness with the cursor away from the ring strips it back. */
  const settledStill =
    spinSpeed < 0.0005 &&
    !layerAnim &&
    nearRing < 0.15 &&
    (nowMs - lastInteraction) > CONFIG.restDelayMs;
  const restTarget = settledStill ? 1 : 0;
  // Slower easing on the way into rest (stems fading out) than on the way
  // back, so the strip-down lingers and the return is prompt.
  const restRate = restTarget > restAmt ? 0.9 : 3;
  restAmt += (restTarget - restAmt) * (1 - Math.exp(-restRate * dt));

  // Projected markers stay fully present through any activity - cursor
  // movement, spinning, or the crown still drifting to a settle. The fade
  // only begins once everything is genuinely quiet: no recent interaction
  // AND no motion at all. Then it dissolves slowly.
  if (returningNow && Math.abs(camera.yaw) < 0.02) returningNow = false;
  const idleMs = nowMs - lastInteraction;
  const stillMoving =
    spinSpeed > 0.0004 ||
    Math.abs(camera.target.yaw - camera.yaw) > 0.0015;
  // Reading counts as using it: with the cursor on the crown the projection
  // stays lit however long you look. It only goes once you have left it.
  const fullyQuiet =
    idleMs > CONFIG.projQuietMs && !stillMoving && !layerAnim && nearRing < 0.84;
  const projWant = (!returningNow && !fullyQuiet) ? 1 : 0;
  // Much slower on the way out than back in: a gentle, gradual dissolve
  // once quiet, but a prompt return the moment anything stirs.
  const projRate = projWant < projFade ? 0.8 : 4;
  projFade += (projWant - projFade) * (1 - Math.exp(-projRate * dt));

  /* The light, the sky and the air belong to the space, not to whichever
     crown happens to be in it - so they are drawn before the branch below
     and stay put right through a change of magnification. Zooming used to
     drop back to black for the length of the move and then switch the light
     on again at the far end, which read as a fault rather than a transition. */
  const skyMs = (Math.abs(camera.yaw) > 0.03 && !layerAnim)
    ? projectionMoment().ms
    : timeState.dateMs + (timeState.h * 60 + timeState.m) * 60000;

  const skyRot = layerRot(layer, layerUnit(layer)) + camera.yaw;
  const skyCrests = layer === LAYER.DAY ? 1
                  : layer === LAYER.WEEK ? 7
                  : layer === LAYER.MONTH ? monthCrownWeeks(selMonthAbs).length
                  : yearCrests(selYear);

  const bandTopSky = cy - (R * tilt + A + 60 * zoom);
  const overSky = mouseY >= 0 && mouseY < bandTopSky;
  /* The stars are simply out. Looking up brings them a little further
     forward, but they are never something you have to go and find - and they
     have nothing to do with the light switch, since a dark sky is exactly
     when they matter. */
  SKY.starAmt += ((overSky ? 1 : 0.86) - SKY.starAmt) * (1 - Math.exp(-2.2 * dt));

  /* Through a transition the incoming crown is still travelling, so the
     shadow follows it in rather than waiting at its destination. */
  let castScale = 1, castFade = 1;
  if (layerAnim) {
    const tp = clamp(0, 1, (nowMs - layerAnim.start) / CONFIG.layerAnimMs);
    const te = easeInOut(tp);
    castScale = layerAnim.dir > 0
      ? CONFIG.layerScaleIn + (1 - CONFIG.layerScaleIn) * te
      : CONFIG.layerScaleOut + (1 - CONFIG.layerScaleOut) * te;
    castFade = te;
  }

  drawSkyLight(skyMs, R, A, tilt, cx, cy, skyRot,
               1 - restAmt * 0.35, skyCrests, castScale, castFade);
  drawSky(skyMs, R, tilt, cx, cy, skyRot, SKY.starAmt * (1 - restAmt * 0.5));

  /* ---- Layer transition: the optical crossfade ---- */

  if (layerAnim) {
    const p = clamp(0, 1, (nowMs - layerAnim.start) / CONFIG.layerAnimMs);
    const e = easeInOut(p);

    const { from, to, dir } = layerAnim;

    // Zooming out: the old layer shrinks away, the new one
    // arrives from beyond the frame. Diving in: mirrored.
    const outScale = dir > 0
      ? 1 + (CONFIG.layerScaleOut - 1) * e
      : 1 + (CONFIG.layerScaleIn - 1) * e;

    const inScale = dir > 0
      ? CONFIG.layerScaleIn + (1 - CONFIG.layerScaleIn) * e
      : CONFIG.layerScaleOut + (1 - CONFIG.layerScaleOut) * e;

    drawLayerCrown(
      from, layerUnit(from), cx, cy, zoom * outScale,
      (1 - e), (1 - e), layerRot(from, layerUnit(from)), false
    );

    drawLayerCrown(
      to, layerUnit(to), cx, cy, zoom * inScale,
      e, e, layerRot(to, layerUnit(to)) + camera.yaw, false
    );

    if (p >= 1) layerAnim = null;

  } else {

    /* ---- One crown, whatever the layer. Weeks navigate the
       same way months and years do: spin, arrows, keys. ---- */

    const bandTop = cy - (R * tilt + A + 60 * zoom);
    const bandBottom = cy + (R * tilt + 50 * zoom);

    const wantNav =
      (mouseY >= 0 && (mouseY < bandTop || mouseY > bandBottom)) ||
      (mouseX >= 0 && (mouseX < 70 || mouseX > viewW - 70));

    revealAmt += ((wantNav ? 1 : 0) - revealAmt) * (1 - Math.exp(-5 * dt));
    document.body.classList.toggle("stack", wantNav);

    const unit = layerUnit(layer);
    const rot = layerRot(layer, unit) + camera.yaw;

    /* The station, read into the form itself - and drawn before the crown, so
       the white line is laid over the top of it and stays white. Painted
       afterwards the haze tinted the line, which was the wrong way round: the
       colour belongs under the curve, the line belongs on it. */
    {
      const crestsEq = layer === LAYER.DAY ? 1
                     : layer === LAYER.WEEK ? 7
                     : layer === LAYER.MONTH ? monthCrownWeeks(selMonthAbs).length
                     : yearCrests(selYear);
      const WHeq = layer === LAYER.DAY ? waveHeights(1, 2.2) : waveHeights(crestsEq);
      const Aeq = CONFIG.baseAmplitude * zoom * (layer === LAYER.DAY ? 1.9 : 1);
      drawEqualiser(WHeq, R, Aeq, rot, tilt, cx, cy, 1, crestsEq, restAmt);
    }

    drawLayerCrown(layer, unit, cx, cy, zoom, 1, 1, rot, true);

    /*
      Projection marker. When spun off now, the point at
      front-and-centre of the crown carries the projected
      moment - drawn just like the current time: a floating
      label in the colour of that hour's light, over a soft
      spotlight, riding the wave at the front of the ring.
    */
    if (Math.abs(camera.yaw) > 0.03 && !layerAnim) {
      const pm = projectionMoment();
      if (pm) {
        // Front-and-centre: the same screen point the current
        // time occupies. The projection is born there as now
        // rotates away, and stays there - reading the moment at
        // centre - until it merges back into now.
        const crests = layer === LAYER.DAY ? 1
                     : layer === LAYER.WEEK ? 7
                     : layer === LAYER.MONTH ? monthCrownWeeks(selMonthAbs).length
                     : yearCrests(selYear);
        const WHp = layer === LAYER.DAY ? waveHeights(1, 2.2) : waveHeights(crests);
        const Rp = CONFIG.baseRadius * zoom;
        const Ap = CONFIG.baseAmplitude * zoom * (layer === LAYER.DAY ? 1.9 : 1);

        /*
          Front-and-centre is a FIXED screen point - the near
          face of the ring, directly below the crown's centre -
          exactly where the current-time marker sits. It never
          moves as the crown spins; only the wave height there
          changes. angle = PI/2 gives x = cx, yBase = cy + R*tilt.
        */
        // Ride the wave at the projected moment's OWN position -
        // exactly the way the current time sits on its point of
        // the curve, not pinned to the front. The moment's
        // parametric t comes from the same mapping the now marker
        // uses, so the projection sits on the crest or trough
        // where that time actually falls, and travels along the
        // wave as you spin.
        const projT = projectionT(pm);
        const pF = pointAtT(projT, WHp, Rp, Ap, rot, tilt, cx, cy);
        const d = new Date(pm.ms);
        const hourFloat = d.getUTCHours() + d.getUTCMinutes() / 60;
        const pcol = pm.hasTime ? daylightColor(hourFloat) : "#c9ccd0";
        const pf = 12 * zoom;

        // Projected time is a faint, temporary navigation aid -
        // much lighter than the current time, which is always the
        // most present thing - and it fades away when idle. It rides the
        // exact same track as the current marker: same size, same offset,
        // hugging the curve rather than floating above it.
        const pAlpha = projFade;
        const projGap = pf * 0.55;
        ctx.font = `${pf}px Helvetica, Arial`;
        let lbl;
        if (layer === LAYER.DAY || layer === LAYER.WEEK) {
          lbl = `${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}`;
        } else if (layer === LAYER.MONTH) {
          // The month shows its projected day on the crest and stem, like
          // today's marker, so it needs no floating label here.
          lbl = null;
        } else {
          lbl = `${String(d.getUTCDate()).padStart(2,"0")} ${MONTHS[d.getUTCMonth()]}`;
        }
        const projHalfW = lbl ? ctx.measureText(lbl).width / 2 : 0;
        const projY = markerY(projT, WHp, Rp, Ap, rot, tilt, cx, cy, projGap, projHalfW);
        ctx.globalAlpha = 0.34 * pAlpha;
        ctx.fillStyle = pcol;
        ctx.textAlign = "center";
        if (lbl) ctx.fillText(lbl, pF.x, projY - pf * 0.4);
        ctx.globalAlpha = 1;

        /* The projected moment is a place, so you can go to it. Click it and
           you land on that day with that time front and centre - the same
           moment you were pointing at, one magnification closer. It is
           something you aim at, so it takes the click ahead of whatever
           chunk happens to lie beneath it. */
        if (layer !== LAYER.DAY && pAlpha > 0.2) {
          const pd = new Date(pm.ms);
          const pDayMs = Date.UTC(
            pd.getUTCFullYear(), pd.getUTCMonth(), pd.getUTCDate()
          );
          const pMins = pm.hasTime
            ? pd.getUTCHours() * 60 + pd.getUTCMinutes()
            : 12 * 60;
          hitTargets.push({
            x: pF.x, y: projY - pf * 0.4,
            r: Math.max(20, pf * 1.8),
            primary: true,
            hint: `Open ${infoDate(pDayMs)}` +
              (pm.hasTime ? ` at ${minToHHMM(pMins)}` : ""),
            action: () => diveIntoDayAt(pDayMs, pMins)
          });
        }
      }
    }
  }

  /*
    Findability. The cursor tells you what a click will do, and
    the info strip names it: pointer over anything enterable,
    over the void that steps out, over a chunk you can name.
  */
  {
    let cursor = pointer.dragging ? "grabbing" : "default";

    if (!pointer.dragging && mouseX >= 0 && !layerAnim) {
      let over = null;
      for (const h of hitTargets) {
        if (Math.hypot(mouseX - h.x, mouseY - h.y) < h.r) { over = h; break; }
      }

      const zone = stepZone(mouseX, mouseY);

      /* The step zones name what they open. Going in and coming out are the
         same gesture in opposite directions, and a plain pointer says only
         that something will happen - the word says what.

         Once the crown has settled the word goes with everything else: at
         rest there is nothing on screen but the line and the time, and a
         label floating over it would be the one thing left shouting. */
      const word = restAmt > 0.5 ? null : zoneWord(zone);
      if (word) cursor = wordCursor(word);
      else if (over || hoverSlot) cursor = "pointer";

      if (!hoverInfo) {
        if (over && over.hint) {
          hoverInfo = over.hint;
        } else if (zone === "in") {
          const inName =
            layer === LAYER.YEAR ? "the month" :
            layer === LAYER.MONTH ? "the week" : "the day";
          hoverInfo = `Step in to ${inName}`;
        } else if (zone === "out") {
          const outName =
            layer === LAYER.DAY ? "the week" :
            layer === LAYER.WEEK ? "the month" : "the year";
          hoverInfo = `Step out to ${outName}`;
        }
      }
    }

    if (cursor !== cursorShown) {
      cursorShown = cursor;
      cv.style.cursor = cursor;
    }
  }

  /* Now beacon: shows the live time at rest, and the projected
     moment you're pointed at once you spin or scroll away. */

  {
    const spunOff = Math.abs(camera.yaw) > 0.03 && !layerAnim;
    projNow = spunOff ? projectionMoment() : null;

    let clockStr, col;
    if (projNow) {
      const d = new Date(projNow.ms);
      clockStr = projNow.hasTime
        ? `${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}`
        : `${String(d.getUTCDate()).padStart(2,"0")} ${MONTHS[d.getUTCMonth()]}`;
      col = projNow.hasTime
        ? daylightColor(d.getUTCHours() + d.getUTCMinutes()/60)
        : "#b9b9b9";
      if (nowMs >= flashUntil) flashInfo("Projected · " + projLabel(projNow), 400);
    } else {
      clockStr =
        `${String(timeState.h).padStart(2, "0")}:` +
        `${String(timeState.m).padStart(2, "0")}`;
      col = daylightColor(timeState.h + timeState.m / 60);
    }

    if (clockStr !== beaconShown) {
      beaconShown = clockStr;
      beaconEl.textContent = clockStr;
    }
    if (col !== beaconColor) {
      beaconColor = col;
      beaconEl.style.color = col;
    }

    // The now readout fades the further the projected moment sits from now.
    // Close to now it is full; travel away and it dissolves, so the live
    // time recedes as you point at more distant moments.
    const nowOpacity = clamp(0.12, 1, 1 - unitsFromNow() / 3);
    if (nowOpacity !== beaconOpacity) {
      beaconOpacity = nowOpacity;
      beaconEl.style.opacity = nowOpacity.toFixed(3);
    }

    const away = !isAtNow() ||
                 Math.abs(camera.yaw) > 0.6 ||
                 layerAnim !== null;
    if (away !== beaconAway) {
      beaconAway = away;
      beaconEl.classList.toggle("away", away);
    }
  }

  /* Ladder state */

  document.getElementById("lDay").classList.toggle("on", layer === LAYER.DAY);
  document.getElementById("lWeek").classList.toggle("on", layer === LAYER.WEEK);
  document.getElementById("lMonth").classList.toggle("on", layer === LAYER.MONTH);
  document.getElementById("lYear").classList.toggle("on", layer === LAYER.YEAR);

  /* --- Debug HUD --- */

  if (debug) {
    const layerName = ["WEEK", "MONTH", "YEAR", "DAY"][layer];
    hud.textContent =
      `AMS ${DAYS[timeState.dayIdx]} ` +
      `${String(timeState.h).padStart(2, "0")}:` +
      `${String(timeState.m).padStart(2, "0")}:` +
      `${String(timeState.s).padStart(2, "0")}\n` +
      `layer ${layerName}  ` +
      `week ${weekOffset >= 0 ? "+" : ""}${weekOffset}  ` +
      `month ${monthTitle(selMonthAbs)}  ` +
      `year ${selYear}\n` +
      `yaw ${camera.yaw.toFixed(2)}  ` +
      `tilt ${camera.tilt.toFixed(2)}  ` +
      `zoom ${zoom.toFixed(2)}  ` +
      `anim ${layerAnim ? "yes" : "no"}\n` +
      `src ${new Date().toISOString()} -> AMS ` +
      `${new Date(timeState.dateMs).toISOString().slice(0, 10)} ` +
      `dayIdx ${timeState.dayIdx}`;
  }

  /* Publish the info strip. A flash message (from the hand
     toggle, exports, etc.) takes the strip for its lifetime;
     otherwise the hovered line shows. */

  /* The station says what it is doing when nothing else is being pointed at,
     so a stream that plays but cannot be read is never a mystery. */
  if (!hoverInfo && RADIO.on) {
    if (RADIO.state === "starting") hoverInfo = "Tuning in…";
    else if (RADIO.state === "failed") {
      hoverInfo = "Station unreachable after " + RADIO.tried.length +
        " address" + (RADIO.tried.length === 1 ? "" : "es") + " · " +
        (RADIO.why === 4
          ? "something answered but it was not playable audio - the address is most likely a player page rather than the stream itself"
          : RADIO.why === 2
          ? "the address could not be reached"
          : RADIO.why === 3
          ? "the audio would not decode"
          : "no reason given") +
        " · press U to paste the stream address, R to retry";
    } else if (RADIO.state === "plain" && RADIO.showBars) {
      /* Still listening for a spectrum, or given up on one. Saying the
         station refuses to be read while the attempt is still in flight was
         simply wrong most of the time - a stream takes seconds to arrive. */
      hoverInfo = "Playing · the station does not allow reading, so the crown stays still";
    } else if (RADIO.state === "playing" && RADIO.tried.length) {
      hoverInfo = "Playing · working address: " + RADIO.url;
    }
  }

  let line = hoverInfo;
  if (nowMs < flashUntil) line = flashMsg;
  else if (flashUntil) { flashUntil = 0; flashMsg = ""; }

  if (line !== hoverInfoShown) {
    hoverInfoShown = line;
    infoEl.textContent = line;
  }
  document.body.classList.toggle("info", line !== "");

  requestAnimationFrame(draw);
}

/* Both switches are remembered, so the piece opens the way you left it. */
const PREF_KEY = "weekwave.prefs.v1";

function loadPrefs() {
  if (!canStore) return;
  try {
    const p = JSON.parse(localStorage.getItem(PREF_KEY) || "{}");
    if (typeof p.sound === "boolean") AUDIO.on = p.sound;
    if (typeof p.light === "boolean") SKY.lightOn = p.light;
    if (typeof p.stars === "boolean") SKY.starsOn = p.stars;
    if (typeof p.bars === "boolean") RADIO.showBars = p.bars;
  } catch (e) {}
}

function savePrefs() {
  if (!canStore) return;
  try {
    localStorage.setItem(PREF_KEY,
      JSON.stringify({
        sound: AUDIO.on, light: SKY.lightOn,
        stars: SKY.starsOn, bars: RADIO.showBars
      }));
  } catch (e) {}
}

loadPrefs();

const soundBtn = document.getElementById("sound");
soundBtn.classList.toggle("on", AUDIO.on);

/* The light, the shadow and the colour, or none of it. Off leaves the crown
   as it was built - white on black, nothing but the form and the time. */
const lightBtn = document.getElementById("light");
lightBtn.classList.toggle("on", SKY.lightOn);

/* The sky overhead, or none. Off leaves the daylight and the shadows working
   as they were - the two are separate readings of the same sky, and with both
   off there is nothing left but the line and the time, which is the piece
   stripped to what it is. */
const starsBtn = document.getElementById("stars");
starsBtn.classList.toggle("on", SKY.starsOn);

starsBtn.addEventListener("click", () => {
  touch();
  SKY.starsOn = !SKY.starsOn;
  starsBtn.classList.toggle("on", SKY.starsOn);
  savePrefs();
  flashInfo(SKY.starsOn ? "Stars on" : "Stars off", 1600);
});

/* The station, in three states rather than two. Off, then playing, then
   playing with the crown reading the music - because the equaliser is a
   different thing from the radio and someone may well want one without the
   other, and a fourth switch in the corner is worse than a third click. */
const radioBtn = document.getElementById("radio");

function radioLabel() {
  return !RADIO.on ? "RADIO"
       : RADIO.showBars ? "RADIO ~"
       : "RADIO ·";
}

function applyRadioState() {
  radioBtn.textContent = radioLabel();
  radioBtn.classList.toggle("on", RADIO.on);
}

radioBtn.addEventListener("click", () => {
  touch();

  if (!RADIO.on) {
    RADIO.on = true;
    RADIO.showBars = false;
    radioStart();
    flashInfo("Tuning in…", 2200);

  } else if (!RADIO.showBars) {
    RADIO.showBars = true;
    /* Reading the music needs the audio engine, which only exists when sound
       is switched on - the spectrum is taken from the same graph the crown's
       own noises run through. Better to say so than to sit there still. */
    if (!AUDIO.on) {
      flashInfo("Reading the music · needs SOUND on", 2600);
    } else {
      flashInfo("Reading the music", 1600);
    }

  } else {
    RADIO.on = false;
    RADIO.showBars = false;
    radioStop();
    flashInfo("Radio off", 1400);
  }

  applyRadioState();
  savePrefs();
});

applyRadioState();


lightBtn.addEventListener("click", () => {
  touch();
  SKY.lightOn = !SKY.lightOn;
  lightBtn.classList.toggle("on", SKY.lightOn);
  LIGHTBUF.key = "";
  savePrefs();
  flashInfo(SKY.lightOn ? "Daylight on" : "Daylight off", 1600);
});

soundBtn.addEventListener("click", () => {
  touch();
  AUDIO.on = !AUDIO.on;
  soundBtn.classList.toggle("on", AUDIO.on);
  savePrefs();

  // the engine may already be up for the radio; this only opens or closes it
  if (AUDIO.ready && AUDIO.master) {
    AUDIO.master.gain.setTargetAtTime(AUDIO.on ? 0.17 : 0,
                                      AUDIO.ctx.currentTime, 0.05);
  }

  if (AUDIO.on) {
    wakeAudio();
    flashInfo("Sound on", 1400);
  } else {
    if (AUDIO.ready) {
      AUDIO.spinGain.gain.setTargetAtTime(0, AUDIO.ctx.currentTime, 0.05);
      if (AUDIO.ctx.suspend) AUDIO.ctx.suspend();
    }
    flashInfo("Sound off", 1400);
  }
});

// Any first gesture unlocks the context.

requestAnimationFrame(draw);

// Find out where we are, once, quietly - the sky needs it.
locate();

// Hand tracking no longer starts on load - it is opt-in via
// the camera is never touched, so nothing prompts for it. Formerly the
// person chooses it. Mouse, touch, keys and clicks are the
// default and always work.
</script>
</body>
</html>
